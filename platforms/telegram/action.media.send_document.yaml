meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.media.send_document
  name: Send Document
  category: Media
  type: Action
  platform: telegram
  description: "Send a file/document to a chat."
  version: "1.0.0"
  discovery:
    purpose: "Upload and send a document (PDF, ZIP, etc.) to a Telegram chat."
    usage_context: "Use to send invoices, reports, or logs as downloadable files via Telegram."
    agent_hints:
      - "Requires a URL to a document or a file object."
    waml_examples:
      - title: "Send Report PDF"
        waml: |
          - step: send_doc
            call: telegram.action.media.send_document
            with:
               chat_id: "123456789"
               document: "https://example.com/report.pdf"
               caption: "Monthly growth report."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: document
      type: string # Blob ID / SecureTicket
    - name: caption
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sendDocument"
      headers:
        Content-Type: >
          "multipart/form-data"
      body:
        chat_id: inputs.chat_id
        document:
          ticket: inputs.document
        caption: inputs.caption
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
