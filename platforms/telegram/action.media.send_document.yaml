meta:
  id: telegram.media.send_document
  name: Send Document
  category: Media
  type: Action
  platform: telegram
  description: "Send a file/document to a chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: document
      type: string # Blob ID / SecureTicket
    - name: caption
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/sendDocument"
      headers:
        Content-Type: "multipart/form-data"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
        document:
          ticket: "{{ get 'inputs.document' }}"
        caption: "{{ get 'inputs.caption' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
