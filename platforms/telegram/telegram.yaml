meta:
  permissions: ["network:api.telegram.org"]
  id: telegram
  name: Telegram
  type: Platform
  category: Communication
  description: Secure, real-time messaging via the Telegram Bot API.
  version: 1.0.0
  discovery:
    purpose: Broadcast notifications, build interactive bots, and manage chat groups.
    usage_context: Use this for high-speed alerts, customer support bots, and real-time community engagement.
    agent_hints:
      - "Requires a Bot Token from @BotFather."
      - "Bots can only message users who have already started a conversation."

config:
  base_url: >
    "https:'=//api.telegram.org/bot" + settings.bot_token'
  headers:
    Content-Type: application/json

settings:
  - name: bot_token
    label: Bot Token
    type: password
    required: true
