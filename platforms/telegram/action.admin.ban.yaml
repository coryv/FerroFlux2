meta:
  id: telegram.admin.ban
  name: Ban User
  category: Admin
  type: Action
  platform: telegram
  description: "Ban a user from a chat, group, or channel."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: user_id
      type: number
    - name: until_date
      type: number # Unix timestamp
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/banChatMember"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
        user_id: "{{ get 'inputs.user_id' }}"
        until_date: "{{ get 'inputs.until_date' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
