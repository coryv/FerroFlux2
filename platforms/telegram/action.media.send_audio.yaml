meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.media.send_audio
  name: Send Audio
  category: Media
  type: Action
  platform: telegram
  description: "Send an audio file to a chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: audio
      type: string # Blob ID / SecureTicket
    - name: caption
      type: string
    - name: title
      type: string
    - name: performer
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sendAudio"
      headers:
        Content-Type: >
          "multipart/form-data"
      body:
        chat_id: inputs.chat_id
        audio:
          ticket: inputs.audio
        caption: inputs.caption
        title: inputs.title
        performer: inputs.performer
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
