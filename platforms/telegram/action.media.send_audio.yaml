meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.media.send_audio
  name: Send Audio
  category: Media
  type: Action
  platform: telegram
  description: Send an audio file to a chat.
  version: 1.0.0
  discovery:
    purpose: Upload and send an audio file to a Telegram chat.
    usage_context: Use to send voice memos, recorded clips, or audio alerts.
    agent_hints:
      - "Requires a URL to an audio file or a file object."
    waml_examples:
      - title: Send Audio Note
        waml: |
          - step: send_audio
            call: telegram.action.media.send_audio
            with:
               chat_id: 123456789
               audio: "https://example.com/note.mp3"
               caption: Voice memo attached.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: audio
      type: string # Blob ID / SecureTicket
    - name: caption
      type: string
    - name: title
      type: string
    - name: performer
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/sendAudio"
      headers:
        Content-Type: >
          "multipart/form-data"
      body:
        chat_id: =inputs.chat_id
        audio:
          ticket: =inputs.audio
        caption: =inputs.caption
        title: =inputs.title
        performer: =inputs.performer
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
