meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.messages.new
  name: New Message
  category: Messages
  type: Trigger
  platform: telegram
  description: "Polling trigger for new messages in Telegram."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object

  settings:
    - name: limit
      label: "Batch Limit"
      type: number
      default: 100
    - name: timeout
      label: "Long Polling Timeout (sec)"
      type: number
      default: 30

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/getUpdates"
      query:
        offset: "{{ get 'event.cursor' }}"
        limit: "{{ get 'settings.limit' }}"
        timeout: "{{ get 'settings.timeout' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

  - id: extract_updates
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/result"
    returns:
      result: updates_array

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: iterate
        params:
          items: "{{ steps.extract_updates.updates_array }}"
          cursor_key: "update_id"
          cursor_increment: 1
          # This tells the engine to emit one event per item in updates_array
          # and update the trigger's cursor (event.cursor) to update_id + 1.
          port: message
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
