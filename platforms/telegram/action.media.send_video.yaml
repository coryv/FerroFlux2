meta:
  id: telegram.media.send_video
  name: Send Video
  category: Media
  type: Action
  platform: telegram
  description: "Send a video file to a chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: video
      type: string # Blob ID / SecureTicket
    - name: caption
      type: string
    - name: width
      type: number
    - name: height
      type: number
    - name: duration
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/sendVideo"
      headers:
        Content-Type: "multipart/form-data"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
        video:
          ticket: "{{ get 'inputs.video' }}"
        caption: "{{ get 'inputs.caption' }}"
        width: "{{ get 'inputs.width' }}"
        height: "{{ get 'inputs.height' }}"
        duration: "{{ get 'inputs.duration' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
