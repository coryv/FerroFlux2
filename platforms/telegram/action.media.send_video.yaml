meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.media.send_video
  name: Send Video
  category: Media
  type: Action
  platform: telegram
  description: Send a video file to a chat.
  version: 1.0.0
  discovery:
    purpose: Upload and send a video file to a Telegram chat.
    usage_context: Use to send visual evidence, recorded bugs, or status logs via video.
    agent_hints:
      - "Requires a URL to a video file or a file object."
    waml_examples:
      - title: Send Video Clip
        waml: |
          - step: send_vid
            call: telegram.action.media.send_video
            with:
               chat_id: 123456789
               video: "https://example.com/recorded.mp4"
               caption: Session recording.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: video
      type: string # Blob ID / SecureTicket
    - name: caption
      type: string
    - name: width
      type: number
    - name: height
      type: number
    - name: duration
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sendVideo"
      headers:
        Content-Type: >
          "multipart/form-data"
      body:
        chat_id: =inputs.chat_id
        video:
          ticket: =inputs.video
        caption: =inputs.caption
        width: =inputs.width
        height: =inputs.height
        duration: =inputs.duration
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
