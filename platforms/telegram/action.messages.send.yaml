meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.messages.send
  name: Send Message
  category: Messages
  type: Action
  platform: telegram
  description: "Send a text message to a Telegram chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message
      type: object
  settings:
    - name: parse_mode
      label: "Parse Mode"
      type: select
      required: false
      default: "MarkdownV2"
      options:
        - value: "MarkdownV2"
          label: "MarkdownV2"
        - value: "HTML"
          label: "HTML"
        - value: "None"
          label: "None"

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/sendMessage"
      headers: "{{ platform.headers }}"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
        text: "{{ get 'inputs.text' }}"
        parse_mode: "{{ get 'settings.parse_mode' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
