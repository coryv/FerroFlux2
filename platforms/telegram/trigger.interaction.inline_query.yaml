meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.inline_query
  name: New Inline Query
  category: Interaction
  type: Trigger
  platform: telegram
  description: Polls for inline queries from users typing the bot's username.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow when an inline query (e.g., @bot query) is received.
    usage_context: Use to provide dynamic search results or interactive content directly from the message box.
    agent_hints:
      - "Provides the query string and the user who initiated it."
    waml_examples:
      - title: Inline Search
        waml: |
          - step: search
            type: trigger
            call: telegram.trigger.interaction.inline_query

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: query
      type: object
  settings:
    - name: limit
      label: Batch Limit
      type: number
      default: 100


execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/getUpdates"
      query:
        limit: >
          (has(settings.limit) ? settings.limit : '100')
        allowed_updates: >
          "[\"inline_query\"]"
    returns:
      status: status_code
      body: response_body

  - id: extract_updates
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/result"
    returns:
      updates: updates_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_updates.updates_array
          cursor_key: update_id
          port: query
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
