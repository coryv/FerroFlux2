meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.callback_query
  name: New Callback Query
  category: Interaction
  type: Trigger
  platform: telegram
  description: "Polls for callback queries (button clicks)."
  version: "1.0.0"
  discovery:
    purpose: "Initialize a workflow when a user clicks an inline button on a bot-sent message."
    usage_context: "Use to respond to user selections or interactive menu choices."
    agent_hints:
      - "Provides the callback_data and the user details."
    waml_examples:
      - title: "Button Choice"
        waml: |
          - step: on_click
            type: trigger
            call: telegram.trigger.interaction.callback_query
            settings:
               data: "my_data"
            on:
               Success: "handle_choice"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: query
      type: object
  settings:
    - name: limit
      label: "Batch Limit"
      type: number
      default: 100


execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/getUpdates"
      query:
        limit: >
          (has(settings.limit) ? settings.limit : '100')
        allowed_updates: >
          "[\"callback_query\"]"
    returns:
      status: status_code
      body: response_body

  - id: extract_updates
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/result"
    returns:
      updates: updates_array

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: steps.extract_updates.updates_array
          cursor_key: update_id
          port: query
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
