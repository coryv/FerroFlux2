meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.messages.delete
  name: Delete Message
  category: Messages
  type: Action
  platform: telegram
  description: Delete a message from a Telegram chat.
  version: 1.0.0
  discovery:
    purpose: Permanently remove a specific message from a Telegram chat or group.
    usage_context: Use to cleanup bot status messages, remove spam, or manage the visibility of transient updates.
    agent_hints:
      - "Requires chat_id and message_id."
      - "Note that some messages (e.g. from users in private chats) can only be deleted if the bot is an admin."
    waml_examples:
      - title: Delete Message
        waml: |
          - step: cleanup
            call: telegram.action.messages.delete
            with:
               chat_id: =inputs.chat_id
               message_id: 101

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: message_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/deleteMessage"
      headers: =platform.headers
      body:
        chat_id: =inputs.chat_id
        message_id: =inputs.message_id
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
