meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.send_poll
  name: Send Poll
  category: Interaction
  type: Action
  platform: telegram
  description: "Send a native poll to a chat."
  version: "1.0.0"
  discovery:
    purpose: "Send a native poll (voting) to a Telegram chat or group."
    usage_context: "Use to collect feedback from team members or conduct simple surveys within a group."
    agent_hints:
      - "Requires a question and a list of options (strings)."
    waml_examples:
      - title: "Team Lunch Poll"
        waml: |
          - step: poll
            call: telegram.action.interaction.send_poll
            with:
               chat_id: "123456789"
               question: "Where should we have lunch?"
               options: ["Pizza", "Sushi", "Burgers"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: question
      type: string
    - name: options
      type: array
    - name: is_anonymous
      type: boolean
      default: true
    - name: type
      type: string
      default: "regular" # or "quiz"
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sendPoll"
      body:
        chat_id: inputs.chat_id
        question: inputs.question
        options: inputs.options
        is_anonymous: >
          (has(inputs.is_anonymous) ? inputs.is_anonymous : 'true')
        type: >
          (has(inputs.type) ? inputs.type : 'regular')
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
