meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.send_poll
  name: Send Poll
  category: Interaction
  type: Action
  platform: telegram
  description: "Send a native poll to a chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: question
      type: string
    - name: options
      type: array
    - name: is_anonymous
      type: boolean
      default: true
    - name: type
      type: string
      default: "regular" # or "quiz"
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/sendPoll"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
        question: "{{ get 'inputs.question' }}"
        options: "{{ get 'inputs.options' }}"
        is_anonymous: "{{ get 'inputs.is_anonymous' 'true' }}"
        type: "{{ get 'inputs.type' 'regular' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
