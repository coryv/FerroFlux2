meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.answer_callback
  name: Answer Callback Query
  category: Interaction
  type: Action
  platform: telegram
  description: Send answers to callback queries sent from inline keyboards.
  version: 1.0.0
  discovery:
    purpose: Answer a callback query from an inline keyboard button click.
    usage_context: Use to confirm button clicks or show a 'toast' notification to the user.
    agent_hints:
      - "Requires the callback_query_id from the trigger."
    waml_examples:
      - title: Acknowledge Button
        waml: |
          - step: ack
            call: telegram.action.interaction.answer_callback
            with:
               callback_query_id: =steps.trigger.callback_query_id
               text: Processing your request...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: callback_query_id
      type: string
    - name: text
      type: string
    - name: show_alert
      type: boolean
      default: false
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/answerCallbackQuery"
      body:
        callback_query_id: =inputs.callback_query_id
        text: =inputs.text
        show_alert: >
          (has(inputs.show_alert) ? inputs.show_alert : 'false')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
