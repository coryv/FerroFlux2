meta:
  id: telegram.messages.command
  name: New Command
  category: Messages
  type: Trigger
  platform: telegram
  description: "Polls for specific bot commands (e.g. /start)."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
    - name: command
      type: string
  settings:
    - name: command_filter
      label: "Command Filter (Optional, e.g. start)"
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/getUpdates"
      query:
        limit: 100
        allowed_updates: ["message"]
    returns:
      status: status_code
      body: response_body

  - id: extract_updates
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/result"
    returns:
      updates: updates_array

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: iterate
        params:
          items: "{{ steps.extract_updates.updates_array }}"
          cursor_key: "update_id"
          port: message
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
