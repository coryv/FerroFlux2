meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.admin.get_chat
  name: Get Chat Info
  category: Admin
  type: Action
  platform: telegram
  description: "Retrieve information about a specific chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: chat
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/getChat"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: chat
          value: "{{ steps.request.response_body.result }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
