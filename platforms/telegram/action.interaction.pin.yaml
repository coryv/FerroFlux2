meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.pin
  name: Pin Message
  category: Interaction
  type: Action
  platform: telegram
  description: "Pin a specific message in a chat."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: message_id
      type: number
    - name: disable_notification
      type: boolean
      default: false
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/pinChatMessage"
      body:
        chat_id: "{{ get 'inputs.chat_id' }}"
        message_id: "{{ get 'inputs.message_id' }}"
        disable_notification: "{{ get 'inputs.disable_notification' 'false' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
