meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.interaction.pin
  name: Pin Message
  category: Interaction
  type: Action
  platform: telegram
  description: "Pin a specific message in a chat."
  version: "1.0.0"
  discovery:
    purpose: "Pin a specific message in a Telegram chat or group."
    usage_context: "Use to highlight important alerts, instructions, or current tasks within a chat."
    agent_hints:
      - "Requires the chat_id and the message_id."
    waml_examples:
      - title: "Pin Alert"
        waml: |
          - step: pin_msg
            call: telegram.action.interaction.pin
            with:
               chat_id: "123456789"
               message_id: 1024

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: message_id
      type: number
    - name: disable_notification
      type: boolean
      default: false
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/pinChatMessage"
      body:
        chat_id: inputs.chat_id
        message_id: inputs.message_id
        disable_notification: >
          (has(inputs.disable_notification) ? inputs.disable_notification : 'false')
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
