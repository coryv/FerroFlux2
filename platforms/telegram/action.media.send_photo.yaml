meta:
  permissions: ["network:api.telegram.org"]
  id: telegram.media.send_photo
  name: Send Photo
  category: Media
  type: Action
  platform: telegram
  description: Send a photo to a Telegram chat.
  version: 1.0.0
  discovery:
    purpose: Upload and send an image file (photo) to a Telegram chat.
    usage_context: Use to send visual data like reports, dashboards, or error screenshots via Telegram.
    agent_hints:
      - "The photo must be provided as a URL or a file object."
    waml_examples:
      - title: Send Screenshot
        waml: |
          - step: send_img
            call: telegram.action.media.send_photo
            with:
               chat_id: 123456789
               photo: "https://example.com/screenshot.png"
               caption: Latest Dashboard Screenshot

interface:
  inputs:
    - name: Exec
      type: flow
    - name: chat_id
      type: string
    - name: photo
      type: blob
    - name: caption
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sendPhoto"
      body_type: multipart
      parts:
        - name: chat_id
          type: string
          value: =inputs.chat_id
        - name: photo
          type: blob
          field: photo
          # Note: 'field' maps to the key in the multipart form,
          # and 'photo' is the name of the input port of type blob.
        - name: caption
          type: string
          value: =inputs.caption
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
