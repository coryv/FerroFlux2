meta:
  permissions: ["network:api.notion.com"]
  id: notion.search.post
  name: Search
  category: Search
  type: Action
  platform: notion
  description: Searches for pages, databases, and blocks by title.
  version: 1.0.0
  discovery:
    purpose: Find any accessible Notion resource by its human-readable name.
    usage_context: Use this when you have a name (like 'Q1 Project') and need to find its 'id'. Returns matches across the entire authorized workspace.
    agent_hints:
      - "The 'query' looks at titles and content titles."
      - "You can filter by 'object' type ('page', 'database') and sort results."
    waml_examples:
      - title: Search for Projects
        waml: |
          - step: find_notion_resource
            call: notion.action.search.post
            with:
               query: Acme
               filter: { value: "database", property: "object" }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
    - name: filter
      type: object
    - name: sort
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: results
      type: array
  settings: []

execution:
  - id: request
    tool: paginate
    params:
      method: POST
      url: >-
        =platform.base_url + "/search"
      headers: =platform.headers
      strategy: cursor
      cursor_param: start_cursor
      body:
        query: =inputs.query
        filter: =inputs.filter
        sort: =inputs.sort
    returns:
      items: pages
      total_pages: page_count
      total_items: item_count

  - id: check_status
    tool: switch
    params:
      value: 200
      cases:
        - condition: 200
          output: success

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: results
          value: =steps.request.pages
