meta:
  permissions: ["network:api.notion.com"]
  id: notion.pages.update
  name: Update Page
  category: Pages
  type: Action
  platform: notion
  description: "Updates properties and icon/cover for an existing Notion page."
  version: "1.0.0"
  discovery:
    purpose: "Modify values on a Notion document or database item."
    usage_context: "Use this to change a task's status, update client contact details, or archive old pages by checking a 'History' property."
    agent_hints:
      - "Requires the 'page_id' UUID."
      - "The 'properties' JSON should only contain the fields you wish to change (partial update)."
    waml_examples:
      - title: "Mark Task Complete"
        waml: |
          - step: finish_task
            call: notion.action.pages.update
            with:
               page_id: "75a..."
               properties:
                 Status:
                   status: { name: "Done" }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
    - name: properties
      type: object
    - name: icon
      type: object
    - name: cover
      type: object
    - name: archived
      type: boolean
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: >
        platform.base_url + "/pages/" + inputs.page_id
      headers: platform.headers
      body:
        properties: inputs.properties
        icon: inputs.icon
        cover: inputs.cover
        archived: inputs.archived
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
