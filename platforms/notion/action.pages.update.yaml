meta:
  id: notion.pages.update
  name: Update Page
  category: Pages
  type: Action
  platform: notion
  description: "Updates page property values for a specified page."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
    - name: properties
      type: object
    - name: icon
      type: object
    - name: cover
      type: object
    - name: archived
      type: boolean
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: "{{ platform.base_url }}/pages/{{ get 'inputs.page_id' }}"
      headers: "{{ platform.headers }}"
      body:
        properties: "{{ get 'inputs.properties' }}"
        icon: "{{ get 'inputs.icon' }}"
        cover: "{{ get 'inputs.cover' }}"
        archived: "{{ get 'inputs.archived' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
