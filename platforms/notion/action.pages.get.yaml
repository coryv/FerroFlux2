meta:
  permissions: ["network:api.notion.com"]
  id: notion.pages.get
  name: Get Page
  category: Pages
  type: Action
  platform: notion
  description: Retrieves a Page object using the ID.
  version: 1.0.0
  discovery:
    purpose: Retrieve the full content, properties, and metadata for a specific Notion page.
    usage_context: Use to fetch the body of a document for summarization, retrieve specific custom properties, or check last edit times.
    agent_hints:
      - "Requires a page_id."
    waml_examples:
      - title: Fetch Page Content
        waml: |
          - step: get_page
            call: notion.action.pages.get
            with:
               page_id: acb123456789

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/pages/" + inputs.page_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
