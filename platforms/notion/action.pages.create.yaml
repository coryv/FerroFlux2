meta:
  permissions: ["network:api.notion.com"]
  id: notion.pages.create
  name: Create Page
  category: Pages
  type: Action
  platform: notion
  description: Creates a new page in the specified database or as a child of an existing page.
  version: 1.0.0
  discovery:
    purpose: Create a new page as a child of an existing page or within a database.
    usage_context: Use to automate note-taking, log new items from an external intake form, or generate reports directly in Notion.
    agent_hints:
      - "Requires a parent (database_id or page_id) and properties."
    waml_examples:
      - title: Create Document
        waml: |
          - step: new_note
            call: notion.action.pages.create
            with:
               parent: { type: "database_id", database_id: "acb12345" }
               properties: { "Name": { "title": [{ "text": { "content": "Meeting Notes" } }] } }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: parent
      type: object
    - name: properties
      type: object
    - name: children
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/pages"
      headers: =platform.headers
      body:
        parent: =inputs.parent
        properties: =inputs.properties
        children: =inputs.children
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
