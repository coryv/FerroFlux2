meta:
  permissions: ["network:api.notion.com"]
  id: notion
  name: Notion
  type: Platform
  category: Productivity
  description: Connects to the Notion API.
  version: 1.0.0
  discovery:
    purpose: All-in-one workspace for notes, docs, and structured databases.
    usage_context: Use Notion as a knowledge base, project wiki, or a flexible lightweight CRM/Task tracker. Ideal for unstructured or semi-structured data shared across teams.
    agent_hints:
      - "Identifies resources using UUIDs (e.g. '065a...')."
      - "Note that and Page is also any Block, and Databases can contain Pages."
      - "Requires manual 'Integration' sharing in the Notion UI for specific pages/databases."

config:
  base_url: "https://api.notion.com/v1"
  headers:
    Content-Type: application/json
    Notion-Version: 2022-06-28
    Authorization: Bearer PASTE_YOUR_TOKEN_HERE

settings:
  - name: connection
    label: Notion OAuth
    type: connection_select
    required: true
