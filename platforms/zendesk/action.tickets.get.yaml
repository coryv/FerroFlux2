meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.get
  name: Get Ticket
  category: Tickets
  type: Action
  platform: zendesk
  description: "Gets a ticket's details."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve complete details for a single Zendesk ticket."
    usage_context: "Use this to fetch current status, priority, description, or custom field values of a support request."
    agent_hints:
      - "Requires the ticket_id."
      - "Returns the full ticket object."
    waml_examples:
      - title: "Get Ticket Details"
        waml: |
          - step: fetch_ticket
            call: zendesk.action.tickets.get
            with:
               ticket_id: 1024

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: ticket
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/tickets/" + inputs.ticketId + ".json"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: ticket
          value: steps.request.response_body.ticket
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
