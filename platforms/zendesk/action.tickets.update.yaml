meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.update
  name: Update Ticket
  category: Tickets
  type: Action
  platform: zendesk
  description: "Updates an existing ticket."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
    - name: subject
      type: string
    - name: priority
      type: string
    - name: status
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: ticket
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/tickets/{{ get 'inputs.ticketId' }}.json"
      headers: "{{ platform.headers }}"
      body:
        ticket:
          subject: "{{ get 'inputs.subject' }}"
          priority: "{{ get 'inputs.priority' }}"
          status: "{{ get 'inputs.status' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: ticket
          value: "{{ steps.request.response_body.ticket }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
