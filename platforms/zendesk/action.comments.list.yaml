meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.comments.list
  name: List Comments
  category: Comments
  type: Action
  platform: zendesk
  description: Lists comments on a ticket.
  version: 1.0.0
  discovery:
    purpose: Retrieve all comments (conversation history) for a specific Zendesk ticket.
    usage_context: Use to fetch ticket transcripts for summary analysis, archival, or sync to other tools.
    agent_hints:
      - "Requires the ticket_id."
      - "Returns an array of comment objects including body, author, and visibility."
    waml_examples:
      - title: Get Transcript
        waml: |
          - step: get_history
            call: zendesk.action.comments.list
            with:
               ticket_id: 1024

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: comments
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >-
        =platform.base_url + "/tickets/" + inputs.ticketId + "/comments.json"
      headers: =platform.headers
      strategy: cursor
      cursor_path: >
        "/meta/after_cursor"
      cursor_param: >
        "page[after]"
      items_path: >
        "/comments"
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: comments
          value: =steps.request.all_items
