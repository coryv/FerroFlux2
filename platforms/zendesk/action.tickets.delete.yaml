meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.delete
  name: Delete Ticket
  category: Tickets
  type: Action
  platform: zendesk
  description: "Deletes a ticket."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/tickets/" + inputs.ticketId + ".json"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
