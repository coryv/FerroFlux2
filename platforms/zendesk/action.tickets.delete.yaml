meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.delete
  name: Delete Ticket
  category: Tickets
  type: Action
  platform: zendesk
  description: Deletes a ticket.
  version: 1.0.0
  discovery:
    purpose: Permanently remove a ticket from Zendesk.
    usage_context: Use to clean up spam, duplicates, or test data.
    agent_hints:
      - "Requires the ticket_id."
      - "Note: This action is irreversible."
    waml_examples:
      - title: Delete Spam
        waml: |
          - step: remove_spam
            call: zendesk.action.tickets.delete
            with:
               ticket_id: 9999

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/tickets/" + inputs.ticketId + ".json"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
