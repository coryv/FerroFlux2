meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.comments.create
  name: Add Comment
  category: Comments
  type: Action
  platform: zendesk
  description: Adds a comment to an existing ticket.
  version: 1.0.0
  discovery:
    purpose: Add a new comment (internal note or public reply) to an existing Zendesk ticket.
    usage_context: Use to provide updates to customers, record internal team notes, or automate responses.
    agent_hints:
      - "Requires the ticket_id and comment body."
      - "Setting 'public' to false creates an internal note."
    waml_examples:
      - title: Internal Update
        waml: |
          - step: note
            call: zendesk.action.comments.create
            with:
               ticket_id: 1024
               body: Investigation complete. Ready for fix.
               public: false

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
    - name: body
      type: string
    - name: public
      type: boolean
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: audit
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/tickets/" + inputs.ticketId + ".json"
      headers: =platform.headers
      body:
        ticket:
          comment:
            body: =inputs.body
            public: =inputs.public
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: audit
          value: =steps.request.response_body.audit
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
