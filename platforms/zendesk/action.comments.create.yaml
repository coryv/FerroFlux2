meta:
  id: zendesk.comments.create
  name: Add Comment
  category: Comments
  type: Action
  platform: zendesk
  description: "Adds a comment to an existing ticket."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: ticketId
      type: string
    - name: body
      type: string
    - name: public
      type: boolean
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: audit
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/tickets/{{ get 'inputs.ticketId' }}.json"
      headers: "{{ platform.headers }}"
      body:
        ticket:
          comment:
            body: "{{ get 'inputs.body' }}"
            public: "{{ get 'inputs.public' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: audit
          value: "{{ steps.request.response_body.audit }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
