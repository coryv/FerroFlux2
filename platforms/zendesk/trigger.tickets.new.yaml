meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.new
  name: New Ticket
  category: Tickets
  type: Trigger
  platform: zendesk
  description: Triggers when a new ticket is created.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow when a new support ticket is created in Zendesk.
    usage_context: Use to automate initial triage, send auto-replies, or notify team members on Slack.
    agent_hints:
      - "Provides the full ticket object, including subject, requester, and tags."
    waml_examples:
      - title: Inbound Support Alert
        waml: |
          - step: notify_team
            type: trigger
            call: zendesk.trigger.tickets.new

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: ticket
      type: object
  settings:
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/search.json"
      headers: =platform.headers
      query:
        query: >
          "type:'=ticket created>" + state.last_poll'
        sort_by: created_at
        sort_order: asc
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: foreach
        params:
          items: =steps.query.response_body.results
          action:
            - tool: emit
              params:
                port: Success
            - tool: emit
              params:
                port: ticket
                value: item
