meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.create
  name: Create Ticket
  category: Tickets
  type: Action
  platform: zendesk
  description: "Creates a new ticket."
  version: "1.0.0"
  discovery:
    purpose: "Create a new support ticket in Zendesk."
    usage_context: "Use this to automate helpdesk entries from emails, website contact forms, or Slack messages."
    agent_hints:
      - "Requires a title (subject) and a requester (email or user_id)."
      - "Defaults to 'open' status."
    waml_examples:
      - title: "Create Ticket"
        waml: |
          - step: log_support
            call: zendesk.action.tickets.create
            with:
               subject: "Inquiry from ${inputs.user_email}"
               comment: "User reached out regarding billing."
               requester_email: inputs.user_email

interface:
  inputs:
    - name: Exec
      type: flow
    - name: subject
      type: string
    - name: comment
      type: string
    - name: priority
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: ticket
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/tickets.json"
      headers: platform.headers
      body:
        ticket:
          subject: inputs.subject
          comment:
            body: inputs.comment
          priority: inputs.priority
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: ticket
          value: steps.request.response_body.ticket
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
