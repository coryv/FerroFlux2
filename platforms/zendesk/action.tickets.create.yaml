meta:
  id: zendesk.tickets.create
  name: Create Ticket
  category: Tickets
  type: Action
  platform: zendesk
  description: "Creates a new ticket."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: subject
      type: string
    - name: comment
      type: string
    - name: priority
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: ticket
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/tickets.json"
      headers: "{{ platform.headers }}"
      body:
        ticket:
          subject: "{{ get 'inputs.subject' }}"
          comment:
            body: "{{ get 'inputs.comment' }}"
          priority: "{{ get 'inputs.priority' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: ticket
          value: "{{ steps.request.response_body.ticket }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
