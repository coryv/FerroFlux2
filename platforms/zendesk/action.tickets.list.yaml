meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.list
  name: List Tickets
  category: Tickets
  type: Action
  platform: zendesk
  description: Lists all tickets.
  version: 1.0.0
  discovery:
    purpose: Search and retrieve a list of Zendesk support tickets.
    usage_context: Use to fetch unsolved tickets, generate support reports, or find tasks assigned to specific groups.
    agent_hints:
      - "Returns an array of ticket objects (subject, status, priority)."
    waml_examples:
      - title: List Open Tickets
        waml: |
          - step: get_tickets
            call: zendesk.action.tickets.list
            with:
               status: open
               limit: 20

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: tickets
      type: array

execution:
  - id: =request
    tool: paginate
    params:
      method: GET
      url: >
        platform.base_url + "/tickets.json"
      headers: =platform.headers
      strategy: cursor
      cursor_path: >
        "/meta/after_cursor"
      cursor_param: >
        "page[after]"
      items_path: >
        "/tickets"
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: tickets
          value: =steps.request.all_items
