meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.tickets.updated
  name: Updated Ticket
  category: Tickets
  type: Trigger
  platform: zendesk
  description: Triggers when a ticket is updated.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow whenever an existing Zendesk ticket is modified.
    usage_context: Use to sync status changes to Jira, notify assignees of new comments, or update internal dashboards.
    agent_hints:
      - "Provides details on changed fields and the current ticket state."
    waml_examples:
      - title: Sync Status Change
        waml: |
          - step: log_update
            type: trigger
            call: zendesk.trigger.tickets.updated

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: ticket
      type: object
  settings:
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/search.json"
      headers: =platform.headers
      query:
        query: >
          "type:'=ticket updated>" + state.last_poll'
        sort_by: updated_at
        sort_order: asc
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: foreach
        params:
          items: =steps.query.response_body.results
          action:
            - tool: emit
              params:
                port: Success
            - tool: emit
              params:
                port: ticket
                value: item
