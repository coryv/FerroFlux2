meta:
  permissions: ["network:*.zendesk.com"]
  id: zendesk.users.create
  name: Create User
  category: Users
  type: Action
  platform: zendesk
  description: "Creates a new user."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
    - name: email
      type: string
    - name: role
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: user
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/users.json"
      headers: "{{ platform.headers }}"
      body:
        user:
          name: "{{ get 'inputs.name' }}"
          email: "{{ get 'inputs.email' }}"
          role: "{{ get 'inputs.role' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: user
          value: "{{ steps.request.response_body.user }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
