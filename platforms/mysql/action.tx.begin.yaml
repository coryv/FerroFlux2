meta:
  id: mysql.tx.begin
  name: Begin Transaction
  category: Transaction
  type: Action
  platform: mysql
  description: "Starts a new MySQL database transaction for the current execution flow."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: begin
    tool: sql_query
    params:
      operation: begin
      connection_string: settings.connection_string
    returns:
      status: status

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
