meta:
  id: mysql.rows.insert
  name: Insert Row
  category: Tables
  type: Action
  platform: mysql
  description: "Inserts a new row into a MySQL table."
  version: "1.0.0"
  discovery:
    purpose: "Add a new record to a database table."
    usage_context: "Use this to create new resources, like a new user account, a support ticket, or a transaction record."
    agent_hints:
      - "The 'rows' parameter must be an array of objects where each key is a column name."
      - "Omit auto-increment columns (like 'id') to let the database generate them."
    waml_examples:
      - title: "Create New User"
        waml: |
          - step: create_user
            call: mysql.action.rows.insert
            with:
               table: "users"
               rows:
                 - email: "alice@example.com"
                   name: "Alice"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
      description: "The name of the table to insert into."
    - name: data
      type: object
      description: "The data to insert (column: value)."
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  # This uses a Rhai script to construct the INSERT query dynamically for MySQL (?)
  - id: build_query
    tool: rhai
    params:
      code: |
        let table = get("inputs.table");
        let data = get("inputs.data");
        let columns = data.keys();
        let values = data.values();
        let placeholders = columns.map(|col, idx| "?");
        
        let query = "INSERT INTO " + table + " (" + columns.join(", ") + ") VALUES (" + placeholders.join(", ") + ")";
        
        set("query", query);
        set("bind", values);
    returns:
      query: query
      bind: bind

  - id: execute
    tool: sql_query
    params:
      operation: execute
      connection_string: settings.connection_string
      query: steps.build_query.query
      bind: steps.build_query.bind
    returns:
      result: >
        "rows[0]"

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: steps.execute.result
    error:
      - tool: emit
        params:
          port: Error
          value: steps.execute.result
