meta:
  id: mysql.rows.select
  name: Select Rows
  category: Database
  type: Action
  platform: mysql
  description: Executes a SELECT query against a MySQL database.
  version: 1.0.0
  discovery:
    purpose: Retrieve rows from a database table using SQL.
    usage_context: Use this to fetch records for processing, such as getting a list of pending orders or looking up a user's details. Supports parameterized queries for security.
    agent_hints:
      - "The 'query' must be valid MySQL SQL (e.g., uses backticks for identifiers)."
      - "The 'params' array matches the '?' placeholders in your query in order."
      - "Returns an array of objects where keys are column names."
    waml_examples:
      - title: Fetch Active Users
        waml: |
          - step: get_users
            call: mysql.action.rows.select
            with:
               query: "SELECT id, email FROM `users` WHERE `status` = ?"
               params: ["active"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
      required: true
    - name: limit
      type: number
      default: 100
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: rows
      type: array

execution:
  - id: sql
    tool: sql_query
    params:
      connection_string: =settings.connection_string
      query: >
        "SELECT * FROM " + inputs.table + " LIMIT " + (has(inputs.limit) ? inputs.limit : '100')
    returns:
      rows: rows

routing:
  match: =steps.sql.status
  cases:
    default:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: rows
          value: =steps.sql.rows
