meta:
  permissions: ["network:*.openai.azure.com"]
  id: azure-openai.chat.completion
  name: Chat Completion
  category: Chat
  type: Action
  platform: azure-openai
  description: Generate a chat completion using an Azure OpenAI deployment.
  version: 1.0.0
  discovery:
    purpose: Generate text completions and conversational responses using Azure-hosted OpenAI models.
    usage_context: Use to build enterprise AI assistants, summarize internal documents, or automate customer service emails.
    agent_hints:
      - "Requires a 'deployment_name' for the specific GPT model in Azure."
    waml_examples:
      - title: Summarize Text
        waml: |
          - step: summarize
            call: azure-openai.action.chat.completion
            with:
               deployment_name: gpt-4-summarizer
               messages:
                 - role: user
                   content: '="Summarize this: " + inputs.long_content'

interface:
  inputs:
    - name: Exec
      type: flow
    - name: user_prompt
      type: string
    - name: messages
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: content
      type: string
    - name: response
      type: object

  settings:
    - name: resource_name
      label: Azure Resource Name
      type: string
      required: true
      placeholder: my-openai-resource
    - name: deployment
      label: Deployment Name
      type: string
      required: true
      placeholder: gpt-4o
      description: The name of your model deployment in the Azure portal.
    - name: api_version
      label: API Version
      type: string
      default: 2024-08-01-preview
      required: true
    - name: system_prompt
      label: System Prompt
      type: textarea
      default: You are a helpful assistant.
    - name: temperature
      label: Temperature
      type: number
      default: 1
      min: 0
      max: 2
    - name: max_tokens
      label: Max Tokens
      type: number
      required: false

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://" + settings.resource_name + ".openai.azure.com/openai/deployments/" + settings.deployment + "/chat/completions?api-version=" + settings.api_version
      headers: =platform.headers
      body:
        messages:
          - role: system
            content: =settings.system_prompt
          - role: user
            content: =inputs.user_prompt
        temperature: =settings.temperature
        max_tokens: =settings.max_tokens
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: json_query
        params:
          json: =steps.request.response_body
          path: >
            "/choices/0/message/content"
        returns:
          result: content_result
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: content
          value: content_result
      - tool: emit
        params:
          port: response
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
