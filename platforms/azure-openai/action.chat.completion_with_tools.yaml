meta:
  permissions: ["network:*.openai.azure.com"]
  id: azure-openai.chat.completion_with_tools
  name: Chat Completion with Tools
  category: Chat
  type: Action
  platform: azure-openai
  description: "Generate a chat completion with tool/function calling using an Azure OpenAI deployment."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: user_prompt
      type: string
    - name: tools
      type: array
    - name: messages
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: content
      type: string
    - name: tool_calls
      type: array
    - name: response
      type: object

  settings:
    - name: resource_name
      label: "Azure Resource Name"
      type: string
      required: true
      placeholder: "my-openai-resource"
    - name: deployment
      label: "Deployment Name"
      type: string
      required: true
      placeholder: "gpt-4o"
    - name: api_version
      label: "API Version"
      type: string
      default: "2024-08-01-preview"
      required: true
    - name: system_prompt
      label: "System Prompt"
      type: textarea
      default: "You are a helpful assistant."
    - name: tool_choice
      label: "Tool Choice"
      type: select
      default: "auto"
      options:
        - label: "Auto (model decides)"
          value: "auto"
        - label: "Required (must call a tool)"
          value: "required"
        - label: "None (no tool calls)"
          value: "none"
    - name: parallel_tool_calls
      label: "Allow Parallel Tool Calls"
      type: boolean
      default: true
    - name: temperature
      label: "Temperature"
      type: number
      default: 1
      min: 0
      max: 2

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "https://{{ get 'settings.resource_name' }}.openai.azure.com/openai/deployments/{{ get 'settings.deployment' }}/chat/completions?api-version={{ get 'settings.api_version' }}"
      headers: "{{ platform.headers }}"
      body:
        messages:
          - role: system
            content: "{{ get 'settings.system_prompt' }}"
          - role: user
            content: "{{ get 'inputs.user_prompt' }}"
        tools: "{{ get 'inputs.tools' }}"
        tool_choice: "{{ get 'settings.tool_choice' }}"
        parallel_tool_calls: "{{ get 'settings.parallel_tool_calls' }}"
        temperature: "{{ get 'settings.temperature' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/choices/0/message/tool_calls"
        returns:
          result: tool_calls_result
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/choices/0/message/content"
        returns:
          result: content_result
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: tool_calls
          value: "{{ tool_calls_result }}"
      - tool: emit
        params:
          port: content
          value: "{{ content_result }}"
      - tool: emit
        params:
          port: response
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
