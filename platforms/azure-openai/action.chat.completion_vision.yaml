meta:
  permissions: ["network:*.openai.azure.com"]
  id: azure-openai.chat.completion_vision
  name: Chat Completion with Vision
  category: Chat
  type: Action
  platform: azure-openai
  description: "Analyze images with an Azure OpenAI vision-capable deployment (e.g., GPT-4o)."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: user_prompt
      type: string
    - name: image_url
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: content
      type: string
    - name: response
      type: object

  settings:
    - name: resource_name
      label: "Azure Resource Name"
      type: string
      required: true
      placeholder: "my-openai-resource"
    - name: deployment
      label: "Deployment Name"
      type: string
      required: true
      placeholder: "gpt-4o"
      description: "Must be a vision-capable deployment (e.g., gpt-4o, gpt-4-vision)."
    - name: api_version
      label: "API Version"
      type: string
      default: "2024-08-01-preview"
      required: true
    - name: system_prompt
      label: "System Prompt"
      type: textarea
      default: "You are a helpful assistant."
    - name: image_detail
      label: "Image Detail"
      type: select
      default: "auto"
      options:
        - label: "Auto"
          value: "auto"
        - label: "Low (faster, cheaper)"
          value: "low"
        - label: "High (more accurate)"
          value: "high"
    - name: max_tokens
      label: "Max Tokens"
      type: number
      default: 1024

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://" + settings.resource_name + ".openai.azure.com/openai/deployments/" + settings.deployment + "/chat/completions?api-version=" + settings.api_version
      headers: platform.headers
      body:
        messages:
          - role: system
            content: settings.system_prompt
          - role: user
            content:
              - type: text
                text: inputs.user_prompt
              - type: image_url
                image_url:
                  url: inputs.image_url
                  detail: settings.image_detail
        max_tokens: settings.max_tokens
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: json_query
        params:
          json: steps.request.response_body
          path: >
            "/choices/0/message/content"
        returns:
          result: content_result
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: content
          value: content_result
      - tool: emit
        params:
          port: response
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
