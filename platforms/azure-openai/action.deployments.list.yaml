meta:
  permissions: ["network:*.openai.azure.com"]
  id: azure-openai.deployments.list
  name: List Deployments
  category: Deployments
  type: Action
  platform: azure-openai
  description: "List all model deployments in an Azure OpenAI resource."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: deployments
      type: array

  settings:
    - name: resource_name
      label: "Azure Resource Name"
      type: string
      required: true
      placeholder: "my-openai-resource"
    - name: api_version
      label: "API Version"
      type: string
      default: "2024-08-01-preview"
      required: true

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        "https://" + settings.resource_name + ".openai.azure.com/openai/deployments?api-version=" + settings.api_version
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: json_query
        params:
          json: steps.request.response_body
          path: >
            "/data"
        returns:
          result: deployments_result
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: deployments
          value: deployments_result
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
