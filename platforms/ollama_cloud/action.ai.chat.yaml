meta:
  id: ollama_cloud.ai.chat
  name: Chat
  category: AI
  type: Action
  platform: ollama_cloud
  description: "Continue a conversation with a model using message history."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: messages
      type: array
    - name: tools
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
  settings:
    - name: temperature
      label: "Temperature"
      type: number
      required: false
      default: 0.7
    - name: num_predict
      label: "Max Tokens (num_predict)"
      type: number
      required: false
      default: 2048

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/chat"
      headers: "{{ platform.headers }}"
      body:
        model: "{{ get 'inputs.model' }}"
        messages: "{{ get 'inputs.messages' }}"
        tools: "{{ get 'inputs.tools' }}"
        stream: false
        options:
          temperature: "{{ settings.temperature }}"
          num_predict: "{{ settings.num_predict }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: response
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
