meta:
  permissions: ["network:api.ollama.com"]
  id: ollama_cloud.ai.list_models
  name: List Models
  category: AI
  type: Action
  platform: ollama_cloud
  description: "List all models available on the Ollama Cloud instance."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve a list of all locally and cloud-available models in the Ollama instance."
    usage_context: "Use to dynamically discover which open-source models (e.g. Llama 3, Mistral, CodeLlama) are installed and ready for inference."
    agent_hints:
      - "Returns an array of model objects with names and sizes."
    waml_examples:
      - title: "List Models"
        waml: |
          - step: get_models
            call: ollama_cloud.action.ai.list_models

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: models
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/tags"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: models
          value: steps.request.response_body.models
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
