meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.tags.add
  name: Add Tag
  category: Subscribers
  type: Action
  platform: mailchimp
  description: "Adds a tag to a subscriber."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
    - name: subscriberHash
      type: string
    - name: tagName
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/lists/{{ get 'inputs.listId' }}/members/{{ get 'inputs.subscriberHash' }}/tags"
      headers: "{{ platform.headers }}"
      body:
        tags:
          - name: "{{ get 'inputs.tagName' }}"
            status: "active"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
