meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.tags.add
  name: Add Tag
  category: Subscribers
  type: Action
  platform: mailchimp
  description: Adds marketing tags to a specific subscriber.
  version: 1.0.0
  discovery:
    purpose: Categorize subscribers into custom segments (e.g. 'Influencer', 'VIP', 'Event Attendee').
    usage_context: Use this to trigger automated journeys or filter campaigns based on dynamic subscriber behaviors.
    agent_hints:
      - "Requires 'list_id' and 'subscriber_hash' (MD5 of email)."
      - "Pass an array of 'tags' to be added."
    waml_examples:
      - title: Tag Pro User
        waml: |
          - step: tag_user
            call: mailchimp.action.tags.add
            with:
               list_id: 123...
               subscriber_hash: 555...
               tags: [{ name: "Tier: Pro", status: "active" }]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
    - name: subscriberHash
      type: string
    - name: tagName
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/lists/" + inputs.listId + "/members/" + inputs.subscriberHash + "/tags"
      headers: =platform.headers
      body:
        tags:
          - name: =inputs.tagName
            status: active
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
