meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.subscribers.new
  name: New Subscriber
  category: Subscribers
  type: Trigger
  platform: mailchimp
  description: "Triggers when a new subscriber joins the audience."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: subscriber
      type: object
  settings:
    - name: listId
      label: "Audience ID"
      type: string
      required: true
    - name: polling_interval
      label: "Polling Interval (minutes)"
      type: number
      default: 15

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/lists/" + settings.listId + "/members"
      headers: platform.headers
      query:
        since_last_changed: state.last_poll
        sort_field: last_changed
        sort_dir: ASC
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: foreach
        params:
          items: steps.request.response_body.members
          action:
            - tool: emit
              params:
                port: Success
            - tool: emit
              params:
                port: subscriber
                value: item
