meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.send
  name: Send Campaign
  category: Campaigns
  type: Action
  platform: mailchimp
  description: Sends a Mailchimp campaign.
  version: 1.0.0
  discovery:
    purpose: Permanently launch/send a prepared Mailchimp campaign to its audience.
    usage_context: Use to automate the final release of newsletters or marketing announcements once content is validated.
    agent_hints:
      - "Requires a campaign_id."
      - "The campaign must be in 'Ready' status to send."
    waml_examples:
      - title: Send Campaign
        waml: |
          - step: send_now
            call: mailchimp.action.campaigns.send
            with:
               campaign_id: 71a3999c51

interface:
  inputs:
    - name: Exec
      type: flow
    - name: campaignId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/campaigns/" + inputs.campaignId + "/actions/send"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
