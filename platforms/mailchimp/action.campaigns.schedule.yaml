meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.schedule
  name: Schedule Campaign
  category: Campaigns
  type: Action
  platform: mailchimp
  description: Schedules a Mailchimp campaign to be sent at a specific time.
  version: 1.0.0
  discovery:
    purpose: Plan marketing launches, coordinate global announcements across time zones, and automate content delivery.
    usage_context: Use this to schedule a newsletter for the upcoming Monday or coordinate a product rollout.
    agent_hints:
      - "Requires 'campaign_id' and 'schedule_time' (ISO 8601 format)."
    waml_examples:
      - title: Schedule Monday News
        waml: |
          - step: plan_send
            call: mailchimp.action.campaigns.schedule
            with:
               campaign_id: 123...
               schedule_time: "2024-04-01T09:00:00Z"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: campaignId
      type: string
    - name: scheduleTime
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/campaigns/" + inputs.campaignId + "/actions/schedule"
      headers: =platform.headers
      body:
        schedule_time: =inputs.scheduleTime
        timewarp: false
        batch_delivery: null
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
