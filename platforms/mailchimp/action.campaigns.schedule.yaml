meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.schedule
  name: Schedule Campaign
  category: Campaigns
  type: Action
  platform: mailchimp
  description: "Schedules a Mailchimp campaign for delivery."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: campaignId
      type: string
    - name: scheduleTime
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/campaigns/{{ get 'inputs.campaignId' }}/actions/schedule"
      headers: "{{ platform.headers }}"
      body:
        schedule_time: "{{ get 'inputs.scheduleTime' }}"
        timewarp: false
        batch_delivery: null
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
