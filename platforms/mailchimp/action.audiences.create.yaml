meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.audiences.create
  name: Create Audience
  category: Audiences
  type: Action
  platform: mailchimp
  description: "Creates a new audience list."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
    - name: contact
      type: object
    - name: permissionReminder
      type: string
    - name: campaignDefaults
      type: object
    - name: emailTypeOption
      type: boolean
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: audience
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/lists"
      headers: platform.headers
      body:
        name: inputs.name
        contact: inputs.contact
        permission_reminder: inputs.permissionReminder
        campaign_defaults: inputs.campaignDefaults
        email_type_option: inputs.emailTypeOption
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: audience
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
