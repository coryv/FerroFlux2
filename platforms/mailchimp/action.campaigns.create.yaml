meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.create
  name: Create Campaign
  category: Campaigns
  type: Action
  platform: mailchimp
  description: "Creates a new Mailchimp campaign."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: type
      type: string
    - name: listId
      type: string
    - name: subjectLine
      type: string
    - name: replyTo
      type: string
    - name: fromName
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: campaign
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/campaigns"
      headers: "{{ platform.headers }}"
      body:
        type: "{{ get 'inputs.type' }}"
        recipients:
          list_id: "{{ get 'inputs.listId' }}"
        settings:
          subject_line: "{{ get 'inputs.subjectLine' }}"
          reply_to: "{{ get 'inputs.replyTo' }}"
          from_name: "{{ get 'inputs.fromName' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: campaign
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
