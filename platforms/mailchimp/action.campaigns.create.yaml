meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.create
  name: Create Campaign
  category: Campaigns
  type: Action
  platform: mailchimp
  description: Creates a new email campaign for a specific audience.
  version: 1.0.0
  discovery:
    purpose: Draft automated marketing messages, newsletters, or announcements.
    usage_context: Use this to prepare seasonal promotions, sync blog posts to email campaigns, or automate complex marketing workflows.
    agent_hints:
      - "Requires 'type' (regular, plaintext, etc.) and 'recipients' (list_id)."
      - "The 'settings' object handles 'subject_line' and 'from_name'."
    waml_examples:
      - title: Create Promo Campaign
        waml: |
          - step: mk_campaign
            call: mailchimp.action.campaigns.create
            with:
               type: regular
               recipients: { list_id: "123..." }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: type
      type: string
    - name: listId
      type: string
    - name: subjectLine
      type: string
    - name: replyTo
      type: string
    - name: fromName
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: campaign
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/campaigns"
      headers: =platform.headers
      body:
        type: inputs.type
        recipients:
          list_id: =inputs.listId
        settings:
          subject_line: =inputs.subjectLine
          reply_to: =inputs.replyTo
          from_name: =inputs.fromName
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: campaign
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
