meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.subscribers.addUpdate
  name: Add or Update Subscriber
  category: Subscribers
  type: Action
  platform: mailchimp
  description: "Adds or updates a subscriber in an audience list."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
    - name: subscriberHash
      type: string
    - name: emailAddress
      type: string
    - name: statusIfNew
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: subscriber
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/lists/" + inputs.listId + "/members/" + inputs.subscriberHash
      headers: platform.headers
      body:
        email_address: inputs.emailAddress
        status_if_new: inputs.statusIfNew
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: subscriber
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
