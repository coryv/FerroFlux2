meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.subscribers.list
  name: List Subscribers
  category: Subscribers
  type: Action
  platform: mailchimp
  description: "Lists all subscribers in an audience."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: members
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: "{{ platform.base_url }}/lists/{{ get 'inputs.listId' }}/members"
      headers: "{{ platform.headers }}"
      strategy: offset
      offset_param: offset
      limit_param: count
      per_page: 50
      items_path: "/members"
    returns:
      items: all_items

routing:
  match: "success"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: members
          value: "{{ steps.request.all_items }}"
