meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.subscribers.list
  name: List Subscribers
  category: Subscribers
  type: Action
  platform: mailchimp
  description: Lists all subscribers in an audience.
  version: 1.0.0
  discovery:
    purpose: Retrieve a list of members from a specific Mailchimp audience (list).
    usage_context: Use to audit list members, identify subscribers for tagging, or export audience data for external analysis.
    agent_hints:
      - "Requires list_id."
      - "Returns an array of member objects (status, email, tags)."
    waml_examples:
      - title: List Members
        waml: |
          - step: fetch
            call: mailchimp.action.subscribers.list
            with:
               list_id: acb12345
               status: subscribed

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: members
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >
        platform.base_url + "/lists/" + inputs.listId + "/members"
      headers: =platform.headers
      strategy: offset
      offset_param: offset
      limit_param: count
      per_page: 50
      items_path: >
        "/members"
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: members
          value: =steps.request.all_items
