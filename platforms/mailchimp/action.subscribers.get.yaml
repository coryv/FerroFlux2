meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.subscribers.get
  name: Get Subscriber
  category: Subscribers
  type: Action
  platform: mailchimp
  description: Gets information about a specific subscriber.
  version: 1.0.0
  discovery:
    purpose: Retrieve detailed status and metadata for a specific subscriber in a Mailchimp list.
    usage_context: Use to verify a subscriber's current status (subscribed vs cleaned) before triggering automated emails or syncing data.
    agent_hints:
      - "Requires list_id and subscriber_hash (MD5 of email address)."
    waml_examples:
      - title: Check Subscriber
        waml: |
          - step: get_sub
            call: mailchimp.action.subscribers.get
            with:
               list_id: acb12345
               subscriber_hash: 5f123abc456...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
    - name: subscriberHash
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: subscriber
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/lists/" + inputs.listId + "/members/" + inputs.subscriberHash
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: subscriber
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
