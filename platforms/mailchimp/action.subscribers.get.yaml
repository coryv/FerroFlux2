meta:
  id: mailchimp.subscribers.get
  name: Get Subscriber
  category: Subscribers
  type: Action
  platform: mailchimp
  description: "Gets information about a specific subscriber."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: listId
      type: string
    - name: subscriberHash
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: subscriber
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/lists/{{ get 'inputs.listId' }}/members/{{ get 'inputs.subscriberHash' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: subscriber
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
