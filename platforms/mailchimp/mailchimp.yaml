meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp
  name: Mailchimp
  type: Platform
  category: Marketing & Email
  description: "Leading platform for email marketing, automation, and audience growth."
  version: "1.0.0"
  discovery:
    purpose: "Manage subscriber lists, design marketing campaigns, and track audience engagement."
    usage_context: "Use this to automate newsletter signups, sync customer data from CRMs, and trigger marketing journeys."
    agent_hints:
      - "Requires an API Key and Data Center prefix (e.g. 'us19')."
      - "Strict rate limits apply to batch operations."

config:
  base_url: >
    "https://" + settings.server_prefix + ".api.mailchimp.com/3.0"
  headers:
    Content-Type: "application/json"
    Authorization: >
      "Basic " + settings.api_key_base64

settings:
  - name: server_prefix
    label: "Server Prefix (e.g. us1)"
    type: string
    required: true
  - name: api_key_base64
    label: "API Key (Base64 encoded 'anystring:YOUR_API_KEY')"
    type: string
    required: true
