meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.report
  name: Get Campaign Report
  category: Campaigns
  type: Action
  platform: mailchimp
  description: "Gets the overview report for a campaign."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve high-level results and click-through metrics for a dispatched campaign."
    usage_context: "Use to automate post-campaign reporting, notify teams of high engagement, or sync conversion stats into a CRM."
    agent_hints:
      - "Requires a campaign_id."
      - "Returns metrics like unique_opens, clicks, and unsubscribes."
    waml_examples:
      - title: "Fetch Metrics"
        waml: |
          - step: report
            call: mailchimp.action.campaigns.report
            with:
               campaign_id: "71a3999c51"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: campaignId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: report
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/reports/" + inputs.campaignId
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: report
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
