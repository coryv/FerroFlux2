meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.campaigns.report
  name: Get Campaign Report
  category: Campaigns
  type: Action
  platform: mailchimp
  description: "Gets the overview report for a campaign."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: campaignId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: report
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/reports/" + inputs.campaignId
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: report
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
