meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.audiences.list
  name: List Audiences
  category: Audiences
  type: Action
  platform: mailchimp
  description: "Lists all audiences (lists) in the Mailchimp account."
  version: "1.0.0"
  discovery:
    purpose: "Browse and identify available audience lists for campaign targeting or member syncing."
    usage_context: "Use this to fetch 'list_id's for other subscriber actions and to audit existing marketing segments."
    agent_hints:
      - "Returns a list of audience objects (id, name, stats, member_count)."
    waml_examples:
      - title: "Find Audience ID"
        waml: |
          - step: see_lists
            call: mailchimp.action.audiences.list
            with:
               count: 10

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: audiences
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >
        platform.base_url + "/lists"
      headers: platform.headers
      strategy: offset
      offset_param: offset
      limit_param: count
      per_page: 50
      items_path: >
        "/lists"
    returns:
      items: all_items

routing:
  match: "success"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: audiences
          value: steps.request.all_items
