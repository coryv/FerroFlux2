meta:
  permissions: ["network:*.api.mailchimp.com"]
  id: mailchimp.audiences.list
  name: List Audiences
  category: Audiences
  type: Action
  platform: mailchimp
  description: "Lists all audience lists."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: audiences
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: "{{ platform.base_url }}/lists"
      headers: "{{ platform.headers }}"
      strategy: offset
      offset_param: offset
      limit_param: count
      per_page: 50
      items_path: "/lists"
    returns:
      items: all_items

routing:
  match: "success"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: audiences
          value: "{{ steps.request.all_items }}"
