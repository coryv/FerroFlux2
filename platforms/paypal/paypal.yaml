meta:
  id: paypal
  name: PayPal
  category: Payments
  type: Platform
  description: Global payment processor for online money transfers and commerce.
  version: 1.0.0
  discovery:
    purpose: Process financial transactions and manage orders via the PayPal platform.
    usage_context: Use to automate payment verification, generate invoices for services, or manage recurring subscription billing for digital products.
    agent_hints:
      - "Requires Client ID and Client Secret for OAuth2."
      - "Supports both Sandbox and Live environments."
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/paypal.svg"
  permissions: ["network:api-m.paypal.com"]

config:
  base_url: "https://api-m.paypal.com"
  auth_type: oauth2
  auth:
    type: bearer
  connection_schema:
    - name: client_id
      type: string
      required: true
    - name: client_secret
      type: string
      required: true
      is_secret: true
