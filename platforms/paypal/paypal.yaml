meta:
  id: paypal
  name: "PayPal"
  category: "Payments"
  type: Platform
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/paypal.svg"
  permissions: ["network:api-m.paypal.com"]

config:
  base_url: "https://api-m.paypal.com"
  auth_type: "oauth2"
  auth:
    type: "bearer"
  connection_schema:
    - name: "client_id"
      type: "string"
      required: true
    - name: "client_secret"
      type: "string"
      required: true
      is_secret: true
