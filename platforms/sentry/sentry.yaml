meta:
  permissions: ["network:sentry.io"]

name: "sentry"
icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/sentry.svg"
base_url: "https://sentry.io/api/0"
auth_type: "api_key"
verify_endpoint: "/organizations"
auth:
  type: "bearer"
connection_schema:
  - name: "api_key"
    type: "string"
    required: true
    is_secret: true
    description: "Sentry Auth Token"

actions:
  list_issues:
    name: "List Issues"
    category: "Monitoring"
    subcategory: "Errors"
    documentation: "List issues for a specific project."
    inputs:
      - name: "organization_slug"
        type: "string"
        required: true
      - name: "project_slug"
        type: "string"
        required: true
      - name: "query"
        type: "string"
        description: "An optional Sentry structured search query."
    implementation:
      type: "http"
      config:
        method: "GET"
        path: "/projects/{{organization_slug}}/{{project_slug}}/issues/"
        query_params:
          query: "{{query}}"
    output_transform:
      issues: "$"

  get_issue:
    name: "Get Issue"
    category: "Monitoring"
    subcategory: "Errors"
    documentation: "Get detailed information for a specific issue."
    inputs:
      - name: "issue_id"
        type: "string"
        required: true
    implementation:
      type: "http"
      config:
        method: "GET"
        path: "/issues/{{issue_id}}/"
    output_transform:
      issue: "$"

  resolve_issue:
    name: "Resolve Issue"
    category: "Monitoring"
    subcategory: "Errors"
    documentation: "Mark an issue as resolved."
    inputs:
      - name: "issue_id"
        type: "string"
        required: true
    implementation:
      type: "http"
      config:
        method: "PUT"
        path: "/issues/{{issue_id}}/"
        headers:
          Content-Type: "application/json"
        body_template: |
          {
            "status": "resolved"
          }
    output_transform:
      issue: "$"

  create_issue:
    name: "Create Issue (Capture Message)"
    category: "Monitoring"
    subcategory: "Errors"
    documentation: "Create a new issue by capturing a message (requires DSN for real use, but here we use the Auth API to capture a message if possible)."
    inputs:
      - name: "organization_slug"
        type: "string"
        required: true
      - name: "project_slug"
        type: "string"
        required: true
      - name: "message"
        type: "string"
        required: true
    implementation:
      type: "http"
      config:
        method: "POST"
        path: "/projects/{{organization_slug}}/{{project_slug}}/issues/"
        headers:
          Content-Type: "application/json"
        body_template: |
          {
            "message": "{{message}}",
            "status": "unresolved"
          }
    output_transform:
      issue: "$"
