meta:
  id: sentry
  name: Sentry
  type: Platform
  category: Developer Tools
  description: "Connects to the Sentry API for issue tracking and error monitoring."
  version: "1.0.0"
  permissions:
    - "network:sentry.io"

config:
  base_url: "https://sentry.io/api/0"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_AUTH_TOKEN_HERE"

settings:
  - name: api_key
    label: "Auth Token"
    type: string
    required: true
