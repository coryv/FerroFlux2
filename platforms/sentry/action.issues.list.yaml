meta:
  id: sentry.issues.list
  name: List Issues
  category: Errors
  type: Action
  platform: sentry
  description: "List issues for a specific project."
  version: "1.0.0"
  permissions:
    - "network:sentry.io"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: organization_slug
      type: string
    - name: project_slug
      type: string
    - name: query
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issues
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/projects/{{ get 'inputs.organization_slug' }}/{{ get 'inputs.project_slug' }}/issues/"
      headers: "{{ platform.headers }}"
      query:
        query: "{{ get 'inputs.query' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issues
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
