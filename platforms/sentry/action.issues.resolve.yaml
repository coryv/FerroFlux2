meta:
  id: sentry.issues.resolve
  name: Resolve Issue
  category: Errors
  type: Action
  platform: sentry
  description: "Mark an issue as resolved."
  version: "1.0.0"
  permissions:
    - "network:sentry.io"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/issues/{{ get 'inputs.issue_id' }}/"
      headers: "{{ platform.headers }}"
      body:
        status: "resolved"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
