meta:
  id: sentry.issues.resolve
  name: Resolve Issue
  category: Errors
  type: Action
  platform: sentry
  description: Resolves a specific Sentry issue.
  version: 1.0.0
  discovery:
    purpose: Mark an error as resolved to clear alerts and signal bug fixes.
    usage_context: Use this to automate issue management when a corresponding bug is fixed (e.g. after a successful GitHub Merge or CI/CD deployment).
    agent_hints:
      - "Requires the 'issue_id' (numeric string)."
      - "Transitions the issue status to 'resolved'."
    waml_examples:
      - title: Resolve Fixed Bug
        waml: |
          - step: fix_it
            call: sentry.action.issues.resolve
            with:
               issue_id: 123456
  permissions:
    - "network:sentry.io"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >-
        =platform.base_url + "/issues/" + inputs.issue_id + "/"
      headers: =platform.headers
      body:
        status: resolved
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
