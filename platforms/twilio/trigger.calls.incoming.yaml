meta:
  permissions: ["network:api.twilio.com"]
  id: twilio.trigger.calls.incoming
  name: Incoming Call
  category: Calls
  type: Trigger
  platform: twilio
  description: "Fires when an inbound call is received via Twilio webhook."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: call
      type: object
  settings:
    - name: auth_token
      label: "Auth Token"
      type: string
      required: true
      description: "Your Twilio account Auth Token — used to verify webhook signatures."

execution:
  - id: verify
    tool: verify_signature
    params:
      body: event.raw_body
      secret: settings.auth_token
      signature: event.headers["x-twilio-signature"]
      algorithm: hmac-sha1
      encoding: base64
    returns:
      valid: is_valid

  - id: parse_body
    tool: rhai
    params:
      script: >
        let pairs = input.raw.split("&");
        let result = #{};
        for pair in pairs {
          let kv = pair.split("=");
          if kv.len() == 2 {
            result[kv[0]] = kv[1].replace("+", " ");
          }
        }
        result
      input:
        raw: event.raw_body
    returns:
      result: call_data

  - id: check_valid
    tool: logic
    params:
      condition: steps.verify.is_valid

routing:
  match: steps.check_valid.result
  cases:
    "true":
      - tool: emit
        params:
          port: call
          value: steps.parse_body.call_data
      - tool: emit
        params:
          port: Success
    "false":
      - tool: emit
        params:
          port: Error
          value: "Webhook signature verification failed"
