meta:
  id: twilio.messages.create
  name: Send SMS Message
  category: Messages
  type: Action
  platform: twilio
  description: "Send an SMS via Twilio."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: to
      type: string
    - name: from
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/{{ get 'settings.account_sid' }}/Messages.json"
      headers: "{{ platform.headers }}"
      body_type: form
      body:
        To: "{{ get 'inputs.to' }}"
        From: "{{ get 'inputs.from' }}"
        Body: "{{ get 'inputs.body' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
