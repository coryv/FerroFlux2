meta:
  permissions: ["network:api.twilio.com"]
  id: twilio.trigger.sms.received
  name: SMS Received
  category: SMS
  type: Trigger
  platform: twilio
  description: Fires when an inbound SMS is received via Twilio webhook.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow when a new SMS message is received on a Twilio number.
    usage_context: Use to automate text message responses, bridge mobile communication with Slack, or process incoming keywords for marketing campaigns.
    agent_hints:
      - "Requires a pre-configured Twilio Webhook URL pointing to the FerroFlux intake."
    waml_examples:
      - title: SMS Bridge
        waml: |
          - step: on_sms
            type: trigger
            call: twilio.trigger.sms.received

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
  settings:
    - name: auth_token
      label: Auth Token
      type: string
      required: true
      description: Your Twilio account Auth Token — used to verify webhook signatures.
    - name: webhook_path
      label: Webhook Path
      type: string
      default: /twilio/sms
      description: Path suffix for this webhook endpoint.

execution:
  # Twilio signs using HMAC-SHA1 over the full URL + sorted POST params concatenated.
  # The raw_body (URL-encoded form) is used for verification.
  - id: verify
    tool: verify_signature
    params:
      body: =event.raw_body
      secret: =settings.auth_token
      signature: '=event.headers["x-twilio-signature"]'
      algorithm: hmac-sha1
      encoding: base64
    returns:
      valid: is_valid

  - id: parse_body
    tool: rhai
    params:
      script: >
        let pairs = input.raw.split("&");
        let result = #{};
        for pair in pairs {
          let kv = pair.split("=");
          if kv.len() == 2 {
            result[kv[0]] = kv[1].replace("+", " ");
          }
        }
        result
      input:
        raw: =event.raw_body
    returns:
      result: sms_data

  - id: check_valid
    tool: logic
    params:
      condition: =steps.verify.is_valid

routing:
  match: =steps.check_valid.result
  cases:
    "true":
      - tool: emit
        params:
          port: message
          value: =steps.parse_body.sms_data
      - tool: emit
        params:
          port: Success
    "false":
      - tool: emit
        params:
          port: Error
          value: Webhook signature verification failed
