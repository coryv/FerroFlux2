meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.files.get-metadata
  name: Get File Metadata
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Gets metadata for a file in Google Drive."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve detailed metadata for a specific file or folder in Google Drive."
    usage_context: "Use to check file properties (mimeType, size, name), retrieve its web viewing link, or verify its parent folder structure."
    agent_hints:
      - "Requires a valid fileId."
      - "Returns metadata fields including 'name', 'mimeType', and 'webViewLink'."
    waml_examples:
      - title: "Fetch Metadata"
        waml: |
          - step: get_info
            call: google-drive.action.files.get-metadata
            with:
               fileId: "12345abcde"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fileId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object
  settings:
    - name: fields
      label: "Fields (comma separated)"
      type: string
      required: false
      default: "id,name,mimeType,size,parents,createdTime,modifiedTime"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/files/" + inputs.fileId
      headers: platform.headers
      query:
        fields: settings.fields
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
