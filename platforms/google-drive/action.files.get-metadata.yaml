meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.files.get-metadata
  name: Get File Metadata
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Gets metadata for a file in Google Drive."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fileId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object
  settings:
    - name: fields
      label: "Fields (comma separated)"
      type: string
      required: false
      default: "id,name,mimeType,size,parents,createdTime,modifiedTime"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/files/{{ get 'inputs.fileId' }}"
      headers: "{{ platform.headers }}"
      query:
        fields: "{{ get 'settings.fields' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
