meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.files.search
  name: Search Files
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Searches for files and folders in Google Drive using specific filters."
  version: "1.0.0"
  discovery:
    purpose: "Find specific items in Google Drive using precise query syntax."
    usage_context: "Use this to find a spreadsheet by name, filter for PDF documents, or find all files inside a specific folder."
    agent_hints:
      - "The 'q' parameter uses Google Drive search syntax (e.g. 'name = \"Report\"', 'mimeType = \"application/pdf\"')."
      - "Supports searching trashed files using the 'trashed' filter (not enabled by default)."
    waml_examples:
      - title: "Find Spreadsheet by Name"
        waml: |
          - step: find_sheet
            call: google-drive.action.files.search
            with:
               q: "name = 'October Invoice' and mimeType = 'application/vnd.google-apps.spreadsheet'"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: files
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >
        platform.base_url + "/files"
      headers: platform.headers
      strategy: page_token
      cursor_param: pageToken
      max_pages: 5
      query:
        q: inputs.query
        fields: >
          "nextPageToken,files(id,name,mimeType,size,createdTime)"
    returns:
      items: all_items

routing:
  match: "success"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: files
          value: steps.request.all_items
