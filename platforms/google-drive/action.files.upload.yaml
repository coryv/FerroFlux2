meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.files.upload
  name: Upload File
  category: "Cloud Storage & Files"
  type: Action
  platform: google-drive
  description: Uploads a local file (blob reference) to Google Drive.
  version: 1.0.0
  discovery:
    purpose: Transfer a local FerroFlux 'blob' to the cloud storage.
    usage_context: Use this to upload images, backups, or documents generated within your workflow. For Google Workspace files (Docs/Sheets), the API will attempt auto-conversion.
    agent_hints:
      - "The 'file' must be a valid 'blob_id' from a previous step."
      - "You can provide a 'name' and specify 'parents' (folder IDs) for its destination."
    waml_examples:
      - title: Upload Generated Report
        waml: |
          - step: upload_result
            call: google-drive.action.files.upload
            with:
               file: =steps.gen_report.blob_id
               name: Report_Final.pdf
               parents: ["dest_folder_id_123"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file
      type: blob
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart"
      headers: =platform.headers
      body_type: multipart
      parts:
        - name: metadata
          content_json: >
            "{\"name\": \"" + inputs.name + "\"}"
          content_type: application/json
        - name: file
          content_var: =inputs.file
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: =steps.request.response_body
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
