meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.files.download
  name: Download File
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Downloads a file from Google Drive."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fileId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: blob

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/files/{{ get 'inputs.fileId' }}?alt=media"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
