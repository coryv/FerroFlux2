meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.folders.create
  name: Create Folder
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Creates a new folder in Google Drive."
  version: "1.0.0"
  discovery:
    purpose: "Create a new directory for organizing files in Google Drive."
    usage_context: "Use this to create project-specific folders, monthly archive directories, or shared workspace areas as part of an automation."
    agent_hints:
      - "Specify a 'name' for the folder."
      - "You can provide 'parents' (folder IDs) to create the folder inside an existing directory. If omitted, it will be created in the root."
    waml_examples:
      - title: "Create Month Folder"
        waml: |
          - step: mk_dir
            call: google-drive.action.folders.create
            with:
               name: "April 2024"
               parents: ["parent_folder_id_123"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: folder
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/files"
      headers: platform.headers
      body:
        name: inputs.name
        mimeType: >
          "application/vnd.google-apps.folder"
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: folder
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
