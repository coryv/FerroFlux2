meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.permissions.create
  name: Share File
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Creates a permission for a file (shares it)."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fileId
      type: string
    - name: role
      type: string
    - name: type
      type: string
    - name: emailAddress
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: permission
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/files/{{ get 'inputs.fileId' }}/permissions"
      headers: "{{ platform.headers }}"
      body:
        role: "{{ get 'inputs.role' }}"
        type: "{{ get 'inputs.type' }}"
        emailAddress: "{{ get 'inputs.emailAddress' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: permission
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
