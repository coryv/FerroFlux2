meta:
  permissions: ["network:www.googleapis.com"]
  id: google-drive.files.new
  name: New File
  category: "Cloud Storage & Files"
  type: Trigger
  platform: google-drive
  description: Triggers when a new file or folder is created in Google Drive.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a new item appears in Google Drive.
    usage_context: Use this to automate document processing immediately after upload, such as reacting to a new invoice or a shared team report.
    agent_hints:
      - "Polls Google Drive for new items. There may be a short delay between upload and trigger."
      - "Yields the full file resource (id, name, mimeType) to the next step."
    waml_examples:
      - title: Process New Invoices
        waml: |
          trigger:
            new_file:
               call: google-drive.trigger.files.new
               with:
                  folder_id: invoices_folder_id_123

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: =file
      type: object
  settings:
    - name: poll_interval
      label: Poll Interval (minutes)
      type: number
      required: false
      default: 5
      min: 1

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/files"
      headers: =platform.headers
      query:
        orderBy: >
          "createdTime desc"
        q: >
          "createdTime > '" + event.cursor + "' and trashed = false"
        pageSize: 10
        fields: >
          "files(id,name,mimeType,createdTime)"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: json_query
        params:
          json: =steps.request.response_body
          path: >
            "/files"
        returns:
          result: files_array
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: files_array
