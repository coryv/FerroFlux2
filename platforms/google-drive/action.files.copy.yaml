meta:
  id: google-drive.files.copy
  name: Copy File
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Copies a file in Google Drive."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fileId
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/files/{{ get 'inputs.fileId' }}/copy"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
