meta:
  id: google-drive.files.move
  name: Move File
  category: Cloud Storage & Files
  type: Action
  platform: google-drive
  description: "Moves a file to a new folder in Google Drive."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fileId
      type: string
    - name: addParents
      type: string
    - name: removeParents
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: "{{ platform.base_url }}/files/{{ get 'inputs.fileId' }}"
      headers: "{{ platform.headers }}"
      query:
        addParents: "{{ get 'inputs.addParents' }}"
        removeParents: "{{ get 'inputs.removeParents' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
