meta:
  permissions: ["network:api.resend.com"]
  id: resend.domains.get
  name: Get Domain
  category: Domains
  type: Action
  platform: resend
  description: Retrieve details of a specific domain by its ID.
  version: 1.0.0
  discovery:
    purpose: Retrieve detailed metadata and DNS verification status for a specific Resend domain.
    usage_context: Use to verify if a domain has valid SPF/DKIM records or to retrieve its unique region configuration.
    agent_hints:
      - "Requires a domain_id."
      - "Returns the domain object with DNS records and status."
    waml_examples:
      - title: Get Domain Info
        waml: |
          - step: fetch
            call: resend.action.domains.get
            with:
               domain_id: 71a3999c-5117-406b-8253-91f1b9dc1031

interface:
  inputs:
    - name: Exec
      type: flow
    - name: domain_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: domain
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/domains/" + inputs.domain_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: domain
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
