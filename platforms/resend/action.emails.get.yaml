meta:
  permissions: ["network:api.resend.com"]
  id: resend.emails.get
  name: Get Email
  category: Emails
  type: Action
  platform: resend
  description: "Retrieve details of a previously sent email by its ID."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve the details and delivery status of a single email sent via Resend."
    usage_context: "Use to confirm email delivery, check for bounce errors, or verify the content of a sent notification."
    agent_hints:
      - "Requires an email_id."
      - "Returns the email object with 'delivered', 'bounced', and 'compliant' status."
    waml_examples:
      - title: "Check Email Status"
        waml: |
          - step: check_status
            call: resend.action.emails.get
            with:
               email_id: "49a3999c-5117-406b-8253-91f1b9dc1031"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: email_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: email
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/emails/" + inputs.email_id
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: email
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
