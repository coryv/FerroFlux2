meta:
  permissions: ["network:api.resend.com"]
  id: resend.emails.send
  name: Send Email
  category: Emails
  type: Action
  platform: resend
  description: "Sends a transactional email via Resend."
  version: "1.0.0"
  discovery:
    purpose: "Send high-deliverability emails (welcome, notifications, resets) using a modern, developer-friendly API."
    usage_context: "Use this for programmatic outbound communication, automated alerts, and professional customer engagement."
    agent_hints:
      - "Specify 'from', 'to', 'subject', and 'html' or 'text' content."
      - "Supports custom 'headers' and 'tags' for tracking."
    waml_examples:
      - title: "Send Welcome Email"
        waml: |
          - step: say_hello
            call: resend.action.emails.send
            with:
               from: "Acme <onboarding@acme.com>"
               to: ["user@example.com"]
               subject: "Welcome to Acme!"
               html: "<strong>Ready to get started?</strong>"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: to
      type: string
    - name: subject
      type: string
    - name: html
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: email
      type: object
  settings:
    - name: from
      label: "From Address"
      type: string
      required: true
      placeholder: "you@yourdomain.com"
    - name: reply_to
      label: "Reply-To Address"
      type: string
      required: false
    - name: cc
      label: "CC Address(es)"
      type: string
      required: false
    - name: bcc
      label: "BCC Address(es)"
      type: string
      required: false

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/emails"
      headers: platform.headers
      body:
        from: settings.from
        to: inputs.to
        subject: inputs.subject
        html: inputs.html
        text: inputs.text
        reply_to: settings.reply_to
        cc: settings.cc
        bcc: settings.bcc
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: email
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
