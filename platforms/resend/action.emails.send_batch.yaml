meta:
  id: resend.emails.send_batch
  name: Send Batch Emails
  category: Emails
  type: Action
  platform: resend
  description: "Send up to 100 emails in a single API call using Resend's batch endpoint."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: emails
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: results
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/emails/batch"
      headers: "{{ platform.headers }}"
      body: "{{ inputs.emails }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: results
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
