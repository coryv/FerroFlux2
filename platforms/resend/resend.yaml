meta:
  permissions: ["network:api.resend.com"]
  id: resend
  name: Resend
  type: Platform
  category: Communication
  description: "Connects to the Resend email API for sending transactional and marketing emails."
  version: "1.0.0"

config:
  base_url: "https://api.resend.com"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_KEY_HERE"

settings:
  - name: api_key
    label: "API Key"
    type: string
    required: true
