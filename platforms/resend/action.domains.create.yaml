meta:
  permissions: ["network:api.resend.com"]
  id: resend.domains.create
  name: Create Domain
  category: Domains
  type: Action
  platform: resend
  description: Registers a new sending domain in Resend.
  version: 1.0.0
  discovery:
    purpose: Configure a custom domain for sending verified, branded emails from your workspace.
    usage_context: Use this to programmatically set up white-labeled sending for multi-tenant applications or to manage multiple business domains.
    agent_hints:
      - "Note that DNS records will need to be configured after creation to verify the domain."
    waml_examples:
      - title: Add Sending Domain
        waml: |
          - step: mk_domain
            call: resend.action.domains.create
            with:
               name: mail.acme.com
               region: us-east-1

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: domain
      type: object
  settings:
    - name: region
      label: Region
      type: select
      required: false
      default: us-east-1
      options:
        - label: US East (N. Virginia)
          value: us-east-1
        - label: EU West (Ireland)
          value: eu-west-1
        - label: SA East (São Paulo)
          value: sa-east-1

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/domains"
      headers: =platform.headers
      body:
        name: inputs.name
        region: =settings.region
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: domain
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
