meta:
  permissions: ["network:api.resend.com"]
  id: resend.domains.create
  name: Create Domain
  category: Domains
  type: Action
  platform: resend
  description: "Add a new sending domain to your Resend account."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: domain
      type: object
  settings:
    - name: region
      label: "Region"
      type: select
      required: false
      default: "us-east-1"
      options:
        - label: "US East (N. Virginia)"
          value: "us-east-1"
        - label: "EU West (Ireland)"
          value: "eu-west-1"
        - label: "SA East (São Paulo)"
          value: "sa-east-1"

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/domains"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
        region: "{{ get 'settings.region' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: domain
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
