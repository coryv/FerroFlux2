meta:
  id: resend.domains.remove
  name: Remove Domain
  category: Domains
  type: Action
  platform: resend
  description: "Delete a domain from your Resend account by its ID."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: domain_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: "{{ platform.base_url }}/domains/{{ get 'inputs.domain_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "204"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
