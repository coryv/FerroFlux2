meta:
  permissions: ["network:graph.microsoft.com"]
  id: excel.sheets.list
  name: List Sheets
  category: Sheets
  type: Action
  platform: excel
  description: List worksheets in an Excel workbook.
  version: 1.0.0
  discovery:
    purpose: Retrieve a list of all worksheets within a specific Excel workbook.
    usage_context: Use to dynamically discover which sheets are available (e.g. 'January', 'February', 'Master') before performing row-level operations.
    agent_hints:
      - "Requires drive_id and item_id."
      - "Returns an array of sheet objects including name and visibility status."
    waml_examples:
      - title: List Sheets
        waml: |
          - step: get_sheets
            call: excel.action.sheets.list
            with:
               drive_id: me
               item_id: workbook-123

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: sheets
      type: array

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/me/drive/items/" + inputs.file_id + "/workbook/worksheets"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_sheets
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/value"
    returns:
      result: sheets_array

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: sheets
          value: =steps.extract_sheets.sheets_array
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
