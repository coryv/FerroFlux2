meta:
  permissions: ["network:graph.microsoft.com"]
  id: excel.rows.list
  name: Get Rows
  category: Rows
  type: Action
  platform: excel
  description: "Get all rows from an Excel worksheet."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve a list of rows from an Excel table or worksheet."
    usage_context: "Use to fetch inventory data, student grades, or expense reports for automated analysis or sync into other tools."
    agent_hints:
      - "Requires drive_id, item_id, and a worksheet name or table name."
      - "Returns a 2D array of values."
    waml_examples:
      - title: "Fetch Data"
        waml: |
          - step: fetch
            call: excel.action.rows.list
            with:
               drive_id: "me"
               item_id: "workbook-123"
               worksheet: "Financials"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
    - name: sheet_name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: rows
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/me/drive/items/" + inputs.file_id + "/workbook/worksheets/" + inputs.sheet_name + "/usedRange"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_rows
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/values"
    returns:
      result: rows_array

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: rows
          value: steps.extract_rows.rows_array
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
