meta:
  permissions: ["network:graph.microsoft.com"]
  id: excel.rows.append
  name: Append Row
  category: Rows
  type: Action
  platform: excel
  description: "Append one or more rows to an Excel table."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
    - name: sheet_name
      type: string
    - name: table_name
      type: string
    - name: values
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/me/drive/items/{{ get 'inputs.file_id' }}/workbook/worksheets/{{ get 'inputs.sheet_name' }}/tables/{{ get 'inputs.table_name' }}/rows"
      headers: "{{ platform.headers }}"
      body:
        values: "{{ inputs.values }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "201"
          output: success
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
