meta:
  permissions: ["network:graph.microsoft.com"]
  id: excel.rows.append
  name: Append Row
  category: Rows
  type: Action
  platform: excel
  description: Append one or more rows to an Excel table.
  version: 1.0.0
  discovery:
    purpose: Append one or more rows of data to the end of an Excel table or worksheet.
    usage_context: Use to log form submissions, record sales transactions, or append monthly expenses to a master workbook.
    agent_hints:
      - "Requires drive_id, item_id, and a worksheet name or table name."
      - "Data should be provided as a 2D array (values)."
    waml_examples:
      - title: Log Entry
        waml: |
          - step: log
            call: excel.action.rows.append
            with:
               drive_id: me
               item_id: workbook-123
               worksheet: Sheet1
               values: [["2023-11-01", "Coffee", 4.50]]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
    - name: sheet_name
      type: string
    - name: table_name
      type: string
    - name: values
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/me/drive/items/" + inputs.file_id + "/workbook/worksheets/" + inputs.sheet_name + "/tables/" + inputs.table_name + "/rows"
      headers: =platform.headers
      body:
        values: =inputs.values
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
