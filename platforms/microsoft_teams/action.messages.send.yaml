meta:
  permissions: ["network:graph.microsoft.com"]
  id: microsoft_teams.messages.send
  name: Send Channel Message
  category: Messages
  type: Action
  platform: microsoft_teams
  description: Send a message to a channel.
  version: 1.0.0
  discovery:
    purpose: Send a new chat message to a specific Microsoft Teams channel or chat.
    usage_context: Use to automate internal alerts, provide status updates to project teams, or bridge notifications from external monitors into a Teams group.
    agent_hints:
      - "Requires teamId and channelId."
    waml_examples:
      - title: Send Update
        waml: |
          - step: notify
            call: microsoft_teams.action.messages.send
            with:
               team_id: 71a3999c51
               channel_id: "19:123456789abc@thread.tacv2"
               content: "Build successful!"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: teamId
      type: string
    - name: channelId
      type: string
    - name: content
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/teams/" + inputs.teamId + "/channels/" + inputs.channelId + "/messages"
      headers: =platform.headers
      body:
        body:
          content: =inputs.content
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
