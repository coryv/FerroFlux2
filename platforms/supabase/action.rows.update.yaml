meta:
  permissions: ["network:*.supabase.co"]
  id: supabase.rows.update
  name: Update Rows
  category: Rows
  type: Action
  platform: supabase
  description: "Updates rows from a table matching a filter using PostgREST."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
    - name: data
      type: object
    - name: filters
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: rows
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: "https://{{ get 'settings.project_ref' }}.supabase.co/rest/v1/{{ get 'inputs.table' }}?{{ get 'inputs.filters' }}"
      headers:
        Content-Type: "application/json"
        apikey: "{{ get 'settings.api_key' }}"
        Authorization: "Bearer {{ get 'settings.api_key' }}"
        Prefer: "return=representation"
      body: "{{ get 'inputs.data' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: rows
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
