meta:
  permissions: ["network:*.supabase.co"]
  id: supabase.rows.update
  name: Update Rows
  category: Rows
  type: Action
  platform: supabase
  description: Updates rows in a Supabase table.
  version: 1.0.0
  discovery:
    purpose: Modify existing records in a Supabase PostgreSQL table.
    usage_context: Use this to change values, such as updating a user's profile information or changing an order's status. Requires a 'filter' to target specific rows.
    agent_hints:
      - "Filtering uses PostgREST syntax (e.g. 'id=eq.123')."
      - "The 'body' is a JSON object with the fields to update."
    waml_examples:
      - title: Mark Task Complete
        waml: |
          - step: complete_task
            call: supabase.action.rows.update
            with:
               table: tasks
               filter: id=eq.101
               body:
                 status: completed

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
    - name: data
      type: object
    - name: filters
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: rows
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: >
        "https://" + settings.project_ref + ".supabase.co/rest/v1/" + inputs.table + "?" + inputs.filters
      headers:
        Content-Type: >
          "application/json"
        apikey: =settings.api_key
        Authorization: >
          "Bearer " + settings.api_key
        Prefer: >
          "return=representation"
      body: =inputs.data
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: rows
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
