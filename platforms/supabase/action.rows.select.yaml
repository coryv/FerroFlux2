meta:
  permissions: ["network:*.supabase.co"]
  id: supabase.rows.select
  name: Select Rows
  category: Rows
  type: Action
  platform: supabase
  description: Selects rows from a Supabase table.
  version: 1.0.0
  discovery:
    purpose: Retrieve data from a Supabase PostgreSQL table using REST.
    usage_context: Use this to fetch records using simple or complex filters. Ideal for front-end driven data fetching or serverless workflows.
    agent_hints:
      - "The 'select' parameter defaults to '*' (all columns). Use a comma-separated list to limit fields."
      - "Filtering uses PostgREST syntax (e.g. 'id=eq.1', 'name=ilike.*john*')."
    waml_examples:
      - title: Fetch High-Value Orders
        waml: |
          - step: get_orders
            call: supabase.action.rows.select
            with:
               table: orders
               select: id, total_price, customer_id
               filter: total_price=gt.100

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
    - name: select
      type: string
    - name: filters
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: rows
      type: array
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        "https:'=//" + settings.project_ref + ".supabase.co/rest/v1/" + inputs.table + "?select=" + inputs.select + "&" + inputs.filters'
      headers:
        Content-Type: >
          "application/json"
        apikey: =settings.api_key
        Authorization: >
          "Bearer " + settings.api_key
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: rows
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
