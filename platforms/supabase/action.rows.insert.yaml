meta:
  permissions: ["network:*.supabase.co"]
  id: supabase.rows.insert
  name: Insert Row
  category: Rows
  type: Action
  platform: supabase
  description: "Inserts a new row into a table using PostgREST."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
    - name: data
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://" + settings.project_ref + ".supabase.co/rest/v1/" + inputs.table
      headers:
        Content-Type: >
          "application/json"
        apikey: settings.api_key
        Authorization: >
          "Bearer " + settings.api_key
        Prefer: >
          "return=representation"
      body: inputs.data
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
