meta:
  permissions: ["network:*.supabase.co"]
  id: supabase.rows.insert
  name: Insert Row
  category: Rows
  type: Action
  platform: supabase
  description: Inserts a new row into a table using PostgREST.
  version: 1.0.0
  discovery:
    purpose: Insert one or more new rows into a Supabase (PostgreSQL) table via the REST API.
    usage_context: Use to persist application data, log new user activity, or synchronize data from external webhooks into a Supabase backend.
    agent_hints:
      - "Requires table_name and a JSON object or array of objects representing the rows."
    waml_examples:
      - title: Save Profile
        waml: |
          - step: save
            call: supabase.action.rows.insert
            with:
               table_name: profiles
               row: { "id": "123", "name": "John Doe" }
               on_conflict: do_nothing
               returning: representation

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
    - name: data
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        ="https://" + settings.project_ref + ".supabase.co/rest/v1/" + inputs.table
      headers:
        Content-Type: >
          "application/json"
        apikey: =settings.api_key
        Authorization: >
          "Bearer " + settings.api_key
        Prefer: >
          "return=representation"
      body: =inputs.data
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
