meta:
  permissions: ["network:www.googleapis.com"]
  id: google_calendar.events.create
  name: Create Event
  category: Events
  type: Action
  platform: google_calendar
  description: Creates an event.
  version: 1.0.0
  discovery:
    purpose: Create a new event on a Google Calendar.
    usage_context: Use to automatically schedule meetings from an email thread, block time for focus, or create project-specific calendar entries.
    agent_hints:
      - "Requires summary, start, and end (including timezone)."
    waml_examples:
      - title: Quick Meeting
        waml: |
          - step: schedule
            call: google_calendar.action.events.create
            with:
               summary: Project Review
               start: { dateTime: "2023-11-01T10:00:00Z" }
               end: { dateTime: "2023-11-01T11:00:00Z" }
               description: Discuss quarterly goals.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: calendarId
      type: string
    - name: event_data
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =event
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/" + inputs.calendarId + "/events"
      headers: =platform.headers
      body: =inputs.event_data
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =event
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
