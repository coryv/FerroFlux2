meta:
  permissions: ["network:www.googleapis.com"]
  id: google_calendar.events.get
  name: Get Event
  category: Events
  type: Action
  platform: google_calendar
  description: Returns an event.
  version: 1.0.0
  discovery:
    purpose: Retrieve complete details, descriptions, and metadata for a specific calendar event.
    usage_context: Use to fetch meeting descriptions, attendee lists, or conference call links for automated prep.
    agent_hints:
      - "Requires a valid event_id."
    waml_examples:
      - title: Fetch Event Details
        waml: |
          - step: get_event
            call: google_calendar.action.events.get
            with:
               event_id: 71a3999c-5117-406b-8253-91f1b9dc1031

interface:
  inputs:
    - name: Exec
      type: flow
    - name: calendarId
      type: string
    - name: eventId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =event
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/" + inputs.calendarId + "/events/" + inputs.eventId
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =event
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
