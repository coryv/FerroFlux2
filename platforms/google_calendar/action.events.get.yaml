meta:
  id: google_calendar.events.get
  name: Get Event
  category: Events
  type: Action
  platform: google_calendar
  description: "Returns an event."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: calendarId
      type: string
    - name: eventId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: event
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/{{ get 'inputs.calendarId' }}/events/{{ get 'inputs.eventId' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: event
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
