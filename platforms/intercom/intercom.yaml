meta:
  id: intercom
  name: "Intercom"
  category: "Support"
  type: Platform
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/intercom.svg"
  permissions: ["network:api.intercom.io"]

config:
  base_url: "https://api.intercom.io"
  auth_type: "oauth2"
  auth:
    type: "bearer"
  connection_schema:
    - name: "access_token"
      type: "string"
      required: true
      is_secret: true
