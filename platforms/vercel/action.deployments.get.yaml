meta:
  id: vercel.deployments.get
  name: Get Deployment
  category: Deployments
  type: Action
  platform: vercel
  description: Gets the status and details of a specific Vercel deployment.
  version: 1.0.0
  discovery:
    purpose: Check if a deployment has finished, failed, or is still building.
    usage_context: Use this in a polling loop or after a 'create_deployment' step to verify that the site is live before notifying users.
    agent_hints:
      - "Requires the 'id' (deployment ID) returned by the 'create' action."
      - "Monitor the 'readyState' field ('READY', 'ERROR', 'BUILDING')."
    waml_examples:
      - title: Check Build Status
        waml: |
          - step: check_build
            call: vercel.action.deployments.get
            with:
               id: dpl_123...
  permissions:
    - "network:api.vercel.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: deployment
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/v13/deployments/" + inputs.id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: deployment
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
