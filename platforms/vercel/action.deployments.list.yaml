meta:
  id: vercel.deployments.list
  name: List Deployments
  category: Deployments
  type: Action
  platform: vercel
  description: Lists all deployments for the authorized Vercel account or team.
  version: 1.0.0
  discovery:
    purpose: Browse the history of builds and deployments.
    usage_context: Use this to audit recent changes, find the latest successful deployment for a project, or clean up old preview environments.
    agent_hints:
      - "Supports filtering by 'projectId' and 'app' name."
    waml_examples:
      - title: List Recent Builds
        waml: |
          - step: list_deploys
            call: vercel.action.deployments.list
            with:
               limit: 10
  permissions:
    - "network:'api.vercel.com"'

interface:
  inputs:
    - name: Exec
      type: flow
    - name: app
      type: string
    - name: limit
      type: number
      default: 20
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: deployments
      type: array

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/v6/deployments"
      headers: =platform.headers
      query:
        app: =inputs.app
        limit: =inputs.limit
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: deployments
          value: =steps.request.response_body.deployments
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
