meta:
  id: vercel.deployments.create
  name: Create Deployment
  category: Deployments
  type: Action
  platform: vercel
  description: "Create a new deployment for a project."
  version: "1.0.0"
  permissions:
    - "network:api.vercel.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
    - name: git_source
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: deployment
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/v13/deployments"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
        gitSource: "{{ inputs.git_source }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: deployment
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
