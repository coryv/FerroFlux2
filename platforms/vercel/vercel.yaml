meta:
  id: vercel
  name: Vercel
  type: Platform
  category: Developer Tools
  description: "Connects to the Vercel API for deployment management."
  version: "1.0.0"
  permissions:
    - "network:api.vercel.com"

config:
  base_url: "https://api.vercel.com"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_API_TOKEN_HERE"

settings:
  - name: api_key
    label: "API Token"
    type: string
    required: true
