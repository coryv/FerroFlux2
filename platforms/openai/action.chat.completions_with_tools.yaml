meta:
  permissions: ["network:api.openai.com"]
  id: openai.chat.completion.with_tools
  name: Chat Completion with Tools
  category: AI/ML
  type: Action
  platform: openai
  description: "Generate a chat completion with tool/function calling support. Pass a JSON array of tool definitions; the model may call one or more."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: user_prompt
      type: string
    - name: tools
      type: array
    - name: messages
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
    - name: tool_calls
      type: array
    - name: content
      type: string

  settings:
    - name: model
      label: Model
      type: string
      default: "gpt-4o"
    - name: system_prompt
      label: System Prompt
      type: string
      default: "You are a helpful assistant."
    - name: tool_choice
      label: Tool Choice
      type: select
      default: "auto"
      options:
        - label: "Auto (model decides)"
          value: "auto"
        - label: "Required (must call a tool)"
          value: "required"
        - label: "None (no tool calls)"
          value: "none"
    - name: parallel_tool_calls
      label: "Allow Parallel Tool Calls"
      type: boolean
      default: true

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/chat/completions"
      headers: "{{ platform.headers }}"
      body:
        model: "{{ get 'settings.model' }}"
        messages:
          - role: system
            content: "{{ get 'settings.system_prompt' }}"
          - role: user
            content: "{{ get 'inputs.user_prompt' }}"
        tools: "{{ get 'inputs.tools' }}"
        tool_choice: "{{ get 'settings.tool_choice' }}"
        parallel_tool_calls: "{{ get 'settings.parallel_tool_calls' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: response
          value: "{{ steps.request.response_body }}"
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/choices/0/message/tool_calls"
        returns:
          result: tool_calls_result
      - tool: emit
        params:
          port: tool_calls
          value: "{{ tool_calls_result }}"
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/choices/0/message/content"
        returns:
          result: content_result
      - tool: emit
        params:
          port: content
          value: "{{ content_result }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
