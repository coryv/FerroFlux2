meta:
  permissions: ["network:api.openai.com"]
  id: openai
  name: OpenAI
  category: AI/ML
  type: Platform
  description: "Interacts with OpenAI's API"
  version: "1.0.0"
  discovery:
    purpose: "Manage and authorize OpenAI API keys for use across all OpenAI-compatible integrations."
    usage_context: "Use to provide secure access to GPT-4, DALL-E, and Embedding models within the FerroFlux platform."
    agent_hints:
      - "Credentials are encrypted at rest."
    waml_examples:
      - title: "OpenAI Auth"
        waml: |
          - step: auth
            call: openai.credentials
            with:
               id: "my-openai-key"

# Base configuration for all nodes using this platform
config:
  base_url: "https://api.openai.com/v1"
  auth:
    type: bearer
    token: secrets.OPENAI_API_KEY
  headers:
    Content-Type: "application/json"
