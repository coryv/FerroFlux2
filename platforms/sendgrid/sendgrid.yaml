meta:
  id: sendgrid
  name: "SendGrid"
  category: "Marketing"
  type: Platform
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/sendgrid.svg"
  permissions: ["network:api.sendgrid.com"]

config:
  base_url: "https://api.sendgrid.com/v3"
  auth_type: "api_key"
  auth:
    type: "bearer"
  connection_schema:
    - name: "api_key"
      type: "string"
      required: true
      is_secret: true
