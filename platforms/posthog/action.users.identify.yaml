meta:
  id: posthog.users.identify
  name: Identify User
  category: Analytics
  type: Action
  platform: posthog
  description: Identify and update properties for a user in PostHog.
  version: 1.0.0
  discovery:
    purpose: Associate a user with specific traits (e.g. email, name, subscription tier) to enable targeted analysis and cohort building.
    usage_context: Use this when a user's status changes (e.g. upgraded to Pro) or when you gain more information about an anonymous user.
    agent_hints:
      - "Requires a 'distinct_id'."
      - "Properties passed will be merged with existing user properties."
    waml_examples:
      - title: Identify Pro User
        waml: |
          - step: update_user
            call: posthog.action.users.identify
            with:
               distinct_id: user_123
               $set:
                  email: user@example.com
                  tier: Pro
  permissions:
    - "network:'app.posthog.com"'

interface:
  inputs:
    - name: Exec
      type: flow
    - name: distinct_id
      type: string
    - name: properties
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/capture"
      headers: =platform.headers
      body:
        api_key: =settings.project_api_key
        event: >
          "$identify"
        distinct_id: =inputs.distinct_id
        "$set": =inputs.properties
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
