meta:
  id: posthog
  name: PostHog
  type: Platform
  category: Analytics
  description: "Connects to the PostHog API for product analytics and user tracking."
  version: "1.0.0"
  permissions:
    - "network:app.posthog.com"

config:
  base_url: "https://app.posthog.com"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_PERSONAL_API_KEY_HERE"

settings:
  - name: personal_api_key
    label: "Personal API Key"
    type: string
    required: true
  - name: project_api_key
    label: "Project API Key (Write Key)"
    type: string
    required: true
