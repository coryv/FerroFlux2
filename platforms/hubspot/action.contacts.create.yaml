meta:
  permissions: ["network:api.hubapi.com"]
  id: hubspot.contacts.create
  name: Create Contact
  category: Contacts
  type: Action
  platform: hubspot
  description: "Creates a new contact in HubSpot CRM."
  version: "1.0.0"
  discovery:
    purpose: "Add a new individual to your HubSpot marketing and sales database."
    usage_context: "Use this to capture new leads from a signup form, import contacts from an external system, or add new subscribers to a mailing list."
    agent_hints:
      - "Email is usually the primary identifier for deduplication in HubSpot."
      - "Properties must match internal HubSpot property names (e.g. 'firstname', 'lastname', 'email')."
    waml_examples:
      - title: "Create New Contact"
        waml: |
          - step: add_contact
            call: hubspot.action.contacts.create
            with:
               properties:
                 email: "jane.doe@example.com"
                 firstname: "Jane"
                 lastname: "Doe"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: properties
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: contact
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/objects/contacts"
      headers: platform.headers
      body:
        properties: inputs.properties
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: contact
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
