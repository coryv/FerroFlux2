meta:
  permissions: ["network:api.hubapi.com"]
  id: hubspot.contacts.create
  name: Create Contact
  category: Contacts
  type: Action
  platform: hubspot
  description: "Create a new contact in HubSpot."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: properties
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: contact
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/objects/contacts"
      headers: "{{ platform.headers }}"
      body:
        properties: "{{ get 'inputs.properties' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: contact
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
