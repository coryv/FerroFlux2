meta:
  id: hubspot.contacts.search
  name: Search Contacts
  category: Contacts
  type: Action
  platform: hubspot
  description: "Search for a contact systematically."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: filterGroups
      type: array
    - name: sorts
      type: array
    - name: properties
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: contacts
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/objects/contacts/search"
      headers: "{{ platform.headers }}"
      body:
        filterGroups: "{{ get 'inputs.filterGroups' }}"
        sorts: "{{ get 'inputs.sorts' }}"
        properties: "{{ get 'inputs.properties' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

  - id: extract
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/results"
    returns:
      result: contacts

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: contacts
          value: "{{ steps.extract.contacts }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
