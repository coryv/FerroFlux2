meta:
  permissions: ["network:api.hubapi.com"]
  id: hubspot.contacts.search
  name: Search Contacts
  category: Contacts
  type: Action
  platform: hubspot
  description: Searches for contacts in HubSpot CRM using filters.
  version: 1.0.0
  discovery:
    purpose: Find specific contacts based on their properties or behavioral data.
    usage_context: Use this to find a contact by email, list all contacts in a specific city, or find 'Qualified' leads for a follow-up workflow.
    agent_hints:
      - "The 'filterGroups' parameter follows the HubSpot Search API structure."
      - "Note that common operators include 'EQ' (equals), 'NEQ' (not equals), 'GT', 'LT'."
    waml_examples:
      - title: Find Contact by Email
        waml: |
          - step: find_user
            call: hubspot.action.contacts.search
            with:
               filterGroups:
                 - filters:
                     - propertyName: email
                       operator: EQ
                       value: user@example.com

interface:
  inputs:
    - name: Exec
      type: flow
    - name: filterGroups
      type: array
    - name: sorts
      type: array
    - name: properties
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =contacts
      type: array
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/objects/contacts/search"
      headers: =platform.headers
      body:
        filterGroups: =inputs.filterGroups
        sorts: =inputs.sorts
        properties: =inputs.properties
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/results"
    returns:
      result: contacts

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =contacts
          value: =steps.extract.contacts
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
