meta:
  permissions: ["network:api.hubapi.com"]
  id: hubspot.deals.create
  name: Create Deal
  category: Deals
  type: Action
  platform: hubspot
  description: Creates a new deal in HubSpot CRM.
  version: 1.0.0
  discovery:
    purpose: Add a new sales opportunity to a pipeline.
    usage_context: Use this to track new business, manage renewals, or log representative sales activity. Requires 'dealname' and 'pipeline'.
    agent_hints:
      - "Note that 'dealstage' and 'pipeline' must match internal HubSpot IDs (use the metadata API to find these)."
      - "Custom properties like 'amount', 'close_date', and 'deal_owner' can also be provided."
    waml_examples:
      - title: Create New Deal
        waml: |
          - step: log_deal
            call: hubspot.action.deals.create
            with:
               properties:
                 dealname: Acme Q2 Expansion
                 dealstage: appointmentscheduled
                 amount: 5000

interface:
  inputs:
    - name: Exec
      type: flow
    - name: properties
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: deal
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/objects/deals"
      headers: =platform.headers
      body:
        properties: =inputs.properties
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: deal
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
