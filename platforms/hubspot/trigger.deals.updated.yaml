meta:
  permissions: ["network:api.hubapi.com"]
  id: hubspot.trigger.deals.updated
  name: Updated Deal
  category: Deals
  type: Trigger
  platform: hubspot
  description: Triggers when an existing HubSpot deal is modified.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a deal's stage, amount, or close date changes.
    usage_context: Use this to notify sales managers of large deal closings, update external revenue forecast systems, or alert team members of lost deals.
    agent_hints:
      - "Reacts to any change in the selected 'properties'."
      - "Note that 'dealstage' changes are the most common trigger for this node."
    waml_examples:
      - title: Notify on Deal Win
        waml: |
          trigger:
            deal_won:
               call: =hubspot.trigger.deals.updated
               with:
                  properties: ["dealstage", "amount"]

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: deal
      type: object
  settings:
    - name: properties
      label: Properties to Fetch
      type: string
      default: dealname,amount,dealstage,closedate,hs_lastmodifieddate
      description: Comma-separated list of deal properties to include.
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/crm/v3/objects/deals"
      headers: =platform.headers
      query:
        limit: 50
        properties: =settings.properties
        sort: -hs_lastmodifieddate
        filterGroups: >
          has(event.cursor) ? '[{"filters":[{"propertyName":"hs_lastmodifieddate","operator":"GTE","value":"' + event.cursor + '"}]}]' : "[]"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.query.response_body.results
          cursor_key: properties.hs_lastmodifieddate
          port: deal
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.query.response_body
