meta:
  permissions: ["network:smtp"]
  id: smtp.email.send
  name: Send Email
  category: Email
  type: Action
  platform: smtp
  description: "Send an email using the SMTP protocol."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: from
      type: string
    - name: to
      type: string
    - name: subject
      type: string
    - name: body_text
      type: string
    - name: body_html
      type: string
    - name: attachments
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: send
    tool: smtp
    params:
      host: settings.host
      port: settings.port
      username: settings.username
      password: settings.password
      encryption: settings.encryption

      from: inputs.from
      to: inputs.to
      subject: inputs.subject
      body_text: inputs.body_text
      body_html: inputs.body_html
      attachments: inputs.attachments
    returns:
      result: response_body

routing:
  match: steps.send.response_body.status
  cases:
    "sent":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: steps.send.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.send.response_body
