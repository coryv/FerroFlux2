meta:
  id: core.action.http
  name: HTTP Request
  category: Services
  type: Action
  platform: core
  description: Make an outgoing HTTP request (JSON/Text).
  version: 1.0.0
  discovery:
    purpose: Make a generic HTTP request to an external service.
    usage_context: Use for simple API integrations that do not have a dedicated FerroFlux connector.
    agent_hints:
      - "Supports custom methods, headers, and query parameters."
    waml_examples:
      - title: Fetch External Data
        waml: |
          - step: fetch_data
            call: =core.action.http
            with:
              url: "https://api.example.com/data"
              method: GET

config:
  base_url:

interface:
  inputs:
    - name: Exec
      type: flow

  outputs:
    - name: Success
      type: flow
    - name: =Error
      type: flow

  settings:
    - name: url
      label: URL
      type: string
      required: true
    - name: method
      label: Method
      type: select
      default: GET
      options: ["GET", "POST", "PUT", "PATCH", "DELETE"]
    - name: =headers
      label: Headers (JSON)
      type: textarea
      description: "Custom HTTP headers. e.g. {'Content-Type': 'application/json'}"
    - name: connection
      label: Connection (Optional)
      type: connection_select
      description: Select a stored connection for authentication.
    - name: =body
      label: Body (JSON)
      type: textarea
      description: >
        ="JSON body or template. Use " + inputs.my_var + "."
    - name: output_var
      label: Output Variable
      type: string
      default: http_response

execution:
  - id: =request
    tool: http_client
    params:
      url: =self.settings.url
      method: =self.settings.method
      headers: =self.settings.headers
      body: =self.settings.body
      connection: "=has(self.settings.connection) ? self.settings.connection : ''"
    returns:
      body: response_body
      status: response_status

  - id: check_status
    tool: logic
    params:
      data: =steps.request.response_status
      rules:
        - condition: "=val < 400"
          output: Success
        - condition: default
          output: Error

  - id: emit_data
    tool: emit
    params:
      port: =self.settings.output_var
      value: =steps.request.response_body

  - id: emit_signal
    tool: emit
    params:
      port: =steps.check_status.match
