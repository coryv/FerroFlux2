meta:
  id: core.action.split
  name: Split Array
  category: Transform
  type: Action
  node_subtype: Iterator
  platform: core
  description: "Splits an array into individual items for stream processing."
  version: "1.0.0"
  discovery:
    purpose: "Iterate over an array of items, running downstream steps for each."
    usage_context: "Use to process lists of data (e.g., rows from a spreadsheet, list of orders) in parallel."
    agent_hints:
      - "The rest of the workflow is executed once per item."
    waml_examples:
      - title: "Process List"
        waml: |
          - step: iterate
            call: core.action.split
            with:
              items: steps.get_list.body

interface:
  inputs:
    - name: Exec
      type: flow
  
  outputs:
    - name: item
      type: flow
    - name: Done
      type: flow

execution:
  - id: split_op
    tool: split
    params:
      array: inputs.array
    returns:
      item: current_item
      done: is_done

  - id: emit_item
    tool: emit
    params:
      port: item
      value: steps.split_op.current_item
    
  - id: check_done
    tool: logic
    params:
      data: steps.split_op.is_done
      rules:
        - condition: >
          "val == true"
          output: Done
