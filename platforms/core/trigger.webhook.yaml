meta:
  id: core.trigger.webhook
  name: Webhook
  category: Triggers
  type: Trigger
  platform: core
  description: "Triggers when a specific URL is called."
  version: "1.0.0"
  discovery:
    purpose: "Initialize a workflow when an incoming HTTP request is received."
    usage_context: "Use for external integrations that push data to FerroFlux (e.g., Stripe, GitHub, custom scripts)."
    agent_hints:
      - "The body, headers, and query parameters are available as outputs."
      - "Raw body is provided for HMAC signature verification."
    waml_examples:
      - title: "External Webhook"
        waml: |
          - step: incoming_data
            type: trigger
            call: core.trigger.webhook
            settings:
              path: "/orders/sync"

interface:
  inputs: []
  outputs:

    - name: Success
      type: flow

    - name: body
      type: any

    - name: headers
      type: object

    - name: query
      type: object

    - name: raw_body
      type: string
      description: "Raw request body string — use with verify_signature for HMAC validation"

  settings:
    - name: method
      label: HTTP Method
      type: select
      default: POST
      options: ["GET", "POST", "PUT", "PATCH", "DELETE"]
    
    - name: path
      label: Webhook Path
      type: string
      description: "Unique path suffix (e.g. /my-hook)"
      required: true

    - name: webhook_url_test
      label: Test Webhook URL
      type: url
      read_only: true
      default: >
        system.webhook_base + "/test/" + workflow.id + settings.path

    - name: webhook_url_prod
      label: Production Webhook URL
      type: url
      read_only: true
      default: >
        system.webhook_base + "/prod/" + workflow.id + settings.path

execution:
  # Runner injects `event` containing body, headers, query
  - id: emit_body
    tool: emit
    params:
      port: body
      value: event.body

  - id: emit_headers
    tool: emit
    params:
      port: headers
      value: event.headers

  - id: emit_query
    tool: emit
    params:
      port: query
      value: event.query

  - id: emit_raw_body
    tool: emit
    params:
      port: raw_body
      value: event.raw_body

  - id: emit_exec
    tool: emit
    params:
      port: Success
