context: null
execution:
  - id: analyze
    params:
      data: inputs
      detect_outliers: =settings.detect_outliers
      enrichment_key: =settings.enrichment_key
      target_field: =settings.target_field
      threshold: =settings.threshold
    returns:
      stats: stats_result
    tool: >
      "ferroflux:stats"
interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - type: string
      default: value
      label: Target Field
      name: target_field
      required: true
    - type: string
      default: stats
      label: Enrichment Key
      name: enrichment_key
    - type: boolean
      default: false
      label: Detect Outliers
      name: detect_outliers
    - type: number
      default: 2
      label: Z-Score Threshold
      name: threshold
      show_if: detect_outliers
meta:
  category: Manipulation
  data_strategy: enrich
  description: Calculate statistics (Mean, StdDev, Z-Score) for an array of items.
  id: core.manipulation.stats
  name: Statistics
  type: Action
  platform: core
  version: 1.0.0
  discovery:
    purpose: Calculate statistical metrics (mean, standard deviation, z-score) for numerical data in a collection.
    usage_context: Use to identify trends, averages, or anomalies in lists of items (e.g., historical sales or response times).
    agent_hints:
      - "Requires a target numerical field within the collection items."
    waml_examples:
      - title: Analyze Prices
        waml: |
          - step: analyze_prices
            call: core.manipulation.stats
            with:
              target_field: price
              detect_outliers: true
output_transform: null
routing: null
