meta:
  id: core.action.set_var
  name: Set Variable
  category: State
  type: Action
  platform: core
  description: "Stores a value in the workflow's global memory."
  version: "1.0.0"
  discovery:
    purpose: "Store a value in a workflow variable."
    usage_context: "Save an API response or calculation for access later in the workflow."
    agent_hints:
      - "Scope is limited to the current workflow instance."
    waml_examples:
      - title: "Save Result"
        waml: |
          - step: save
            call: core.action.set_var
            with:
              name: total_count
              value: 42

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Exec
      type: flow
    - name: Error
      type: flow

  settings:
    - name: variable_name
      label: Variable Name
      type: string
      required: true

execution:
  - id: set
    tool: set_var
    params:
      name: settings.variable_name
      value: inputs.value

  - id: done
    tool: emit
    params:
      port: Exec
