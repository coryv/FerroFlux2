meta:
  id: core.trigger.sse
  name: SSE Trigger
  category: Triggers
  type: Trigger
  platform: core
  description: Triggers on each event received from a Server-Sent Events (SSE) endpoint.
  version: 1.0.0
  discovery:
    purpose: Listen for real-time events from a Server-Sent Events (SSE) stream.
    usage_context: Use for live data feeds like stock market updates, AI streaming logs, or real-time monitoring.
    agent_hints:
      - "Maintains a persistent connection to the specified URL."
      - "Retries connection automatically on loss."
    waml_examples:
      - title: Live Updates
        waml: |
          - step: listen
            type: trigger
            call: core.trigger.sse
            settings:
              url: "https://api.example.com/events"
  # RUNTIME NOTE: This trigger requires a persistent SSE connection manager in the
  # execution runtime. Unlike webhook triggers (passive/inbound), the SSE trigger
  # actively maintains an outbound HTTP connection and dispatches a workflow execution
  # for each event received. Implementation requires a dedicated Bevy system that
  # spawns and supervises persistent SSE reader tasks, one per registered trigger.

interface:
  inputs: []
  outputs:

    - name: Success
      type: flow

    - name: data
      type: any
      description: "Parsed JSON body of the SSE event (from the 'data:' field)"

    - name: raw
      type: string
      description: "Raw 'data:' field string (pre-parse)"

    - name: event_type
      type: string
      description: "SSE event type from 'event:' line, or 'message' if not specified"

    - name: id
      type: string
      description: "SSE event ID from 'id:' line, if present"

  settings:
    - name: url
      label: SSE Endpoint URL
      type: string
      required: true
      description: Full URL of the SSE endpoint to subscribe to

    - name: connection
      label: Connection
      type: connection
      required: false
      description: Optional connection for authenticated SSE endpoints (Bearer, OAuth2, etc.)

    - name: headers
      label: Extra Headers
      type: object
      required: false
      description: Additional HTTP headers to send with the connection request

    - name: reconnect_delay_ms
      label: Reconnect Delay (ms)
      type: number
      default: 5000
      description: How long to wait before reconnecting after a connection drop

    - name: max_reconnect_attempts
      label: Max Reconnect Attempts
      type: number
      default: 0
      description: Maximum number of reconnect attempts (0 = unlimited)

execution:
  # Runtime injects `event` containing data, raw, event_type, id from the SSE frame
  - id: emit_data
    tool: emit
    params:
      port: data
      value: =event.data

  - id: emit_raw
    tool: emit
    params:
      port: raw
      value: =event.raw

  - id: emit_event_type
    tool: emit
    params:
      port: event_type
      value: =event.event_type

  - id: emit_id
    tool: emit
    params:
      port: id
      value: =event.id

  - id: emit_exec
    tool: emit
    params:
      port: Success
