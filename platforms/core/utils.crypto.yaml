meta:
  id: core.utils.crypto
  name: Crypto Utility
  category: Utilities
  type: Action
  platform: core
  description: Hashing, HMAC, and UUID generation.
  version: 1.0.0
  discovery:
    purpose: Hash or verify data using cryptographic algorithms (SHA-256, HMAC).
    usage_context: Use to verify webhook signatures, generate unique IDs, or secure sensitive data before storage.
    agent_hints:
      - "Supports various algorithms including md5, sha1, sha256."
    waml_examples:
      - title: Verify Signature
        waml: |
          - step: verify
            call: =core.utils.crypto
            with:
               action: hmac_sha256
               key: env.WEBHOOK_SECRET
               data: =inputs.payload

interface:
  inputs:
    - name: =Exec
      type: flow
  outputs:
    - name: =Exec
      type: flow
    - name: Error
      type: flow
    - name: result
      type: string

  settings:
    - name: operation
      label: Operation
      type: string
      required: true
      options:
        - label: SHA-256 Hash
          value: hash
        - label: HMAC-SHA256
          value: hmac
        - label: UUID v4
          value: uuid
    - name: input
      label: Input Data
      type: string
    - name: key
      label: HMAC Key
      type: string

execution:
  - id: crypto
    tool: =core.utils.crypto
    params:
      operation: =settings.operation
      input: =settings.input
      key: =settings.key
    returns:
      result: crypto_res

  - id: emit_res
    tool: emit
    params:
      port: result
      value: =steps.crypto.result

  - id: done
    tool: emit
    params:
      port: Exec
