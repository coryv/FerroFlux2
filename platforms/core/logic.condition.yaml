meta:
  id: core.logic.condition
  name: If / Else
  category: Logic
  type: Action
  platform: core
  description: "Simple binary condition check."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow

  outputs:
    - name: True
      type: flow
    - name: False
      type: flow

  settings:
    - name: a
      label: "Left Value"
      type: any
    - name: b
      label: "Right Value"
      type: any
    - name: operator
      label: Operator
      type: select
      default: "=="
      options: ["==", "!=", ">", "<", ">=", "<="]

execution:
  - id: check
    tool: logic
    params:
      data: "{{ inputs.a }}"
      rules:
        - output: "True"
          condition:
            field: ""
            operator: "{{ settings.operator }}"
            value: "{{ inputs.b }}"
    returns:
      match: branch_name

  - id: route
    tool: emit
    params:
      port: "{{ steps.check.match }}" 
      value: "{{ inputs.a }}" 