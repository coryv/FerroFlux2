meta:
  id: core.logic.condition
  name: If / Else
  category: Logic
  type: Action
  node_subtype: Router
  platform: core
  description: "Simple binary condition check."
  version: "1.0.0"
  discovery:
    purpose: "Evaluate a boolean condition to branch workflow execution."
    usage_context: "Use for if/else logic to decide which path the workflow should take."
    agent_hints:
      - "The condition is a CEL expression that must return a boolean."
    waml_examples:
      - title: "Check Amount"
        waml: |
          - step: check_value
            call: core.logic.condition
            with:
              condition: "inputs.amount > 100"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: a
      type: any
    - name: b
      type: any

  outputs:
    - name: True
      type: flow
    - name: False
      type: flow

  settings:
    - name: a
      label: "Left Value"
      type: any
    - name: b
      label: "Right Value"
      type: any
    - name: operator
      label: Operator
      type: select
      default: "'=='"
      options: ["==", "!=", ">", "<", ">=", "<="]

execution:
  - id: check
    tool: logic
    params:
      data: inputs.a
      rules:
        - output: "'True'"
          condition:
            field: >
              ""
            operator: settings.operator
            value: inputs.b
    returns:
      match: branch_name

  - id: route
    tool: emit
    params:
      port: "steps.check.branch_name == 'default' ? 'False' : steps.check.branch_name"
      value: inputs.a