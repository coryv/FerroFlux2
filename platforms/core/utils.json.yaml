meta:
  id: core.utils.json
  name: JSON Transformer
  category: Utilities
  type: Action
  platform: core
  description: "Advanced JSON path extraction, deep merge, and flattening."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: input
      type: any
  outputs:
    - name: Exec
      type: flow
    - name: Error
      type: flow
    - name: result
      type: any

  settings:
    - name: operation
      label: Operation
      type: string
      required: true
      options:
        - label: Query (JMESPath)
          value: query
        - label: Deep Merge
          value: merge
        - label: Flatten
          value: flatten
    - name: expression
      label: Expression (for Query)
      type: string
    - name: other
      label: Other JSON (for Merge)
      type: any

execution:
  - id: transform
    tool: core.utils.json
    params:
      operation: "{{ settings.operation }}"
      input: "{{ inputs.input }}"
      expression: "{{ settings.expression }}"
      other: "{{ settings.other }}"
    returns:
      result: transformed

  - id: emit_res
    tool: emit
    params:
      port: result
      value: "{{ steps.transform.result }}"

  - id: done
    tool: emit
    params:
      port: Exec
