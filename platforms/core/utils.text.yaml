meta:
  id: core.utils.text
  name: Advanced Text
  category: Utilities
  type: Action
  platform: core
  description: "Regex match/replace, slugify, and truncate text."
  version: "1.0.0"
  discovery:
    purpose: "Perform text manipulations like regex extraction, template rendering, and case conversion."
    usage_context: "Use to format strings for emails, extract IDs from logs, or clean up input data."
    agent_hints:
      - "The 'render' action uses standard templating syntax."
    waml_examples:
      - title: "Render Template"
        waml: |
          - step: format
            call: core.utils.text
            with:
               action: render
               template: "Hello, {{ name }}!"
               data: { name: "Alice" }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: text
      type: string
  outputs:
    - name: Exec
      type: flow
    - name: Error
      type: flow
    - name: result
      type: any

  settings:
    - name: operation
      label: Operation
      type: string
      required: true
      options:
        - label: Regex Match
          value: match
        - label: Regex Replace
          value: replace
        - label: Slugify
          value: slugify
        - label: Truncate
          value: truncate
    - name: pattern
      label: Regex Pattern
      type: string
    - name: replacement
      label: Replacement Text
      type: string
    - name: length
      label: Truncate Length
      type: number

execution:
  - id: process
    tool: core.utils.text
    params:
      operation: settings.operation
      text: inputs.text
      pattern: settings.pattern
      replacement: settings.replacement
      length: settings.length
    returns:
      result: processed

  - id: emit_res
    tool: emit
    params:
      port: result
      value: steps.process.result

  - id: done
    tool: emit
    params:
      port: Exec
