meta:
  id: core.utils.pdf_read
  name: PDF Text Extractor
  category: Utilities
  type: Action
  platform: core
  description: Extract text from PDF Blobs or Base64 strings.
  version: 1.0.0
  discovery:
    purpose: Extract text and metadata from PDF files.
    usage_context: Use to parse invoices, research papers, or contract documents for automated analysis or AI-driven insights.
    agent_hints:
      - "Requires a file object (URL or file stream)."
      - "Returns concatenated text or structured page-by-page content."
    waml_examples:
      - title: Read Document
        waml: |
          - step: read_pdf
            call: =core.utils.pdf_read
            with:
               file: =steps.fetch_doc.output

interface:
  inputs:
    - name: Exec
      type: flow
    - name: pdf_base64
      type: string
  outputs:
    - name: Exec
      type: flow
    - name: Error
      type: flow
    - name: result
      type: string

execution:
  - id: read
    tool: core.utils.pdf_read
    params:
      pdf_base64: =inputs.pdf_base64
    returns:
      result: result

  - id: emit_res
    tool: emit
    params:
      port: result
      value: =steps.read.result

  - id: done
    tool: emit
    params:
      port: Exec
