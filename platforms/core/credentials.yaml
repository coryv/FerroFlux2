meta:
  id: core
  name: Core
  category: Utilities
  type: Platform
  description: Core FerroFlux Logic Nodes
  version: 1.0.0
  discovery:
    purpose: Manage and inject sensitive API keys, tokens, or basic auth credentials into workflows.
    usage_context: Use to retrieve securely stored secrets for use in HTTP requests or platform actions.
    agent_hints:
      - "Credentials are encrypted at rest and only decrypted during workflow execution."
    waml_examples:
      - title: Get API Key
        waml: |
          - step: auth
            call: core.credentials
            with:
               id: my-external-api-key

config:
  # No shared config needed for core nodes usually, but structure is required.
  version: 1.0.0
