meta:
  id: core.action.get_var
  name: Get Variable
  category: State
  type: Action
  platform: core
  description: Retrieves a value from the workflow's global memory.
  version: 1.0.0
  discovery:
    purpose: Retrieve a value from a workflow variable.
    usage_context: Access saved state or results from earlier in the workflow.
    agent_hints:
      - "Variables are local to the current workflow instance."
    waml_examples:
      - title: Get User ID
        waml: |
          - step: load_id
            call: core.action.get_var
            with:
              name: user_id

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Exec
      type: flow
    - name: Error
      type: flow
    - name: value
      type: any

  settings:
    - name: variable_name
      label: Variable Name
      type: string
      required: true

execution:
  - id: get
    tool: get_var
    params:
      name: =settings.variable_name
    returns:
      value: var_val

  - id: emit_val
    tool: emit
    params:
      port: value
      value: =steps.get.value

  - id: done
    tool: emit
    params:
      port: Exec
