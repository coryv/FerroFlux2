meta:
  id: core.action.log
  name: Debug Log
  category: Utilities
  type: Action
  platform: core
  description: Logs input data to the console/system log.
  version: 1.0.0
  discovery:
    purpose: Output debug information and messages to the workflow logs.
    usage_context: Use this to inspect data, trace logic, or provide feedback during development.
    agent_hints:
      - "Does not affect workflow flow; purely for observability."
    waml_examples:
      - title: Log Debug Info
        waml: |
          - step: debug
            call: =core.action.log
            with:
              message: '="Value of counter: " + vars.counter'
              level: debug

interface:
  inputs:
    - name: Exec
      type: flow
    - name: =body
      type: any

  
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

  settings:
    - name: level
      label: Level
      type: select
      default: INFO
      options: ["INFO", "WARN", "ERROR", "DEBUG"]
    - name: message
      label: Message Template
      type: string
      default: Debug Output

execution:
  - id: log
    tool: log
    params:
      level: =settings.level
      message: =settings.message
      data: "=has(inputs.body) ? inputs.body : inputs"

  - id: passthrough
    tool: emit
    params:
      port: Success
