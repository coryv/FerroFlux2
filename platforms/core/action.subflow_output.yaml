meta:
  id: core.action.subflow_output
  name: Sub-workflow Output
  category: Actions
  type: Action
  node_subtype: Terminus
  platform: core
  description: Returns data to the parent workflow and ends the sub-workflow.
  version: 1.0.0
  discovery:
    purpose: Define the return values for a subflow.
    usage_context: Use at the end of a subflow to pass results back to the parent workflow.
    agent_hints:
      - "The input values are emitted to the Success port of the subflow step in the parent."
    waml_examples:
      - title: Return User Data
        waml: |
          - step: output
            call: =core.action.subflow_output
            with:
              user: =steps.get_user.body
              status: active

interface:
  inputs:
    - name: Exec
      type: flow
  outputs: [] # No outputs, terminates flow

  settings: []

execution:
  # Emits to a special system port expected by the Subflow Runner
  - id: return_result
    tool: emit
    params:
      port: _subflow_return
      value: =inputs.result
