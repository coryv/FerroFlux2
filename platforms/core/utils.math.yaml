meta:
  id: core.utils.math
  name: Math
  category: Utilities
  type: Action
  platform: core
  description: "Performs basic arithmetic operations."
  version: "1.0.0"
  discovery:
    purpose: "Perform basic and advanced mathematical calculations within a workflow."
    usage_context: "Use to calculate order totals, adjust inventory levels, or compute statistics from data arrays."
    agent_hints:
      - "Supports standard arithmetic (+, -, *, /) and common functions (min, max, round)."
    waml_examples:
      - title: "Calculate Sales Tax"
        waml: |
          - step: tax
            call: core.utils.math
            with:
               expression: "${inputs.subtotal} * 0.08"

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Exec
      type: flow
    - name: Error
      type: flow
    - name: result
      type: number

  settings:
    - name: a
      label: "Left Value"
      type: any
    - name: b
      label: "Right Value"
      type: any
    - name: operation
      label: Operation
      type: select
      default: add
      options:
        - label: Add
          value: add
        - label: Subtract
          value: sub
        - label: Multiply
          value: mul
        - label: Divide
          value: div

execution:
  - id: calc
    tool: math
    params:
      a: inputs.a
      b: inputs.b
      op: settings.operation
    returns:
      result: math_res

  - id: emit_res
    tool: emit
    params:
      port: result
      value: steps.calc.result

  - id: done
    tool: emit
    params:
      port: Exec
