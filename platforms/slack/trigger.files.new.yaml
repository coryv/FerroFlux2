meta:
  permissions: ["network:api.slack.com"]
  id: slack.trigger.files.new
  name: New File Shared
  category: Files
  type: Trigger
  platform: slack
  description: Triggers when a new file is shared in a Slack workspace or channel.
  version: 1.0.0
  discovery:
    purpose: Monitor Slack for new file uploads and shares.
    usage_context: Use this to automate document processing, backup files to another service, or scan for sensitive content. Can filter by a specific channel or monitor the entire authorized workspace.
    agent_hints:
      - "The 'file' output contains the Slack file object, with 'url_private' for downloading and 'mimetype' for filtering."
      - "Note that the bot must have 'files:read' scopes to detect files outside of channels it is a member of."
    waml_examples:
      - title: Monitor Channel Files
        waml: |
          trigger:
            id: file_tracker
            call: slack.trigger.files.new
            with:
               channel: C12345678

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: file
      type: object
  settings:
    - name: channel
      label: Channel ID (optional — leave blank for all)
      type: string
      required: false
      placeholder: C1234567890
    - name: limit
      label: Batch Limit
      type: number
      default: 10

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/files.list"
      headers: =platform.headers
      query:
        channel: =settings.channel
        limit: >
          (has(settings.limit) ? settings.limit : '10')
    returns:
      status: status_code
      body: response_body

  - id: extract_files
    tool: json_query
    params:
      json: =steps.fetch.response_body
      path: >
        "/files"
    returns:
      files: files_array

routing:
  match: =steps.fetch.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_files.files_array
          cursor_key: timestamp
          port: file
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.fetch.response_body
