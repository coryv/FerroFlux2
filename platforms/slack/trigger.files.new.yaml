meta:
  id: slack.trigger.files.new
  name: New File Shared
  category: Files
  type: Trigger
  platform: slack
  description: "Polls for newly shared files in a Slack channel."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: file
      type: object

  settings:
    - name: channel
      label: "Channel ID (optional — leave blank for all)"
      type: string
      required: false
      placeholder: "C1234567890"
    - name: poll_interval
      label: "Poll Interval (minutes)"
      type: number
      default: 5
      min: 1

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/files.list?channel={{ get 'settings.channel' }}&ts_from={{ get 'event.cursor' }}&count=10"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.fetch.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.fetch.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.fetch.response_body }}"
