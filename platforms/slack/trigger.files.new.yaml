meta:
  permissions: ["network:api.slack.com"]
  id: slack.trigger.files.new
  name: New File Shared
  category: Files
  type: Trigger
  platform: slack
  description: "Polls for newly shared files in a Slack channel."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: file
      type: object
  settings:
    - name: channel
      label: "Channel ID (optional — leave blank for all)"
      type: string
      required: false
      placeholder: "C1234567890"
    - name: limit
      label: "Batch Limit"
      type: number
      default: 10

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/files.list"
      headers: platform.headers
      query:
        channel: settings.channel
        limit: >
          (has(settings.limit) ? settings.limit : '10')
    returns:
      status: status_code
      body: response_body

  - id: extract_files
    tool: json_query
    params:
      json: steps.fetch.response_body
      path: >
        "/files"
    returns:
      files: files_array

routing:
  match: steps.fetch.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: steps.extract_files.files_array
          cursor_key: timestamp
          port: file
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.fetch.response_body
