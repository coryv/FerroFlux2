meta:
  permissions: ["network:api.slack.com"]
  id: slack.trigger.channels.new
  name: New Channel Created
  category: Channels
  type: Trigger
  platform: slack
  description: "Polls for newly created public Slack channels."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: channel
      type: object

  settings:
    - name: poll_interval
      label: "Poll Interval (minutes)"
      type: number
      default: 5
      min: 1

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/conversations.list?types=public_channel&exclude_archived=true&limit=200"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.fetch.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: channel
          value: steps.fetch.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.fetch.response_body
