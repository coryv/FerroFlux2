meta:
  permissions: ["network:api.slack.com"]
  id: slack.messages.new_dm
  name: New Direct Message
  category: Messages
  type: Trigger
  platform: slack
  description: Triggers when any new direct message is received by the bot.
  version: 1.0.0
  discovery:
    purpose: Monitor all incoming private messages to the bot.
    usage_context: Use this for 'catch-all' bot interactions where the user doesn't need to be pre-specified. Ideal for support bots or universal assistants.
    agent_hints:
      - "This trigger iterates through all open IM conversations and checks for new history."
      - "Best used as the primary entry point for a private bot service."
    waml_examples:
      - title: Global DM Listener
        waml: |
          trigger:
            id: dm_catchall
            call: slack.trigger.messages.new_dm

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
  settings:
    - name: limit
      label: Batch Limit
      type: number
      default: 50

execution:
  - id: list_ims
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/conversations.list?types=im&limit=100"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: extract_ims
    tool: json_query
    params:
      json: =steps.list_ims.response_body
      path: >
        "/channels"
    returns:
      channels: channels_array

routing:
  match: =steps.list_ims.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_ims.channels_array
          cursor_key: >
            "\"last_read\" # Slack uses timestamps for cursors"
          port: message
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.list_ims.response_body
