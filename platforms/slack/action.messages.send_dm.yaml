meta:
  permissions: ["network:api.slack.com"]
  id: slack.messages.send_dm
  name: Send Direct Message
  category: Messages
  type: Action
  platform: slack
  description: Send a direct message to a specific user.
  version: 1.0.0
  discovery:
    purpose: Send a private message to an individual Slack user.
    usage_context: Use this for personalized notifications, private alerts, or starting a one-on-one conversation with a user. This action handles opening the DM conversation automatically.
    agent_hints:
      - "The 'user_id' can be retrieved from message triggers or by using 'slack.action.users.get'."
      - "Sending repeatedly to the same user may be perceived as spam; use sparingly."
    waml_examples:
      - title: Send a Welcome DM
        waml: |
          - step: welcome_user
            call: slack.action.messages.send_dm
            with:
               user_id: U12345678
               text: "Hello! Welcome to the workspace. How can I help you today?"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: user_id
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: open_dm
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/conversations.open"
      headers: =platform.headers
      body:
        users: =inputs.user_id
    returns:
      status: status_code
      body: body

  - id: send_message
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/chat.postMessage"
      headers: =platform.headers
      body:
        channel: =steps.open_dm.body.channel.id
        text: =inputs.text
    returns:
      status: status_code
      body: body

routing:
  match: =steps.send_message.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.send_message.body
