meta:
  permissions: ["network:api.slack.com"]
  id: slack.action.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: slack
  description: Uploads a file to a Slack channel using multipart/form-data.
  version: 1.0.0
  discovery:
    purpose: Upload and share files within a Slack workspace.
    usage_context: Use this to share reports, images, or documents generated in a workflow. Requires the file as a 'blob' and a comma-separated list of channel IDs.
    agent_hints:
      - "The 'channels' input can be a single ID or a list of IDs. Ensure the bot is a member of the targeted channels."
      - "The 'file' input must be a valid FerroFlux blob reference."
    waml_examples:
      - title: Upload a Report to a Channel
        waml: |
          - step: share_report
            call: =slack.action.files.upload
            with:
               file: =steps.generate_pdf.blob
               filename: daily_report.pdf
               channels: C12345678
               initial_comment: Here is today's report.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file
      type: blob
      required: true
    - name: filename
      type: string
      required: true
    - name: channels
      type: string
      required: true
    - name: initial_comment
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file_info
      type: object

execution:
  - id: upload
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/files.upload"
      headers: =platform.headers
      body_type: multipart
      parts:
        - name: file
          content_var: =inputs.file
          filename: =inputs.filename
        - name: channels
          content: =inputs.channels
        - name: initial_comment
          content: =inputs.initial_comment
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.upload.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file_info
          value: =steps.upload.response_body.file
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.upload.response_body
