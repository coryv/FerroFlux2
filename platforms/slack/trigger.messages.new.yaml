meta:
  permissions: ["network:api.slack.com"]
  id: slack.trigger.messages.new
  name: New Message in Channel
  category: Messages
  type: Trigger
  platform: slack
  description: Triggers when a new message is posted in a Slack channel.
  version: 1.0.0
  discovery:
    purpose: Monitor a specific Slack channel for new activity.
    usage_context: Use this to react to customer queries, handle alerts, or build interactive commands in a public or private channel. Fires for every message except bot-sent ones by default.
    agent_hints:
      - "The 'message' output contains the full Slack message object, including 'text', 'user', and 'ts' (timestamp)."
      - "By default, this polls the channel every 1 minute. Responses may be delayed based on this interval."
    waml_examples:
      - title: Monitor Support Channel
        waml: |
          trigger:
            id: support_monitor
            call: =slack.trigger.messages.new
            with:
               channel: C98765432

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object

  settings:
    - name: channel
      label: Channel ID
      type: string
      required: true
      placeholder: C1234567890
    - name: poll_interval
      label: Poll Interval (minutes)
      type: number
      default: 1
      min: 1

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/conversations.history?channel=" + settings.channel + "&oldest=" + event.cursor + "&limit=10"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.fetch.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: =steps.fetch.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.fetch.response_body
