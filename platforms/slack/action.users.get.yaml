meta:
  permissions: ["network:api.slack.com"]
  id: slack.action.users.get
  name: Get User Info
  category: Users
  type: Action
  platform: slack
  description: Gets information about a specific user.
  version: 1.0.0
  discovery:
    purpose: Retrieve profile and status details for a Slack user.
    usage_context: Use this to resolve a user ID into a human-readable name, get an email address for cross-platform workflows, or check a user's current status and time zone.
    agent_hints:
      - "The 'user' object includes a 'profile' field where most contact information (like email and real_name) is stored."
      - "Requires a valid user ID (e.g. 'U12345678')."
    waml_examples:
      - title: Get User's Email
        waml: |
          - step: fetch_profile
            call: =slack.action.users.get
            with:
               user_id: U12345678

interface:
  inputs:
    - name: Exec
      type: flow
    - name: user_id
      type: string
      required: true
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: user
      type: object

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        =self.config.base_url + "/users.info"
      headers: =self.config.headers
      query:
        user: =inputs.user_id
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.fetch.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: user
          value: =steps.fetch.response_body.user
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.fetch.response_body
