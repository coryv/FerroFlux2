meta:
  permissions: ["network:api.slack.com"]
  id: slack.trigger.reactions.new
  name: New Reaction Added
  category: Reactions
  type: Trigger
  platform: slack
  description: Triggers when a new reaction (emoji) is added by a specific user.
  version: 1.0.0
  discovery:
    purpose: Monitor Slack reactions added by a specific user.
    usage_context: Use this to track peer-to-peer recognition, internal polling, or to trigger workflows based on a specific user's activity. If 'user_id' is left blank, it monitors global activity (if supported by permissions).
    agent_hints:
      - "This trigger uses the 'reactions.list' endpoint, which is scoped by user."
      - "The payload includes the emoji name and the 'item' (message or file) that was reacted to."
    waml_examples:
      - title: Monitor Admin Reactions
        waml: |
          trigger:
            id: admin_reaction_monitor
            call: slack.trigger.reactions.new
            with:
               user_id: U78901234

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: reaction
      type: object

  settings:
    - name: user_id
      label: User ID (optional — leave blank for all)
      type: string
      required: false
      placeholder: U1234567890
    - name: poll_interval
      label: Poll Interval (minutes)
      type: number
      default: 1
      min: 1

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/reactions.list?user=" + settings.user_id + "&limit=10"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.fetch.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: reaction
          value: =steps.fetch.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.fetch.response_body
