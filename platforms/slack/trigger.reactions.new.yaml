meta:
  permissions: ["network:api.slack.com"]
  id: slack.trigger.reactions.new
  name: New Reaction Added
  category: Reactions
  type: Trigger
  platform: slack
  description: "Polls for new reactions added by a user or in a channel."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: reaction
      type: object

  settings:
    - name: user_id
      label: "User ID (optional — leave blank for all)"
      type: string
      required: false
      placeholder: "U1234567890"
    - name: poll_interval
      label: "Poll Interval (minutes)"
      type: number
      default: 1
      min: 1

execution:
  - id: fetch
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/reactions.list?user=" + settings.user_id + "&limit=10"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.fetch.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: reaction
          value: steps.fetch.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.fetch.response_body
