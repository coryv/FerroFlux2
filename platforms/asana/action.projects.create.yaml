meta:
  permissions: ["network:app.asana.com"]
  id: asana.projects.create
  name: Create Project
  category: Projects
  type: Action
  platform: asana
  description: Creates a new project in an Asana workspace.
  version: 1.0.0
  discovery:
    purpose: Provision a new container for tasks and collaboration.
    usage_context: Use this to create project-specific areas for new clients, monthly marketing campaigns, or team sprints.
    agent_hints:
      - "Requires a 'name' and 'workspace'."
      - "You can specify 'team' and 'notes' as optional parameters."
    waml_examples:
      - title: Create Client Project
        waml: |
          - step: mk_project
            call: asana.action.projects.create
            with:
               name: Acme Web Redesign
               workspace: 123...
               team: 456...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspaceGid
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: project
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/projects"
      headers: =platform.headers
      body:
        data:
          workspace: =inputs.workspaceGid
          name: =inputs.name
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: project
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
