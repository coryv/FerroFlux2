meta:
  permissions: ["network:app.asana.com"]
  id: asana.projects.create
  name: Create Project
  category: Projects
  type: Action
  platform: asana
  description: "Creates a new project."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspaceGid
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: project
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/projects"
      headers: "{{ platform.headers }}"
      body:
        data:
          workspace: "{{ get 'inputs.workspaceGid' }}"
          name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: project
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
