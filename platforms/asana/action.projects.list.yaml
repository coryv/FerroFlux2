meta:
  permissions: ["network:app.asana.com"]
  id: asana.projects.list
  name: List Projects
  category: Projects
  type: Action
  platform: asana
  description: Lists projects in an Asana workspace or team.
  version: 1.0.0
  discovery:
    purpose: Browse and find projects available to the authorized user.
    usage_context: Use this to starting a project-based automation, find a project by name, or audit workspace activity.
    agent_hints:
      - "Can be filtered by 'workspace' or 'team'."
      - "Returns a list of project summaries (GID, name, resource_type)."
    waml_examples:
      - title: List Team Projects
        waml: |
          - step: get_projects
            call: asana.action.projects.list
            with:
               team: 1201...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspaceGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: projects
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >-
        =platform.base_url + "/projects"
      headers: =platform.headers
      query:
        workspace: =inputs.workspaceGid
      strategy: offset
      offset_param: offset
      limit_param: limit
      per_page: 50
      items_path: >
        "/data"
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: projects
          value: =steps.request.all_items
