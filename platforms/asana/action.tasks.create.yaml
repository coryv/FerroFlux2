meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.create
  name: Create Task
  category: Tasks
  type: Action
  platform: asana
  description: "Create a new task in Asana."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspace
      type: string
    - name: name
      type: string
    - name: notes
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/tasks"
      headers: "{{ platform.headers }}"
      body:
        data:
          workspace: "{{ get 'inputs.workspace' }}"
          name: "{{ get 'inputs.name' }}"
          notes: "{{ get 'inputs.notes' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "201"
          output: success
        - condition: default
          output: error

  - id: extract
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/data"
    returns:
      result: task_data

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: "{{ steps.extract.task_data }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
