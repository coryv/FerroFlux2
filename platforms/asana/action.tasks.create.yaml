meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.create
  name: Create Task
  category: Tasks
  type: Action
  platform: asana
  description: Creates a new task in an Asana project or workspace.
  version: 1.0.0
  discovery:
    purpose: Add a new task to your team's work tracking.
    usage_context: Use this to automate task creation from emails, form submissions, or incident reports. Requires a 'name' and 'workspace' or 'projects' GID.
    agent_hints:
      - "Numeric GIDs are required for identifying workspaces and projects."
      - "Note that custom fields are handled via the 'custom_fields' property mapping."
    waml_examples:
      - title: Create Team Task
        waml: |
          - step: mk_task
            call: asana.action.tasks.create
            with:
               name: Fix Production Bug
               workspace: 123...
               projects: ["456..."]
               notes: Reported by monitoring system.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspace
      type: string
    - name: name
      type: string
    - name: notes
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/tasks"
      headers: =platform.headers
      body:
        data:
          workspace: =inputs.workspace
          name: inputs.name
          notes: =inputs.notes
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

  - id: extract
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/data"
    returns:
      result: task_data

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: =steps.extract.task_data
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
