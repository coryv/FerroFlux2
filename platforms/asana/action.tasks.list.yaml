meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.list
  name: List Tasks
  category: Tasks
  type: Action
  platform: asana
  description: Lists tasks in an Asana project, section, or for a specific user.
  version: 1.0.0
  discovery:
    purpose: Browse and find tasks within specific containers or assigned to users.
    usage_context: Use this to fetch all tasks in a 'Backlog' section, find a user's assigned work, or starting a bulk task update.
    agent_hints:
      - "Can be filtered by 'project', 'section', 'assignee', or 'workspace'."
      - "Returns a list of task summaries (GID, name, resource_type)."
    waml_examples:
      - title: List Project Tasks
        waml: |
          - step: get_todo
            call: asana.action.tasks.list
            with:
               project: 1201...
               completed_since: now

interface:
  inputs:
    - name: Exec
      type: flow
    - name: projectGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: tasks
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >-
        =platform.base_url + "/tasks"
      headers: =platform.headers
      query:
        project: =inputs.projectGid
        opt_fields: >
          "name,notes,completed"
      strategy: offset
      offset_param: offset
      limit_param: limit
      per_page: 50
      items_path: >
        "/data"
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: tasks
          value: =steps.request.all_items
