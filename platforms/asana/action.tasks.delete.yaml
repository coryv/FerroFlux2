meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.delete
  name: Delete Task
  category: Tasks
  type: Action
  platform: asana
  description: Permanently deletes a task from Asana.
  version: 1.0.0
  discovery:
    purpose: Remove a task from the workspace.
    usage_context: Use this to clean up temporary or redundant tasks after they are no longer needed. Use with caution as this is irreversible.
    agent_hints:
      - "Requires the 'task_gid'."
    waml_examples:
      - title: Cleanup Task
        waml: |
          - step: rm_task
            call: asana.action.tasks.delete
            with:
               task_gid: 1202...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/tasks/" + inputs.taskGid
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
