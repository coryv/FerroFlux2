meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.delete
  name: Delete Task
  category: Tasks
  type: Action
  platform: asana
  description: "Deletes a task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: "{{ platform.base_url }}/tasks/{{ get 'inputs.taskGid' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
