meta:
  id: asana.tasks.move
  name: Move Task to Section
  category: Tasks
  type: Action
  platform: asana
  description: "Moves a task to a different section."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sectionGid
      type: string
    - name: taskGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/sections/{{ get 'inputs.sectionGid' }}/addTask"
      headers: "{{ platform.headers }}"
      body:
        data:
          task: "{{ get 'inputs.taskGid' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
