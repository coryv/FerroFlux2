meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.move
  name: Move Task to Section
  category: Tasks
  type: Action
  platform: asana
  description: Moves an Asana task to a different section or project.
  version: 1.0.0
  discovery:
    purpose: Organize tasks within a project or move them to a different workflow container.
    usage_context: Use this to move tasks from 'In Progress' to 'Review' or to transition a task from a 'Marketing' project to a 'Legal' project.
    agent_hints:
      - "Requires the 'task_gid' to move."
      - "You must specify 'project' and optionally 'section'."
    waml_examples:
      - title: Move to Done Section
        waml: |
          - step: move_it
            call: asana.action.tasks.move
            with:
               task_gid: 1202...
               project: 1201...
               section: 1206...
               insert_after: 1207...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sectionGid
      type: string
    - name: taskGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sections/" + inputs.sectionGid + "/addTask"
      headers: =platform.headers
      body:
        data:
          task: =inputs.taskGid
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
