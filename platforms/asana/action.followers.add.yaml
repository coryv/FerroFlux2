meta:
  permissions: ["network:app.asana.com"]
  id: asana.followers.add
  name: Add Follower
  category: Tasks
  type: Action
  platform: asana
  description: Adds followers to an Asana task.
  version: 1.0.0
  discovery:
    purpose: Subscribe users to updates and notifications for a specific task.
    usage_context: Use this to ensure that relevant team members are looped in on a task's progress, even if they aren't the primary assignee.
    agent_hints:
      - "Requires the 'task_gid'."
      - "Followers receive notifications for comments, status changes, and completion."
    waml_examples:
      - title: Loop in Stakeholders
        waml: |
          - step: add_subscribers
            call: asana.action.followers.add
            with:
               task_gid: 1202...
               followers: ["1205...", "1208..."]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
    - name: followers
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/tasks/" + inputs.taskGid + "/addFollowers"
      headers: =platform.headers
      body:
        data:
          followers: =inputs.followers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
