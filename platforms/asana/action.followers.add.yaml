meta:
  id: asana.followers.add
  name: Add Follower
  category: Tasks
  type: Action
  platform: asana
  description: "Adds a follower to a task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
    - name: followers
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/tasks/{{ get 'inputs.taskGid' }}/addFollowers"
      headers: "{{ platform.headers }}"
      body:
        data:
          followers: "{{ get 'inputs.followers' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
