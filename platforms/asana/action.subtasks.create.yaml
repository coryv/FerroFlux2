meta:
  permissions: ["network:app.asana.com"]
  id: asana.subtasks.create
  name: Create Subtask
  category: Tasks
  type: Action
  platform: asana
  description: Creates a new subtask for an existing Asana task.
  version: 1.0.0
  discovery:
    purpose: Break down a larger task into smaller, manageable work items.
    usage_context: Use this to create checklists, individual trackable items for a milestone, or to add specific steps to a template task.
    agent_hints:
      - "Requires the 'task_gid' of the parent task."
      - "Subtasks do not automatically inherit the parent's project or assignee."
    waml_examples:
      - title: Add Subtask Step
        waml: |
          - step: mk_subtask
            call: asana.action.subtasks.create
            with:
               task_gid: 1202...
               name: Review QA results
               notes: "Specific criteria: Code style, unit tests, and performance."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
    - name: name
      type: string
    - name: notes
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/tasks/" + inputs.taskGid + "/subtasks"
      headers: =platform.headers
      body:
        data:
          name: =inputs.name
          notes: =inputs.notes
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
