meta:
  permissions: ["network:app.asana.com"]
  id: asana.subtasks.create
  name: Create Subtask
  category: Tasks
  type: Action
  platform: asana
  description: "Creates a subtask on a task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
    - name: name
      type: string
    - name: notes
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/tasks/{{ get 'inputs.taskGid' }}/subtasks"
      headers: "{{ platform.headers }}"
      body:
        data:
          name: "{{ get 'inputs.name' }}"
          notes: "{{ get 'inputs.notes' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
