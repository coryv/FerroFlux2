meta:
  permissions: ["network:app.asana.com"]
  id: asana.comments.create
  name: Add Comment
  category: Comments
  type: Action
  platform: asana
  description: Adds a comment (story) to an Asana task.
  version: 1.0.0
  discovery:
    purpose: Communicate updates and provide context on a task.
    usage_context: Use this to log progress, notify team members of results, or record completion details within the task's history.
    agent_hints:
      - "Requires the 'task_gid'."
      - "Supports 'text' or 'html_text' for formatting. Use 'html_text' for mentions and links."
    waml_examples:
      - title: Post Status Update
        waml: |
          - step: say_it
            call: asana.action.comments.create
            with:
               task_gid: 1202...
               text: Processing complete. Please check the results.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: comment
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/tasks/" + inputs.taskGid + "/stories"
      headers: =platform.headers
      body:
        data:
          text: =inputs.text
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: comment
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
