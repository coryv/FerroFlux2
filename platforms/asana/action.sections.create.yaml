meta:
  id: asana.sections.create
  name: Create Section
  category: Sections
  type: Action
  platform: asana
  description: "Creates a new section in a project."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: projectGid
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: section
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/projects/{{ get 'inputs.projectGid' }}/sections"
      headers: "{{ platform.headers }}"
      body:
        data:
          name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: section
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
