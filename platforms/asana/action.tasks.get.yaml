meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.get
  name: Get Task
  category: Tasks
  type: Action
  platform: asana
  description: Retrieves detailed information about an Asana task.
  version: 1.0.0
  discovery:
    purpose: Fetch the properties of a specific Asana task.
    usage_context: Use this when you have a Task GID and need to find its current status, assignee, or custom field values.
    agent_hints:
      - "Requires the 'task_gid'."
      - "Returns the full task resource object (GID, name, projects, etc.)."
    waml_examples:
      - title: Get Task Details
        waml: |
          - step: read_task
            call: asana.action.tasks.get
            with:
               task_gid: 1202...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/tasks/" + inputs.task_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/data"
    returns:
      result: task_data

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: =steps.extract.task_data
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
