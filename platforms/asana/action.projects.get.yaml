meta:
  permissions: ["network:app.asana.com"]
  id: asana.projects.get
  name: Get Project
  category: Projects
  type: Action
  platform: asana
  description: "Gets a project."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: projectGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: project
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/projects/{{ get 'inputs.projectGid' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: project
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
