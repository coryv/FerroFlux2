meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.complete
  name: Complete Task
  category: Tasks
  type: Action
  platform: asana
  description: Marks an Asana task as completed.
  version: 1.0.0
  discovery:
    purpose: Change a task's status to 'Completed' in the project tracking.
    usage_context: Use this to close out work items after a workflow successfully finishes a process, such as sending an invoice or processing a file.
    agent_hints:
      - "Requires the 'task_gid'."
      - "Note that completing a task may trigger other automated workflows in Asana."
    waml_examples:
      - title: Close Task
        waml: |
          - step: finish_task
            call: asana.action.tasks.complete
            with:
               task_gid: 1202...
               completed: true

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/tasks/" + inputs.taskGid
      headers: =platform.headers
      body:
        data:
          completed: true
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
