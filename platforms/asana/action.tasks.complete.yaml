meta:
  permissions: ["network:app.asana.com"]
  id: asana.tasks.complete
  name: Complete Task
  category: Tasks
  type: Action
  platform: asana
  description: "Marks a task as completed."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: taskGid
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/tasks/{{ get 'inputs.taskGid' }}"
      headers: "{{ platform.headers }}"
      body:
        data:
          completed: true
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
