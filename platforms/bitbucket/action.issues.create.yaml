meta:
  id: bitbucket.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: bitbucket
  description: "Creates a new issue in a repository."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspace
      type: string
    - name: repo_slug
      type: string
    - name: title
      type: string
    - name: content
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/repositories/{{ get 'inputs.workspace' }}/{{ get 'inputs.repo_slug' }}/issues"
      headers: "{{ platform.headers }}"
      body:
        title: "{{ get 'inputs.title' }}"
        content: 
          raw: "{{ get 'inputs.content' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
