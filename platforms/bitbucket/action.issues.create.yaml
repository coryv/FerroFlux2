meta:
  permissions: ["network:api.bitbucket.org"]
  id: bitbucket.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: bitbucket
  description: Creates a new issue in a Bitbucket repository.
  version: 1.0.0
  discovery:
    purpose: Log a bug, feature request, or task directly into a repository's issue tracker.
    usage_context: Use this to automate bug reporting from Atlassian pipelines, customer support tickets (Jira), or development task management. Requires 'workspace', 'repo_slug', and 'title'.
    agent_hints:
      - "Requires the 'workspace' (ID or slug) and 'repo_slug' string."
      - "Supports markdown in the 'content'."
    waml_examples:
      - title: Create Bug Issue
        waml: |
          - step: log_bug
            call: bitbucket.action.issues.create
            with:
               workspace: atlassian
               repo_slug: hello-world
               title: Broken link in footer
               content: Found by the link checker.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: workspace
      type: string
    - name: repo_slug
      type: string
    - name: title
      type: string
    - name: content
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/repositories/" + inputs.workspace + "/" + inputs.repo_slug + "/issues"
      headers: =platform.headers
      body:
        title: =inputs.title
        content: >
          ""
          raw: =inputs.content
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
