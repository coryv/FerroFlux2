meta:
  permissions: ["network:*.amazonaws.com"]
  id: aws.action.lambda.invoke
  name: Invoke Lambda
  category: Cloud
  type: Action
  platform: aws
  description: "Invoke an AWS Lambda function."
  version: "1.0.0"
  discovery:
    purpose: "Trigger the execution of an AWS Lambda function with a custom JSON payload."
    usage_context: "Use to run serverless compute jobs, process data with custom Python/Node.js logic, or trigger legacy AWS workflows from a FerroFlux pipeline."
    agent_hints:
      - "Requires function_name and payload (JSON)."
      - "Supports RequestResponse (synchronous) or Event (asynchronous) invocation types."
    waml_examples:
      - title: "Invoke Function"
        waml: |
          - step: run_worker
            call: aws.action.lambda.invoke
            with:
               function_name: "data-processor-prod"
               payload: { "id": "123", "action": "re-index" }
               invocation_type: "RequestResponse"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: function_name
      type: string
    - name: payload
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: any

  settings:
    - name: connection
      label: AWS Connection
      type: connection_select
      required: true
    - name: region
      label: Region
      type: string
      default: "us-east-1"
    - name: function_name
      label: Function Name
      type: string

execution:
  - id: request
    tool: http_client
    params:
      url: >
        "https://lambda." + settings.region + ".amazonaws.com/2015-03-31/functions/" + (has(settings.function_name) ? settings.function_name : 'inputs.function_name') + "/invocations"
      method: POST
      connection: settings.connection
      aws_service: lambda
      aws_region: settings.region
      body: inputs.payload
    returns:
      body: response_body
      status: response_status

  - id: check_status
    tool: logic
    params:
      data: steps.request.response_status
      rules:
        - condition: >
          "val < 400"
          output: Success
        - condition: default
          output: Error

  - id: emit_data
    tool: emit
    params:
      port: response
      value: steps.request.response_body

  - id: emit_signal
    tool: emit
    params:
      port: steps.check_status.match
