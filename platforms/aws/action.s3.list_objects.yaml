meta:
  permissions: ["network:*.amazonaws.com"]
  id: aws.action.s3.list_objects
  name: List S3 Objects
  category: Cloud
  type: Action
  platform: aws
  description: "List objects in an AWS S3 bucket."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve a list of object keys and metadata from an S3 bucket."
    usage_context: "Use to audit cloud storage, find new files for processing, or generate public URLs for recently uploaded assets."
    agent_hints:
      - "Requires a bucket_name."
      - "Returns an array of object summaries (key, size, lastModified)."
    waml_examples:
      - title: "List Bucket"
        waml: |
          - step: get_files
            call: aws.action.s3.list_objects
            with:
               bucket_name: "my-production-bucket"
               prefix: "uploads/2023/"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: objects
      type: array

  settings:
    - name: connection
      label: AWS Connection
      type: connection_select
      required: true
    - name: region
      label: Region
      type: string
      default: "us-east-1"
    - name: bucket
      label: Bucket Name
      type: string

execution:
  - id: request
    tool: http_client
    params:
      url: >
        "https://" + (has(settings.bucket) ? settings.bucket : 'inputs.bucket') + ".s3." + settings.region + ".amazonaws.com/"
      method: GET
      connection: settings.connection
      aws_service: s3
      aws_region: settings.region
    returns:
      body: response_body
      status: response_status

  - id: check_status
    tool: logic
    params:
      data: steps.request.response_status
      rules:
        - condition: "val < 400"
          output: Success
        - condition: default
          output: Error

  - id: emit_data
    tool: emit
    params:
      port: objects
      value: steps.request.response_body

  - id: emit_signal
    tool: emit
    params:
      port: steps.check_status.match
