meta:
  permissions: ["network:*.amazonaws.com"]

name: "aws"
icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/amazonaws.svg"
base_url: "https://{{ service }}.{{ region }}.amazonaws.com"
auth_type: "aws_sigv4"
connection_schema:
  - name: "access_key"
    type: "string"
    required: true
  - name: "secret_key"
    type: "string"
    required: true
    is_secret: true
  - name: "region"
    type: "string"
    required: true
    default: "us-east-1"

# Note: The 'service' parameter is dynamically provided by the node definition.
