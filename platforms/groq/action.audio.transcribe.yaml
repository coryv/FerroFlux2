meta:
  id: groq.audio.transcribe
  name: Transcribe Audio
  category: Audio
  type: Action
  platform: groq
  description: Transcribes an audio file into text using Groq's fast inference.
  version: 1.0.0
  discovery:
    purpose: Convert voice recordings, meetings, or voice commands into structured text with high speed.
    usage_context: Use this for real-time transcription, accessibility tools, or converting voice memos into tasks.
    agent_hints:
      - "Requires a supported audio file format and size limits."
      - "Specify the 'model' (e.g. 'whisper-large-v3')."
    waml_examples:
      - title: Transcribe Voice Memo
        waml: |
          - step: transcribe
            call: groq.action.audio.transcribe
            with:
               model: whisper-large-v3
               file: "https://example.com/memo.wav"
  permissions:
    - "network:api.groq.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: audio
      type: blob
    - name: model
      type: string
      default: whisper-large-v3
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: text
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/audio/transcriptions"
      headers: =platform.headers
      body_type: multipart
      parts:
        - name: file
          content_var: =inputs.audio
          filename: audio.mp3
          content_type: >
            "application/octet-stream"
        - name: model
          content: =inputs.model
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: text
          value: =steps.request.response_body.text
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
