meta:
  id: groq.audio.transcribe
  name: Transcribe Audio
  category: Audio
  type: Action
  platform: groq
  description: "Transcribe audio files into text using Whisper."
  version: "1.0.0"
  permissions:
    - "network:api.groq.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: audio
      type: blob
    - name: model
      type: string
      default: "whisper-large-v3"
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: text
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/audio/transcriptions"
      headers: platform.headers
      body_type: multipart
      parts:
        - name: file
          content_var: inputs.audio
          filename: audio.mp3
          content_type: >
            "application/octet-stream"
        - name: model
          content: inputs.model
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: text
          value: steps.request.response_body.text
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
