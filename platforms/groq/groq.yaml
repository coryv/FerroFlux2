meta:
  id: groq
  name: Groq
  type: Platform
  category: AI/ML
  description: "Connects to the Groq Cloud API for high-speed inference."
  version: "1.0.0"
  permissions:
    - "network:api.groq.com"

config:
  base_url: "https://api.groq.com/openai/v1"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_API_KEY_HERE"

settings:
  - name: api_key
    label: "API Key"
    type: string
    required: true
