meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.updated
  name: Task Updated
  category: Tasks
  type: Trigger
  platform: clickup
  description: Triggers when any property of a ClickUp task is modified.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a task's name, description, priority, or other fields change.
    usage_context: Use this for maintaining real-time data syncs between ClickUp and other tools, or for triggering notifications when important task details are updated.
    agent_hints:
      - "Polls for modifications across the specified list based on the 'date_updated' timestamp."
      - "Requires the numeric 'list_id'."
    waml_examples:
      - title: Sync Task Changes
        waml: |
          trigger:
            task_changed:
               call: clickup.trigger.tasks.updated
               with:
                  list_id: 12345678

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: task
      type: object
  settings:
    - name: list_id
      label: List ID
      type: string
      required: true

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/list/" + settings.list_id + "/task"
      headers: =platform.headers
      query:
        order_by: updated
        reverse: true
    returns:
      status: status_code
      body: response_body

  - id: extract_tasks
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/tasks"
    returns:
      tasks: tasks_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_tasks.tasks_array
          cursor_key: date_updated
          port: task
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
