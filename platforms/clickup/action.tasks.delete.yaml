meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.delete
  name: Delete Task
  category: Tasks
  type: Action
  platform: clickup
  description: "Delete a specified task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: "{{ platform.base_url }}/task/{{ get 'inputs.task_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
