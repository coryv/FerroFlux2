meta:
  permissions: ["network:api.clickup.com"]
  id: clickup
  name: ClickUp
  type: Platform
  category: Project Management
  description: Manage tasks, lists, and folders on ClickUp using the REST API.
  version: 1.0.0
  discovery:
    purpose: Highly customizable project management and productivity tool.
    usage_context: Use ClickUp for advanced task management that requires custom statuses, nested folders, and detailed time tracking. Best for complex team workflows.
    agent_hints:
      - "Uses Team/ID, Space/ID, and List/ID for hierarchy."
      - "Numeric IDs are common for tasks and lists."

config:
  base_url: "https://api.clickup.com/api/v2"
  auth: oauth2
  headers:
    Authorization: auth.access_token
    Content-Type: application/json

settings:
  - name: api_token
    label: Personal API Token (Optional fallback)
    type: password
    required: false
