meta:
  id: clickup.tasks.get
  name: Get Task
  category: Tasks
  type: Action
  platform: clickup
  description: "Retrieve details for a specific task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/task/{{ get 'inputs.task_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
