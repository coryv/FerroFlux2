meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.get
  name: Get Task
  category: Tasks
  type: Action
  platform: clickup
  description: Retrieves detailed information about a ClickUp task.
  version: 1.0.0
  discovery:
    purpose: Fetch the properties, status, and custom field values of a specific ClickUp task.
    usage_context: Use this when you have a Task ID and need to check its priority, current status, or identify its assignees before performing an update.
    agent_hints:
      - "Requires the Task ID (e.g. '862...') as a string."
      - "Returns the full task object with all its properties."
    waml_examples:
      - title: Get Task Details
        waml: |
          - step: read_task
            call: clickup.action.tasks.get
            with:
               task_id: 862k6r9n8

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: task
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/task/" + inputs.task_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: task
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
