meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.lists.get
  name: Get Lists
  category: Lists
  type: Action
  platform: clickup
  description: Retrieves detailed information about a ClickUp list.
  version: 1.0.0
  discovery:
    purpose: Fetch the properties and metadata of a specific ClickUp list.
    usage_context: Use this when you have a List ID and need to find its name, status, or parent container details.
    agent_hints:
      - "Requires the numeric 'list_id'."
    waml_examples:
      - title: Get List Details
        waml: |
          - step: read_list
            call: clickup.action.lists.get
            with:
               list_id: 12345678

interface:
  inputs:
    - name: Exec
      type: flow
    - name: folder_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: lists
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/folder/" + inputs.folder_id + "/list"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: lists
          value: =steps.request.response_body.lists
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
