meta:
  id: clickup.lists.get
  name: Get Lists
  category: Lists
  type: Action
  platform: clickup
  description: "Retrieve all lists within a specific Folder."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: folder_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: lists
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/folder/{{ get 'inputs.folder_id' }}/list"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: lists
          value: "{{ steps.request.response_body.lists }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
