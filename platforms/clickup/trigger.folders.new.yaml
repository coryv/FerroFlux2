meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.folders.new
  name: New Folder
  category: Folders
  type: Trigger
  platform: clickup
  description: "Polls for new folders within a specific Space."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: folder
      type: object
  settings:
    - name: space_id
      label: "Space ID"
      type: string
      required: true

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/space/" + settings.space_id + "/folder"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: extract_folders
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/folders"
    returns:
      folders: folders_array

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: steps.extract_folders.folders_array
          cursor_key: id
          port: folder
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
