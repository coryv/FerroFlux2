meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.folders.get
  name: Get Folders
  category: Folders
  type: Action
  platform: clickup
  description: Retrieves detailed information about a ClickUp folder.
  version: 1.0.0
  discovery:
    purpose: Fetch the properties and lists within a specific ClickUp folder.
    usage_context: Use this when you have a Folder ID and need to find its name, status, or the lists it contains.
    agent_hints:
      - "Requires the numeric 'folder_id'."
    waml_examples:
      - title: Get Folder Details
        waml: |
          - step: read_folder
            call: clickup.action.folders.get
            with:
               folder_id: 123456

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: folders
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/space/" + inputs.space_id + "/folder"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: folders
          value: =steps.request.response_body.folders
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
