meta:
  id: clickup.folders.get
  name: Get Folders
  category: Folders
  type: Action
  platform: clickup
  description: "Retrieve all folders within a specific Space."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: folders
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/space/{{ get 'inputs.space_id' }}/folder"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: folders
          value: "{{ steps.request.response_body.folders }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
