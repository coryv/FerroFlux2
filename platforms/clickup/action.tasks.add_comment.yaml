meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.add_comment
  name: Add Comment
  category: Tasks
  type: Action
  platform: clickup
  description: Adds a comment to a ClickUp task.
  version: 1.0.0
  discovery:
    purpose: Communicate updates and provide context on a task.
    usage_context: Use this to log progress, notify team members of results, or record completion details within the task's history.
    agent_hints:
      - "Requires the Task ID."
      - "Supports plain text for the 'comment_text'."
    waml_examples:
      - title: Post Status Update
        waml: |
          - step: say_it
            call: clickup.action.tasks.add_comment
            with:
               task_id: 862...
               comment_text: Processing complete. Please check the results.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
    - name: comment_text
      type: string
    - name: notify_all
      type: boolean
      default: true
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/task/" + inputs.task_id + "/comment"
      headers: =platform.headers
      body:
        comment_text: =inputs.comment_text
        notify_all: >
          (has(inputs.notify_all) ? inputs.notify_all : 'true')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
