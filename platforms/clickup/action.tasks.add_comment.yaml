meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.add_comment
  name: Add Comment
  category: Tasks
  type: Action
  platform: clickup
  description: "Add a comment to a specified task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
    - name: comment_text
      type: string
    - name: notify_all
      type: boolean
      default: true
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/task/{{ get 'inputs.task_id' }}/comment"
      headers: "{{ platform.headers }}"
      body:
        comment_text: "{{ get 'inputs.comment_text' }}"
        notify_all: "{{ get 'inputs.notify_all' 'true' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
