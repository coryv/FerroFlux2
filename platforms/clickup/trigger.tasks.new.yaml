meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.new
  name: New Task
  category: Tasks
  type: Trigger
  platform: clickup
  description: Triggers when a new task is created in a ClickUp list.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a new work item appears in ClickUp.
    usage_context: Use this to notify team members on Slack, sync new tasks to an external tool, or trigger automated task assignment.
    agent_hints:
      - "Polls the list for new tasks based on the 'date_created'."
      - "Requires the numeric 'list_id'."
    waml_examples:
      - title: Sync New Tasks
        waml: |
          trigger:
            new_task:
               call: clickup.trigger.tasks.new
               with:
                  list_id: 12345678

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: task
      type: object
  settings:
    - name: list_id
      label: List ID
      type: string
      required: true

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/list/" + settings.list_id + "/task"
      headers: =platform.headers
      query:
        order_by: created
        reverse: true
    returns:
      status: status_code
      body: response_body

  - id: extract_tasks
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/tasks"
    returns:
      tasks: tasks_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_tasks.tasks_array
          cursor_key: id
          port: task
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
