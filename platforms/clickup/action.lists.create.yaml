meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.lists.create
  name: Create List
  category: Lists
  type: Action
  platform: clickup
  description: "Create a new list within a specific Folder (or Space for folderless lists)."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: folder_id
      type: string
    - name: name
      type: string
    - name: content
      type: string
    - name: status
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: list
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/folder/{{ get 'inputs.folder_id' }}/list"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
        content: "{{ get 'inputs.content' }}"
        status: "{{ get 'inputs.status' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: list
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
