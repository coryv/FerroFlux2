meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.lists.create
  name: Create List
  category: Lists
  type: Action
  platform: clickup
  description: Creates a new list within a ClickUp folder or space.
  version: 1.0.0
  discovery:
    purpose: Create a container for tasks within a specific project area.
    usage_context: Use this to automate list creation for new project phases, sprints, or client onboarding checklists.
    agent_hints:
      - "Requires the numeric 'folder_id' or 'space_id' and 'name'."
    waml_examples:
      - title: Create Task List
        waml: |
          - step: mk_list
            call: clickup.action.lists.create
            with:
               folder_id: 123456
               name: Bug Tracking

interface:
  inputs:
    - name: Exec
      type: flow
    - name: folder_id
      type: string
    - name: name
      type: string
    - name: content
      type: string
    - name: status
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: list
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/folder/" + inputs.folder_id + "/list"
      headers: =platform.headers
      body:
        name: inputs.name
        content: =inputs.content
        status: =inputs.status
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: list
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
