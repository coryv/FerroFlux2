meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.status_updated
  name: Task Status Updated
  category: Tasks
  type: Trigger
  platform: clickup
  description: Triggers when a ClickUp task's status is changed.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a task moves to a new stage (e.g. from 'To Do' to 'Complete').
    usage_context: Use this to notify stakeholders of project progress, trigger follow-up actions when a task is finished, or sync status changes to an external CRM.
    agent_hints:
      - "Polls for status modifications across the specified list."
      - "Requires the numeric 'list_id'."
    waml_examples:
      - title: Notify on Completion
        waml: |
          trigger:
            task_done:
               call: clickup.trigger.tasks.status_updated
               with:
                  list_id: 12345678

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: task
      type: object
  settings:
    - name: list_id
      label: List ID
      type: string
      required: true

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/list/" + settings.list_id + "/task"
      headers: =platform.headers
      query:
        order_by: updated
        reverse: true
    returns:
      status: status_code
      body: response_body

  - id: extract_tasks
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/tasks"
    returns:
      tasks: tasks_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_tasks.tasks_array
          cursor_key: date_updated
          port: task
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
