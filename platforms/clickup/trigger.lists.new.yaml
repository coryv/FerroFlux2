meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.lists.new
  name: New List
  category: Lists
  type: Trigger
  platform: clickup
  description: Triggers when a new list is created in a ClickUp folder or space.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a new task container (list) is added.
    usage_context: Use this to automate list-level setup (like adding default tasks), notify team members of new sprints, or sync list metadata to a master project tracker.
    agent_hints:
      - "Polls the folder or space for new lists based on the 'date_created'."
      - "Requires the numeric 'folder_id' or 'space_id'."
    waml_examples:
      - title: Setup New List
        waml: |
          trigger:
            new_list:
               call: clickup.trigger.lists.new
               with:
                  folder_id: 123456

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: list
      type: object
  settings:
    - name: folder_id
      label: Folder ID
      type: string
      required: true

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/folder/" + settings.folder_id + "/list"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: extract_lists
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/lists"
    returns:
      lists: lists_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_lists.lists_array
          cursor_key: id
          port: list
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
