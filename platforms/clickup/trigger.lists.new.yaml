meta:
  id: clickup.lists.new
  name: New List
  category: Lists
  type: Trigger
  platform: clickup
  description: "Polls for new lists within a specific Folder."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: list
      type: object
  settings:
    - name: folder_id
      label: "Folder ID"
      type: string
      required: true

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/folder/{{ get 'settings.folder_id' }}/list"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: extract_lists
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/lists"
    returns:
      lists: lists_array

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: iterate
        params:
          items: "{{ steps.extract_lists.lists_array }}"
          cursor_key: "id"
          port: list
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
