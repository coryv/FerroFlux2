meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.list
  name: List Tasks
  category: Tasks
  type: Action
  platform: clickup
  description: "Lists tasks within a specific ClickUp list."
  version: "1.0.0"
  discovery:
    purpose: "Browse and find tasks belonging to a specific list."
    usage_context: "Use this to fetch all tasks in a 'Backlog' list, sync list items to a spreadsheet, or audit task statuses."
    agent_hints:
      - "Requires the numeric 'list_id'."
      - "Returns a list of task summaries (ID, name, status, etc.)."
    waml_examples:
      - title: "List List Tasks"
        waml: |
          - step: get_todo
            call: clickup.action.tasks.list
            with:
               list_id: "12345678"
               archived: false

interface:
  inputs:
    - name: Exec
      type: flow
    - name: list_id
      type: string
    - name: archived
      type: boolean
      default: false
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: tasks
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/list/" + inputs.list_id + "/task"
      headers: platform.headers
      query:
        archived: >
          (has(inputs.archived) ? inputs.archived : 'false')
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: tasks
          value: steps.request.response_body.tasks
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
