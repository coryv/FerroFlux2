meta:
  id: clickup.folders.create
  name: Create Folder
  category: Folders
  type: Action
  platform: clickup
  description: "Create a new folder within a specific Space."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: folder
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/space/{{ get 'inputs.space_id' }}/folder"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: folder
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
