meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.folders.create
  name: Create Folder
  category: Folders
  type: Action
  platform: clickup
  description: "Creates a new folder within a ClickUp space."
  version: "1.0.0"
  discovery:
    purpose: "Organize lists and tasks into a logical container within a space."
    usage_context: "Use this to programmatically structure new projects, create client-specific areas, or group related work items."
    agent_hints:
      - "Requires the numeric 'space_id' and 'name'."
    waml_examples:
      - title: "Create Project Folder"
        waml: |
          - step: mk_folder
            call: clickup.action.folders.create
            with:
               space_id: "123456"
               name: "Q2 Marketing Campaign"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: folder
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/space/" + inputs.space_id + "/folder"
      headers: platform.headers
      body:
        name: inputs.name
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: folder
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
