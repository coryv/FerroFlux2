meta:
  id: clickup.tasks.update
  name: Update Task
  category: Tasks
  type: Action
  platform: clickup
  description: "Update an existing task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
    - name: name
      type: string
    - name: description
      type: string
    - name: status
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/task/{{ get 'inputs.task_id' }}"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
        description: "{{ get 'inputs.description' }}"
        status: "{{ get 'inputs.status' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
