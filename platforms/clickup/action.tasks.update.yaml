meta:
  permissions: ["network:api.clickup.com"]
  id: clickup.tasks.update
  name: Update Task
  category: Tasks
  type: Action
  platform: clickup
  description: Updates an existing ClickUp task by its ID.
  version: 1.0.0
  discovery:
    purpose: Modify fields on a ClickUp task, such as its name, description, status, or priority.
    usage_context: Use this to change a task's status as it moves through a pipeline, re-assign it to a team member, or mark it as complete.
    agent_hints:
      - "Requires the Task ID."
      - "The body parameters only contain the fields you wish to change (partial update)."
    waml_examples:
      - title: Move to Review
        waml: |
          - step: review_it
            call: clickup.action.tasks.update
            with:
               task_id: 862...
               status: review

interface:
  inputs:
    - name: Exec
      type: flow
    - name: task_id
      type: string
    - name: name
      type: string
    - name: description
      type: string
    - name: status
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/task/" + inputs.task_id
      headers: =platform.headers
      body:
        name: =inputs.name
        description: =inputs.description
        status: =inputs.status
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
