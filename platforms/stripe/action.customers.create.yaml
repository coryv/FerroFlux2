meta:
  permissions: ["network:api.stripe.com"]
  id: stripe.customers.create
  name: Create Customer
  category: Customers
  type: Action
  platform: stripe
  description: Creates a new customer.
  version: 1.0.0
  discovery:
    purpose: Create a new customer profile in Stripe.
    usage_context: Use to store billing details and personal information for users before processing charges or subscriptions.
    agent_hints:
      - "Requires email and name."
      - "Returns a Stripe customer object."
    waml_examples:
      - title: Register Customer
        waml: |
          - step: register
            call: stripe.action.customers.create
            with:
               email: john.doe@example.com
               name: John Doe
               description: New user from FerroFlux
               phone: +15550000000
               balance: 0

interface:
  inputs:
    - name: Exec
      type: flow
    - name: email
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: customer
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/customers"
      headers: =platform.headers
      body_type: form
      body:
        email: =inputs.email
        name: inputs.name
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: customer
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
