meta:
  permissions: ["network:api.stripe.com"]
  id: stripe.charges.create
  name: Create Charge
  category: Charges
  type: Action
  platform: stripe
  description: Creates a new charge object.
  version: 1.0.0
  discovery:
    purpose: Create a one-time charge for a customer or a specific payment source.
    usage_context: Use to process payments for single items, services, or manual invoices.
    agent_hints:
      - "Requires amount (in smallest currency unit, e.g., cents) and currency."
    waml_examples:
      - title: Charge Customer
        waml: |
          - step: charge
            call: stripe.action.charges.create
            with:
               amount: 2000
               currency: usd
               customer: cus_12345
               description: Service Fee

interface:
  inputs:
    - name: Exec
      type: flow
    - name: amount
      type: string
    - name: currency
      type: string
    - name: source
      type: string
    - name: customer
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: charge
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/charges"
      headers: =platform.headers
      body_type: form
      body:
        amount: =inputs.amount
        currency: =inputs.currency
        source: =inputs.source
        customer: =inputs.customer
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: charge
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
