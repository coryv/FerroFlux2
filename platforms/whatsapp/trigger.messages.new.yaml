meta:
  permissions: ["network:graph.facebook.com"]
  id: whatsapp.messages.new
  name: New Incoming Message
  category: Messages
  type: Trigger
  platform: whatsapp
  description: "Fires when a new message is received via WhatsApp Webhook."
  version: "1.0.0"
  discovery:
    purpose: "Initialize a workflow whenever a new message is received in the WhatsApp Business account."
    usage_context: "Use to build WhatsApp chatbots, automate customer support triage, or respond to order status inquiries in real-time."
    agent_hints:
      - "Requires a verified webhook configuration for the WhatsApp Business Platform."
    waml_examples:
      - title: "Chatbot Trigger"
        waml: |
          - step: on_whatsapp_message
            type: trigger
            call: whatsapp.trigger.messages.new

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
  settings:
    - name: webhook_verify_token
      label: "Webhook Verify Token"
      type: string
      required: true
      description: "The token you set in the Meta App Dashboard to verify your webhook."

execution:
  # This trigger assumes the workflow is triggered by an inbound webhook.
  # The 'event' object contains the webhook payload.
  # Meta WhatsApp webhooks follow a nested structure: entry[0].changes[0].value.messages[0]
  - id: extract_message
    tool: json_query
    params:
      json: event.body
      path: >
        "/entry/0/changes/0/value/messages/0"
    returns:
      result: message_data

routing:
  match: >
    steps.extract_message.result != null
  cases:
    "true":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: steps.extract_message.result
    "false": >
      "[]"
