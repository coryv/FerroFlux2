meta:
  id: whatsapp.messages.send_image
  name: Send Image
  category: WhatsApp
  type: Action
  platform: whatsapp
  description: "Send an image to a user via URL."
  version: "1.0.0"
  permissions:
    - "network:graph.facebook.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: to
      type: string
    - name: image_url
      type: string
    - name: caption
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message_id
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/" + settings.phone_number_id + "/messages"
      headers: platform.headers
      body:
        messaging_product: whatsapp
        to: inputs.to
        type: image
        image: >
          "{ \"link\": \"" + inputs.image_url + "\", \"caption\": \"" + inputs.caption + "\" }"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_id
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/messages/0/id"
    returns:
      result: mid

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message_id
          value: steps.extract_id.mid
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
