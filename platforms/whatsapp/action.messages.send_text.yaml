meta:
  id: whatsapp.messages.send_text
  name: Send Text Message
  category: WhatsApp
  type: Action
  platform: whatsapp
  description: Sends a direct text message to a user on WhatsApp.
  version: 1.0.0
  discovery:
    purpose: Engage customers in real-time, respond to inquiries, or share links via WhatsApp.
    usage_context: Use this for conversational support, customer check-ins, and two-way business messaging.
    agent_hints:
      - "Requires a 'to' phone number and a 'body' string."
      - "Note: Business-initiated messages should generally use templates first."
    waml_examples:
      - title: Send WhatsApp Greeting
        waml: |
          - step: say_hello
            call: whatsapp.action.messages.send_text
            with:
               to: +15551234567
               body: "Hi there! How can we help you today?"
  permissions:
    - "network:graph.facebook.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: to
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message_id
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/" + settings.phone_number_id + "/messages"
      headers: =platform.headers
      body:
        messaging_product: whatsapp
        recipient_type: individual
        to: =inputs.to
        type: text
        text: >
          "{ \"body\": \"" + inputs.body + "\" }"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_id
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/messages/0/id"
    returns:
      result: mid

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message_id
          value: =steps.extract_id.mid
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
