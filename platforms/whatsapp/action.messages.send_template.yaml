meta:
  permissions: ["network:graph.facebook.com"]
  id: whatsapp.messages.send_template
  name: Send Template Message
  category: Messages
  type: Action
  platform: whatsapp
  description: "Sends a pre-approved message template to a WhatsApp user."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: to
      type: string
      description: "WhatsApp ID or phone number of the recipient."
    - name: template_name
      type: string
      description: "The name of the message template."
    - name: language_code
      type: string
      description: "The code of the language the template is in (e.g. en_US)."
    - name: components
      type: array
      description: "Optional. Array of components (header, body, buttons) with parameters for the template."
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/v22.0/{{ get 'settings.phone_number_id' }}/messages"
      headers: "{{ platform.headers }}"
      body:
        messaging_product: "whatsapp"
        recipient_type: "individual"
        to: "{{ get 'inputs.to' }}"
        type: "template"
        template:
          name: "{{ get 'inputs.template_name' }}"
          language:
            code: "{{ get 'inputs.language_code' }}"
          components: "{{ get 'inputs.components' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
