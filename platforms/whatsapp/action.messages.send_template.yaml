meta:
  id: whatsapp.messages.send_template
  name: Send Template Message
  category: WhatsApp
  type: Action
  platform: whatsapp
  description: Send a pre-approved template message.
  version: 1.0.0
  discovery:
    purpose: Send a pre-approved WhatsApp message template to a recipient.
    usage_context: Use to automate delivery notifications, authentication codes, or customer service updates via the WhatsApp Business Platform.
    agent_hints:
      - "Requires a pre-approved template name and language code."
      - "Phone numbers must be in E.164 format."
    waml_examples:
      - title: Send OTP
        waml: |
          - step: send_otp
            call: whatsapp.action.messages.send_template
            with:
               to: 15551234567
               template_name: auth_code
               language_code: en_US
               components: [{ type: "body", parameters: [{ type: "text", text: "123456" }]}]
  permissions:
    - "network:graph.facebook.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: to
      type: string
    - name: template_name
      type: string
    - name: language_code
      type: string
      default: en_US
    - name: components
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message_id
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/" + settings.phone_number_id + "/messages"
      headers: =platform.headers
      body:
        messaging_product: whatsapp
        to: =inputs.to
        type: template
        template:
          name: =inputs.template_name
          language: >
            "{ \"code\": \"" + inputs.language_code + "\" }"
          components: =inputs.components
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_id
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/messages/0/id"
    returns:
      result: mid

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message_id
          value: =steps.extract_id.mid
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
