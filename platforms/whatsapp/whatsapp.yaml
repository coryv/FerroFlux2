meta:
  id: whatsapp
  name: WhatsApp Business
  type: Platform
  category: Communication
  description: "Connects to the WhatsApp Business API."
  version: "1.0.0"

config:
  base_url: "https://graph.facebook.com"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_KEY_HERE"

settings:
  - name: api_key
    label: "API Key"
    type: string
    required: true

  - name: phone_number_id
    label: "Phone Number ID"
    type: string
    required: true
    description: "The unique ID for the phone number from which you want to send messages."
