meta:
  id: whatsapp
  name: WhatsApp Business
  type: Platform
  category: Communication
  description: "Connects to the WhatsApp Business Platform (Cloud API) for messaging."
  version: "1.0.0"
  permissions:
    - "network:graph.facebook.com"

config:
  base_url: "https://graph.facebook.com/v21.0"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_ACCESS_TOKEN_HERE"

settings:
  - name: access_token
    label: "Access Token"
    type: string
    required: true
  - name: phone_number_id
    label: "Phone Number ID"
    type: string
    required: true
