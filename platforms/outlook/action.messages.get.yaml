meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.messages.get
  name: Get Message
  category: Messages
  type: Action
  platform: outlook
  description: "Retrieves detailed information about a specific email message."
  version: "1.0.0"
  discovery:
    purpose: "Fetch the properties, full body, and headers of a specific email message."
    usage_context: "Use this when you have a 'message_id' (e.g. from a trigger or list action) and need to read the full content or identify the sender's address."
    agent_hints:
      - "Requires the 'message_id' (long string)."
      - "Returns the full message object, including its attachments and importance."
    waml_examples:
      - title: "Get Email Body"
        waml: |
          - step: read_mail
            call: outlook.action.messages.get
            with:
               id: "AAMk..."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/me/messages/" + inputs.message_id
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
