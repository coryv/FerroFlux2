meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.messages.create_draft
  name: Create Draft
  category: Messages
  type: Action
  platform: outlook
  description: Create a new draft message.
  version: 1.0.0
  discovery:
    purpose: Create a new draft email in the user's Outlook account.
    usage_context: Use to prepare automated reports, candidate reach-out emails, or project updates for human review before sending.
    agent_hints:
      - "Requires subject, body, and toRecipients."
      - "Draft is created in the user's 'Drafts' folder."
    waml_examples:
      - title: Create Report Draft
        waml: |
          - step: prep_email
            call: outlook.action.messages.create_draft
            with:
               subject: Quarterly Analysis Draft
               body: "<h1>Review Required</h1><p>Here is the automated report.</p>"
               toRecipients: [{ "emailAddress": { "address": "admin@example.com" } }]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: subject
      type: string
    - name: =body
      type: string
    - name: to_recipients
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: draft
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/me/messages"
      headers: =platform.headers
      body:
        subject: =inputs.subject
        body:
          contentType: HTML
          content: =inputs.body
        toRecipients: >
          (has(inputs.to_recipients) ? inputs.to_recipients : "'[]')"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: draft
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
