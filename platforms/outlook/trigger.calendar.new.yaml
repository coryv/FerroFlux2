meta:
  id: outlook.calendar.new
  name: New Calendar Event
  category: Calendar
  type: Trigger
  platform: outlook
  description: "Polls for new events in the user's calendar."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: event
      type: object
  settings:
    - name: limit
      label: "Batch Limit"
      type: number
      default: 10

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/me/events"
      headers: "{{ platform.headers }}"
      query:
        "$top": "{{ get 'settings.limit' '10' }}"
        "$orderby": "createdDateTime desc"
    returns:
      status: status_code
      body: response_body

  - id: extract_events
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/value"
    returns:
      events: events_array

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: iterate
        params:
          items: "{{ steps.extract_events.events_array }}"
          cursor_key: "id"
          port: event
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
