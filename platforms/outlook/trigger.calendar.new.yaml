meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.calendar.new
  name: New Calendar Event
  category: Calendar
  type: Trigger
  platform: outlook
  description: Triggers when a new event is created in an Outlook calendar.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a new meeting or schedule item is added.
    usage_context: Use this to sync Outlook events to another calendar, notify team members on Slack/Teams, or automate meeting preparation notes.
    agent_hints:
      - "Polls the calendar for new events based on 'createdDateTime'."
      - "Returns the full event object (subject, start, end, attendees)."
    waml_examples:
      - title: Sync New Meetings
        waml: |
          trigger:
            new_mtg:
               call: outlook.trigger.calendar.new

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: event
      type: object
  settings:
    - name: limit
      label: Batch Limit
      type: number
      default: 10

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/me/events"
      headers: =platform.headers
      query:
        "$top": >
          (has(settings.limit) ? settings.limit : '10')
        "$orderby": >
          "createdDateTime desc"
    returns:
      status: status_code
      body: response_body

  - id: extract_events
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/value"
    returns:
      events: events_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_events.events_array
          cursor_key: id
          port: event
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
