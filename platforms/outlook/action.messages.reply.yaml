meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.messages.reply
  name: Reply to Email
  category: Messages
  type: Action
  platform: outlook
  description: "Reply to the sender of a specific message."
  version: "1.0.0"
  discovery:
    purpose: "Send a reply to an existing email message in Outlook."
    usage_context: "Use to automate email responses, provide status updates to customer inquiries, or maintain communication threads."
    agent_hints:
      - "Requires message_id and the body of the reply."
    waml_examples:
      - title: "Reply to Inquiry"
        waml: |
          - step: reply
            call: outlook.action.messages.reply
            with:
               message_id: "AAMkAG..."
               comment: "We have received your request and are processing it."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
    - name: comment
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/me/messages/" + inputs.message_id + "/reply"
      headers: platform.headers
      body:
        comment: inputs.comment
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "202":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
