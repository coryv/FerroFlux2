meta:
  id: outlook.messages.reply
  name: Reply to Email
  category: Messages
  type: Action
  platform: outlook
  description: "Reply to the sender of a specific message."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
    - name: comment
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/me/messages/{{ get 'inputs.message_id' }}/reply"
      headers: "{{ platform.headers }}"
      body:
        comment: "{{ get 'inputs.comment' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "202":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
