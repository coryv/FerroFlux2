meta:
  id: outlook.messages.list
  name: List Messages
  category: Messages
  type: Action
  platform: outlook
  description: "Retrieve a list of messages from the user's mailbox."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: folder_id
      type: string
      default: "inbox"
    - name: limit
      type: number
      default: 10
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: messages
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/mailFolders/{{ get 'inputs.folder_id' 'inbox' }}/messages"
      headers: "{{ platform.headers }}"
      query:
        "$top": "{{ get 'inputs.limit' '10' }}"
        "$orderby": "receivedDateTime desc"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: messages
          value: "{{ steps.request.response_body.value }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
