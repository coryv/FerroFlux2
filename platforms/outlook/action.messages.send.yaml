meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.messages.send
  name: Send Email
  category: Messages
  type: Action
  platform: outlook
  description: Sends a new email message to one or more recipients.
  version: 1.0.0
  discovery:
    purpose: Automate outbound communication, send notifications, and share documents via email.
    usage_context: Use this to send project updates, share reports, or trigger automated business emails from a workflow.
    agent_hints:
      - "Requires 'toRecipients' array (emailAddress: { address: '...' })."
      - "Supports 'subject', 'body' (html or text), and 'attachments'."
    waml_examples:
      - title: Send Project Sync
        waml: |
          - step: say_it
            call: outlook.action.messages.send
            with:
               subject: Weekly Update
               toRecipients: [{ emailAddress: { address: "ceo@acme.com" } }]
               body: { content: "Find the report attached.", contentType: "text" }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: recipient
      type: string
    - name: subject
      type: string
    - name: content
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: content_type
      label: Content Type
      type: select
      default: Text
      options:
        - value: Text
          label: Plain Text
        - value: HTML
          label: HTML

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/me/sendMail"
      headers: =platform.headers
      body:
        message:
          subject: =inputs.subject
          body:
            contentType: =settings.content_type
            content: =inputs.content
          toRecipients:
            - emailAddress:
                address: =inputs.recipient
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "202":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
