meta:
  id: outlook.messages.send
  name: Send Email
  category: Messages
  type: Action
  platform: outlook
  description: "Send an email via Microsoft Outlook."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: recipient
      type: string
    - name: subject
      type: string
    - name: content
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: content_type
      label: "Content Type"
      type: select
      default: "Text"
      options:
        - value: "Text"
          label: "Plain Text"
        - value: "HTML"
          label: "HTML"

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/me/sendMail"
      headers: "{{ platform.headers }}"
      body:
        message:
          subject: "{{ get 'inputs.subject' }}"
          body:
            contentType: "{{ get 'settings.content_type' }}"
            content: "{{ get 'inputs.content' }}"
          toRecipients:
            - emailAddress:
                address: "{{ get 'inputs.recipient' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "202":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
