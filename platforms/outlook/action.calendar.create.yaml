meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.calendar.create
  name: Create Calendar Event
  category: Calendar
  type: Action
  platform: outlook
  description: Creates a new event in an Outlook calendar.
  version: 1.0.0
  discovery:
    purpose: Schedule meetings, set reminders, and block time on an Outlook calendar.
    usage_context: Use this to automate appointment booking, sync external schedules, and manage team calendars.
    agent_hints:
      - "Requires 'subject', 'start', and 'end' times with 'dateTime' and 'timeZone'."
      - "Supports adding 'attendees' and 'location'."
    waml_examples:
      - title: Create Meeting
        waml: |
          - step: mk_event
            call: outlook.action.calendar.create
            with:
               subject: Project Sync
               start: { dateTime: "2024-04-01T10:00:00", timeZone: "UTC" }
               end: { dateTime: "2024-04-01T11:00:00", timeZone: "UTC" }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: subject
      type: string
    - name: start_time
      type: string # ISO format
    - name: end_time
      type: string # ISO format
    - name: body
      type: string
    - name: location
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: event
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/me/events"
      headers: =platform.headers
      body:
        subject: =inputs.subject
        body:
          contentType: HTML
          content: =inputs.body
        start:
          dateTime: =inputs.start_time
          timeZone: UTC
        end:
          dateTime: =inputs.end_time
          timeZone: UTC
        location:
          displayName: =inputs.location
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: event
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
