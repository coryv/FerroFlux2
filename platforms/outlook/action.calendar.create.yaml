meta:
  id: outlook.calendar.create
  name: Create Calendar Event
  category: Calendar
  type: Action
  platform: outlook
  description: "Create a new event in the user's calendar."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: subject
      type: string
    - name: start_time
      type: string # ISO format
    - name: end_time
      type: string # ISO format
    - name: body
      type: string
    - name: location
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: event
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/me/events"
      headers: "{{ platform.headers }}"
      body:
        subject: "{{ get 'inputs.subject' }}"
        body:
          contentType: "HTML"
          content: "{{ get 'inputs.body' }}"
        start:
          dateTime: "{{ get 'inputs.start_time' }}"
          timeZone: "UTC"
        end:
          dateTime: "{{ get 'inputs.end_time' }}"
          timeZone: "UTC"
        location:
          displayName: "{{ get 'inputs.location' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: event
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
