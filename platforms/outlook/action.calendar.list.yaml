meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.calendar.list
  name: List Calendar Events
  category: Calendar
  type: Action
  platform: outlook
  description: "Retrieve a list of calendar events."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: limit
      type: number
      default: 10
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: events
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/me/events"
      headers: platform.headers
      query:
        "$top": >
          (has(inputs.limit) ? inputs.limit : '10')
        "$orderby": >
          "start/dateTime desc"
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: events
          value: steps.request.response_body.value
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
