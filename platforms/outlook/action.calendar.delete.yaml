meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.calendar.delete
  name: Delete Calendar Event
  category: Calendar
  type: Action
  platform: outlook
  description: "Permanently delete a specific calendar event."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: event_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/me/events/" + inputs.event_id
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
