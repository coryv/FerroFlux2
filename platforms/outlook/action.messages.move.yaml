meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.messages.move
  name: Move Message
  category: Messages
  type: Action
  platform: outlook
  description: Moves an email message to a different folder in the mailbox.
  version: 1.0.0
  discovery:
    purpose: Organize inbox items, archive processed emails, or categorize messages into specific project folders.
    usage_context: Use this to move processed orders to an 'Orders' folder or archive system notifications after they've been handled.
    agent_hints:
      - "Requires 'id' (message_id) and 'destinationId' (folder_id or name like 'archive')."
    waml_examples:
      - title: Archive Email
        waml: |
          - step: archive_mail
            call: outlook.action.messages.move
            with:
               id: AAMk...
               destinationId: archive

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
    - name: destination_id
      type: string
      default: deleteditems
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/me/messages/" + inputs.message_id + "/move"
      headers: =platform.headers
      body:
        destinationId: >
          (has(inputs.destination_id) ? inputs.destination_id : 'deleteditems')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
