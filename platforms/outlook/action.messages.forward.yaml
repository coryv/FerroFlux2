meta:
  permissions: ["network:graph.microsoft.com"]
  id: outlook.messages.forward
  name: Forward Email
  category: Messages
  type: Action
  platform: outlook
  description: Forwards an email message to one or more recipients.
  version: 1.0.0
  discovery:
    purpose: Share incoming information, process alerts, or escalate support emails to the relevant team members.
    usage_context: Use this to automate information sharing when an email matches specific criteria (e.g. 'Project Alpha' keywords).
    agent_hints:
      - "Requires 'id' (message_id) and 'toRecipients' array."
      - "The 'comment' parameter adds a note before the forwarded content."
    waml_examples:
      - title: Forward Alert
        waml: |
          - step: pass_it
            call: outlook.action.messages.forward
            with:
               id: AAMk...
               toRecipients: [{ emailAddress: { address: "dev@acme.com" } }]
               comment: Please look into this server alert.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
    - name: to_recipients
      type: array
    - name: comment
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/me/messages/" + inputs.message_id + "/forward"
      headers: =platform.headers
      body:
        comment: =inputs.comment
        toRecipients: >
          (has(inputs.to_recipients) ? inputs.to_recipients : '[]')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "202":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
