meta:
  permissions: ["network:api.dropboxapi.com"]
  id: dropbox.files.list
  name: List Files
  category: Files
  type: Action
  platform: dropbox
  description: "List files and folders in a Dropbox directory."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: entries
      type: array
  settings:
    - name: recursive
      label: "Recursive"
      type: boolean
      required: false
      default: false

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/files/list_folder"
      headers: platform.headers
      body:
        path: inputs.path
        recursive: settings.recursive
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_entries
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/entries"
    returns:
      result: entries_array

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: entries
          value: steps.extract_entries.entries_array
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
