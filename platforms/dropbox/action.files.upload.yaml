meta:
  permissions: ["network:api.dropboxapi.com"]
  id: dropbox.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: dropbox
  description: "Upload a file to Dropbox."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
    - name: file
      type: blob
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metadata
      type: object
  settings:
    - name: mode
      label: "Override Mode"
      type: select
      required: false
      default: "add"
      options:
        - value: "add"
          label: "Add (fail if exists)"
        - value: "overwrite"
          label: "Overwrite"
        - value: "update"
          label: "Update"

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "https://content.dropboxapi.com/2/files/upload"
      headers:
        Dropbox-API-Arg: >
          {
            "path": "{{ get 'inputs.path' }}",
            "mode": "{{ get 'settings.mode' }}",
            "autorename": true,
            "mute": false
          }
        Content-Type: "application/octet-stream"
        Authorization: "{{ platform.headers.Authorization }}"
      body_type: binary
      body_var: "inputs.file"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metadata
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
