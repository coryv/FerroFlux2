meta:
  permissions: ["network:api.dropboxapi.com"]
  id: dropbox.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: dropbox
  description: "Upload a file to Dropbox."
  version: "1.0.0"
  discovery:
    purpose: "Upload a file from the local environment or a remote URL to Dropbox storage."
    usage_context: "Use to back up generated reports, save user-submitted assets, or migrate data from other cloud storage platforms."
    agent_hints:
      - "Requires a path (e.g. '/uploads/report.pdf') and the file content."
      - "Follows Dropbox's chunked upload protocol for large files."
    waml_examples:
      - title: "Upload PDF"
        waml: |
          - step: upload
            call: dropbox.action.files.upload
            with:
               path: "/backups/report_${now()}.pdf"
               content: "${steps.generate_pdf.output.blob}"
               mode: "overwrite"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
    - name: file
      type: blob
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metadata
      type: object
  settings:
    - name: mode
      label: "Override Mode"
      type: select
      required: false
      default: "add"
      options:
        - value: "add"
          label: "Add (fail if exists)"
        - value: "overwrite"
          label: "Overwrite"
        - value: "update"
          label: "Update"

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://content.dropboxapi.com/2/files/upload"
      headers:
        Dropbox-API-Arg: >
          '{"path": "' + inputs.path + '", "mode": "' + settings.mode + '", "autorename": true, "mute": false}'
        Content-Type: >
          "application/octet-stream"
        Authorization: platform.headers.Authorization
      body_type: binary
      body_var: inputs.file
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metadata
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
