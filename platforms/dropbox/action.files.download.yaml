meta:
  permissions: ["network:api.dropboxapi.com"]
  id: dropbox.files.download
  name: Download File
  category: Files
  type: Action
  platform: dropbox
  description: "Download a file from Dropbox as a blob."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: blob
  settings:
    - name: retry_on_error
      label: "Retry on error"
      type: boolean
      required: false
      default: false

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://content.dropboxapi.com/2/files/download"
      headers:
        Dropbox-API-Arg: >
          "{\\"path\\": \\"" + inputs.path + "\\"}"



        Authorization: platform.headers.Authorization
      response_type: blob
    returns:
      status: status_code
      body: response_blob

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: steps.request.response_blob
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_blob
        # Note: >
          "when response_type is blob, the body contains the ticket to the error response bytes or XML/JSON error."
