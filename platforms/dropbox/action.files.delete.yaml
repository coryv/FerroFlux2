meta:
  id: dropbox.files.delete
  name: Delete File
  category: Files
  type: Action
  platform: dropbox
  description: "Delete a file or folder in Dropbox."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metadata
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/files/delete_v2"
      headers: "{{ platform.headers }}"
      body:
        path: "{{ get 'inputs.path' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metadata
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
