meta:
  permissions: ["network:api.dropboxapi.com"]
  id: dropbox.files.delete
  name: Delete File
  category: Files
  type: Action
  platform: dropbox
  description: Deletes a file or folder from Dropbox.
  version: 1.0.0
  discovery:
    purpose: Permanently remove a file or directory in Dropbox.
    usage_context: Use this to clean up temporary assets, remove outdated reports, or manage account storage quotas. Use with caution as this is irreversible.
    agent_hints:
      - "Requires the explicit 'path' to the item (e.g. '/Temp/log.txt')."
      - "Deleting a folder will delete all its contents."
    waml_examples:
      - title: Cleanup Old Reports
        waml: |
          - step: delete_report
            call: dropbox.action.files.delete
            with:
               path: /Reports/Archive/2023.pdf

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metadata
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/files/delete_v2"
      headers: =platform.headers
      body:
        path: =inputs.path
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metadata
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
