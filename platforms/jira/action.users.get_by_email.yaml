meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.users.get_by_email
  name: Get User by Email
  category: Users
  type: Action
  platform: jira
  description: "Search for a Jira user by their email address."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: email
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: user
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/user/search"
      headers: "{{ platform.headers }}"
      query:
        query: "{{ get 'inputs.email' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: user
          value: "{{ steps.request.response_body | json_query(\"[0]\") }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
