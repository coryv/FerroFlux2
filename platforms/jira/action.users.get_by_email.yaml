meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.users.get_by_email
  name: Get User by Email
  category: Users
  type: Action
  platform: jira
  description: "Search for a Jira user by their email address."
  version: "1.0.0"
  discovery:
    purpose: "Map an email address to a Jira account ID."
    usage_context: "Use to find Jira users based on context from other communications tools like Slack or Gmail."
    agent_hints:
      - "Returns a user object including accountId."
    waml_examples:
      - title: "Find User ID"
        waml: |
          - step: find_user
            call: jira.users.get_by_email
            with:
               email: "user@example.com"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: email
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: user
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/user/search"
      headers: platform.headers
      query:
        query: inputs.email
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: user
          value: >
            json_query(steps.request.response_body, "[0]")
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
