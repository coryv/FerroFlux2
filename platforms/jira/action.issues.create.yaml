meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: jira
  description: Creates a new issue in a specific project.
  version: 1.0.0
  discovery:
    purpose: Create a new issue (Task, Bug, Story) in a specific Jira project.
    usage_context: Use this to automate ticket creation from external triggers like GitHub issues or Slack messages.
    agent_hints:
      - "Requires project_key and summary (title)."
      - "Defaults to 'Task' if issue_type is not provided."
    waml_examples:
      - title: Create Bug Ticket
        waml: |
          - step: log_bug
            call: =jira.issues.create
            with:
               project_key: PROJ
               summary: Bug found in production
               description: System failed with error 500
               issue_type: Bug

interface:
  inputs:
    - name: Exec
      type: flow
    - name: project_key
      type: string
    - name: summary
      type: string
    - name: description
      type: string
    - name: issue_type
      type: string
      default: Task
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/issue"
      headers: =platform.headers
      body:
        fields:
          project:
            key: =inputs.project_key
          summary: =inputs.summary
          description:
            type: doc
            version: 1
            content:
              - type: paragraph
                content:
                  - type: text
                    text: =inputs.description
          issuetype:
            name: >
              (has(inputs.issue_type) ? inputs.issue_type : 'Task')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
