meta:
  id: jira.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: jira
  description: "Creates an issue or a sub-task."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: fields
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "https://{{ get 'settings.domain' }}.atlassian.net/rest/api/3/issue"
      headers: "{{ platform.headers }}"
      body:
        fields: "{{ get 'inputs.fields' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
