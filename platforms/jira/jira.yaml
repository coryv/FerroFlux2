meta:
  permissions: ["network:*.atlassian.net"]
  id: jira
  name: Jira
  type: Platform
  category: Productivity
  description: "Connects to the Atlassian Jira Cloud REST API v3."
  version: "1.0.0"

config:
  base_url: >
    "https://" + settings.domain + ".atlassian.net/rest/api/3"
  headers:
    Authorization: >
      "Bearer " + settings.connection.access_token
    Content-Type: "application/json"
    Accept: "application/json"

settings:
  - name: domain
    label: "Atlassian Domain (e.g. mycompany)"
    type: string
    required: true
  - name: connection
    label: "Atlassian Connection"
    type: oauth2
    required: true
