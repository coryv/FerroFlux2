meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.projects.list
  name: List Projects
  category: Projects
  type: Action
  platform: jira
  description: "TODO: Describe what this node does."
  version: 1.0.0
  discovery:
    purpose: Retrieve a list of all accessible Jira projects.
    usage_context: Use this to discover project keys or IDs required for creating or searching issues.
    agent_hints:
      - "Returns an array of project objects including key, name, and id."
    waml_examples:
      - title: List Projects
        waml: |
          - step: get_projects
            call: jira.projects.list

interface:
  inputs:
    - name: Exec
      type: flow
    # TODO: add runtime inputs that get wired from previous nodes
    # - name: field_name
    #   type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object
  # settings:
  #   - name: example_setting
  #     label: "Example Setting"
  #     type: string
  #     required: false
  #     placeholder: "default value"

execution:
  - id: request
    tool: http_client
    params:
      method: >
        "GET            # TODO: GET | POST | PUT | DELETE | PATCH"
      url: >
        platform.base_url + "/TODO"
      headers: =platform.headers
      # body:                >
        # "# Uncomment for POST/PUT/PATCH"
      #   field: inputs.field_name
      #   setting: settings.example_setting
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: '\"200\' # TODO: add all success codes (201, 202, 204, etc.)"
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
