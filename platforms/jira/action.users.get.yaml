meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.users.get
  name: Get User
  category: Users
  type: Action
  platform: jira
  description: "Gets a user."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: accountId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: user
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/user"

      headers: "{{ platform.headers }}"
      query:
        accountId: "{{ get 'inputs.accountId' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: user
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
