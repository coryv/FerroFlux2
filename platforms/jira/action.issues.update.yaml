meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.update
  name: Update Issue
  category: Issues
  type: Action
  platform: jira
  description: Update an existing issue's fields.
  version: 1.0.0
  discovery:
    purpose: Update specific fields (summary, description) of an existing Jira issue.
    usage_context: Use to dynamically update progress, reassign issues, or modify task descriptions based on workflow criteria.
    agent_hints:
      - "Requires the issue key (e.g., PROJ-123) or issue ID."
    waml_examples:
      - title: Update Issue Summary
        waml: |
          - step: update_ticket
            call: =jira.issues.update
            with:
               issue_id_or_key: PROJ-123
               summary: Updated summary text

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: summary
      type: string
    - name: description
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >-
        =platform.base_url + "/issue/" + inputs.issue_id
      headers: =platform.headers
      body:
        fields:
          summary: =inputs.summary
          description:
            type: doc
            version: 1
            content:
              - type: paragraph
                content:
                  - type: text
                    text: =inputs.description
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
