meta:
  id: jira.issues.update
  name: Update Issue
  category: Issues
  type: Action
  platform: jira
  description: "Update an existing issue's fields."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: summary
      type: string
    - name: description
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/issue/{{ get 'inputs.issue_id' }}"
      headers: "{{ platform.headers }}"
      body:
        fields:
          summary: "{{ get 'inputs.summary' }}"
          description:
            type: "doc"
            version: 1
            content:
              - type: "paragraph"
                content:
                  - type: "text"
                    text: "{{ get 'inputs.description' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
