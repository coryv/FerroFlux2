meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.transition
  name: Transition Issue
  category: Issues
  type: Action
  platform: jira
  description: Perform a status transition on an issue (e.g. Move to Done).
  version: 1.0.0
  discovery:
    purpose: Move a Jira issue to a different status (transition).
    usage_context: Use to automate workflow status changes, e.g., moving tickets to 'Done' when a PR is merged.
    agent_hints:
      - "Requires the issue key (e.g., PROJ-123) and the transition ID or name (e.g., 'Done')."
    waml_examples:
      - title: Resolve Issue
        waml: |
          - step: resolve
            call: =jira.issues.transition
            with:
               issue_id_or_key: PROJ-123
               transition_name: Done

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: transition_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/issue/" + inputs.issue_id + "/transitions"
      headers: =platform.headers
      body:
        transition:
          id: inputs.transition_id
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
