meta:
  id: jira.issues.transition
  name: Transition Issue
  category: Issues
  type: Action
  platform: jira
  description: "Perform a status transition on an issue (e.g. Move to Done)."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: transition_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/issue/{{ get 'inputs.issue_id' }}/transitions"
      headers: "{{ platform.headers }}"
      body:
        transition:
          id: "{{ get 'inputs.transition_id' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
