meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.search
  name: Search Issues
  category: Issues
  type: Action
  platform: jira
  description: Searches for issues using JQL.
  version: 1.0.0
  discovery:
    purpose: Search for Jira issues using JQL (Jira Query Language).
    usage_context: Use to find specific tickets for reporting, bulk updates, or to check for existing duplicates.
    agent_hints:
      - "Requires a valid JQL string (e.g., 'project = PROJ AND status = Open')."
    waml_examples:
      - title: Find Open Bugs
        waml: |
          - step: find
            call: jira.action.issues.search
            with:
               jql: issuetype = Bug AND status = 'Open'
               maxResults: 10

interface:
  inputs:
    - name: Exec
      type: flow
    - name: jql
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issues
      type: array

execution:
  - id: =request
    tool: paginate
    params:
      method: GET
      url: >
        "https:'=//" + settings.domain + ".atlassian.net/rest/api/3/search"'
      headers: =platform.headers
      strategy: offset
      offset_param: startAt
      limit_param: maxResults
      per_page: 50
      items_path: >
        "/issues"
      query:
        jql: =inputs.jql
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issues
          value: =steps.request.all_items
