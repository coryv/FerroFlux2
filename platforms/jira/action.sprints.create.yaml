meta:
  id: jira.sprints.create
  name: Create Sprint
  category: Board
  type: Action
  platform: jira
  description: "Creates a sprint."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
    - name: originBoardId
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: sprint
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "https://{{ get 'settings.domain' }}.atlassian.net/rest/agile/1.0/sprint"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
        originBoardId: "{{ get 'inputs.originBoardId' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: sprint
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
