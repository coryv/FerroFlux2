meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.sprints.create
  name: Create Sprint
  category: Board
  type: Action
  platform: jira
  description: Creates a sprint.
  version: 1.0.0
  discovery:
    purpose: Create a new sprint in a Jira software board.
    usage_context: Use to automate sprint planning, setup intervals from a project timeline, or initiate development cycles.
    agent_hints:
      - "Requires boardId and name."
    waml_examples:
      - title: Start Sprint
        waml: |
          - step: new_sprint
            call: jira.action.sprints.create
            with:
               boardId: 101
               name: Sprint 23 - Backend Revamp
               startDate: "2023-10-01T09:00:00Z"
               endDate: "2023-10-14T17:00:00Z"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
    - name: originBoardId
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: sprint
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        ="https://" + settings.domain + ".atlassian.net/rest/agile/1.0/sprint"
      headers: =platform.headers
      body:
        name: inputs.name
        originBoardId: =inputs.originBoardId
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: sprint
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
