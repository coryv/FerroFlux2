meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.add_comment
  name: Add Comment
  category: Issues
  type: Action
  platform: jira
  description: Adds a new comment to an issue.
  version: 1.0.0
  discovery:
    purpose: Add a comment to an existing Jira issue.
    usage_context: Use to log updates or communicate within a ticket.
    agent_hints:
      - "Requires issue key (e.g., PROJ-123) and comment body."
    waml_examples:
      - title: Log Update
        waml: |
          - step: log
            call: jira.issues.add_comment
            with:
               issue_id_or_key: PROJ-123
               body: Automatic comment from workflow

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issueIdOrKey
      type: string
    - name: body
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: comment
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://" + settings.domain + ".atlassian.net/rest/api/3/issue/" + inputs.issueIdOrKey + "/comment"
      headers: =platform.headers
      body:
        body: =inputs.body
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: comment
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
