meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.assign
  name: Assign Issue
  category: Issues
  type: Action
  platform: jira
  description: "Assign an issue to a specific user."
  version: "1.0.0"
  discovery:
    purpose: "Assign a Jira issue to a specific user (account ID)."
    usage_context: "Use to automate ticket routing or reassign tasks based on workflow rules."
    agent_hints:
      - "Requires the issue key (e.g., PROJ-123) and the accountId of the user."
    waml_examples:
      - title: "Assign Ticket"
        waml: |
          - step: assign
            call: jira.issues.assign
            with:
               issue_id_or_key: "PROJ-123"
               account_id: "5b10ac8d82e05b22cc7d4ef5"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: account_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/issue/" + inputs.issue_id + "/assignee"
      headers: platform.headers
      body:
        accountId: inputs.account_id
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
