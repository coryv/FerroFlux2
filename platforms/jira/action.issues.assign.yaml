meta:
  id: jira.issues.assign
  name: Assign Issue
  category: Issues
  type: Action
  platform: jira
  description: "Assign an issue to a specific user."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: account_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/issue/{{ get 'inputs.issue_id' }}/assignee"
      headers: "{{ platform.headers }}"
      body:
        accountId: "{{ get 'inputs.account_id' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
