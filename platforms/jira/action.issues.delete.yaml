meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.delete
  name: Delete Issue
  category: Issues
  type: Action
  platform: jira
  description: Permanently delete a specific issue.
  version: 1.0.0
  discovery:
    purpose: Permanently remove an issue from a Jira project.
    usage_context: Use to cleanup test data, remove accidentally created tickets, or manage lifecycle of transient issues.
    agent_hints:
      - "Requires issueIdOrKey."
      - "Deletion is irreversible."
    waml_examples:
      - title: Delete Issue
        waml: |
          - step: cleanup
            call: jira.action.issues.delete
            with:
               issueIdOrKey: PROJ-123

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/issue/" + inputs.issue_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
