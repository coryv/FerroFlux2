meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.comments.add
  name: Add Comment to Issue
  category: Issues
  type: Action
  platform: jira
  description: "Add a comment to a specific Jira issue."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/issue/{{ get 'inputs.issue_id' }}/comment"
      headers: "{{ platform.headers }}"
      body:
        body:
          type: "doc"
          version: 1
          content:
            - type: "paragraph"
              content:
                - type: "text"
                  text: "{{ get 'inputs.body' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
