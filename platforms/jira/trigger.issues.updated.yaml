meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.trigger.issues.updated
  name: Issue Updated
  category: Issues
  type: Trigger
  platform: jira
  description: "Polls Jira for issues that have been updated recently."
  version: "1.0.0"
  discovery:
    purpose: "Triggers whenever a Jira issue is modified (fields changed, transitioning status)."
    usage_context: "Use to automate post-update actions like notifying team leads, syncing statuses to Trello, or updating documentation."
    agent_hints:
      - "Provides details on what fields were changed and the updated issue state."
    waml_examples:
      - title: "Issue Change Sync"
        waml: |
          - step: log_change
            type: trigger
            call: jira.trigger.issues.updated

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: issue
      type: object
  settings:
    - name: project_key
      label: "Project Key"
      type: string
      required: true
    - name: limit
      label: "Batch Limit"
      type: number
      default: 50

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/search"
      headers: platform.headers
      body:
        jql: >
          "project = '" + settings.project_key + "' AND updated > '" + (has(event.cursor) ? event.cursor : '1970-01-01 00:00') + "' ORDER BY updated ASC"
        maxResults: >
          (has(settings.limit) ? settings.limit : '50')
    returns:
      status: status_code
      body: response_body

  - id: extract_issues
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/issues"
    returns:
      issues: issues_array

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: steps.extract_issues.issues_array
          cursor_key: fields.updated
          port: issue
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
