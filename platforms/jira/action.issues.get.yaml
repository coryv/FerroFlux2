meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.get
  name: Get Issue
  category: Issues
  type: Action
  platform: jira
  description: Retrieve details for a specific issue.
  version: 1.0.0
  discovery:
    purpose: Retrieve all fields and details for a specific Jira issue.
    usage_context: Use this to fetch the current status, description, assignee, or custom field values of a ticket.
    agent_hints:
      - "Requires the issue key (e.g., PROJ-123) or issue ID."
      - "Returns the full issue object."
    waml_examples:
      - title: Get Bug Details
        waml: |
          - step: fetch_bug
            call: =jira.issues.get
            with:
               issue_id_or_key: PROJ-123

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/issue/" + inputs.issue_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
