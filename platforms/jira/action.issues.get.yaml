meta:
  id: jira.issues.get
  name: Get Issue
  category: Issues
  type: Action
  platform: jira
  description: "Retrieves the details of an issue."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issueIdOrKey
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "https://{{ get 'settings.domain' }}.atlassian.net/rest/api/3/issue/{{ get 'inputs.issueIdOrKey' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
