meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.add_attachment
  name: Add Attachment
  category: Issues
  type: Action
  platform: jira
  description: Add a file attachment to an issue.
  version: 1.0.0
  discovery:
    purpose: Upload and attach a file to a Jira issue.
    usage_context: Use to attach screenshots, log files, or PDF reports to relevant bug reports or tasks.
    agent_hints:
      - "Requires issueIdOrKey and a file object (URL or multipart stream)."
    waml_examples:
      - title: Attach Log
        waml: |
          - step: upload
            call: jira.action.issues.add_attachment
            with:
               issueIdOrKey: PROJ-123
               file: =steps.gen_log.output

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issue_id
      type: string
    - name: attachment
      type: string # Blob ID / SecureTicket
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/issue/" + inputs.issue_id + "/attachments"
      headers:
        Authorization: >
          "Bearer " + settings.connection.access_token
        X-Atlassian-Token: nocheck
        Content-Type: >
          "multipart/form-data"
      body:
        file:
          ticket: =inputs.attachment
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
