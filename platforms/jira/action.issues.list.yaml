meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.issues.list
  name: List Issues
  category: Issues
  type: Action
  platform: jira
  description: "Search for issues using JQL (Jira Query Language)."
  version: "1.0.0"
  discovery:
    purpose: "Search and retrieve issues from Jira using JQL (Jira Query Language)."
    usage_context: "Use this to fetch bug reports, track milestone progress, or list tasks for a specific assignee."
    agent_hints:
      - "Requires a valid JQL query string."
      - "Returns a list of issue objects (id, key, status, summary, etc.)."
    waml_examples:
      - title: "List Open Bugs"
        waml: |
          - step: find_bugs
            call: jira.issues.list
            with:
               jql: "issuetype = Bug AND status != Done"
               limit: 20

interface:
  inputs:
    - name: Exec
      type: flow
    - name: jql
      type: string
    - name: limit
      type: number
      default: 50
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issues
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/search"
      headers: platform.headers
      body:
        jql: inputs.jql
        maxResults: >
          (has(inputs.limit) ? inputs.limit : '50')
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issues
          value: steps.request.response_body.issues
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
