meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.sprints.start
  name: Start Sprint
  category: Board
  type: Action
  platform: jira
  description: Starts a sprint.
  version: 1.0.0
  discovery:
    purpose: Change the state of a Jira sprint to 'active'.
    usage_context: Use to automate the start of a development cycle based on calendar events or team readiness.
    agent_hints:
      - "Requires the sprint ID."
    waml_examples:
      - title: Start Sprint
        waml: |
          - step: activate
            call: jira.sprints.start
            with:
               sprint_id: 123
               name: Sprint 42
               start_date: "2024-04-01T09:00:00.000Z"
               end_date: "2024-04-15T18:00:00.000Z"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sprintId
      type: string
    - name: state
      type: string
    - name: startDate
      type: string
    - name: endDate
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: sprint
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://" + settings.domain + ".atlassian.net/rest/agile/1.0/sprint/" + inputs.sprintId
      headers: =platform.headers
      body:
        state: =inputs.state
        startDate: =inputs.startDate
        endDate: =inputs.endDate
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: sprint
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
