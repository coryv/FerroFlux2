meta:
  permissions: ["network:*.atlassian.net"]
  id: jira.sprints.start
  name: Start Sprint
  category: Board
  type: Action
  platform: jira
  description: "Starts a sprint."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sprintId
      type: string
    - name: state
      type: string
    - name: startDate
      type: string
    - name: endDate
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: sprint
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        "https://" + settings.domain + ".atlassian.net/rest/agile/1.0/sprint/" + inputs.sprintId
      headers: platform.headers
      body:
        state: inputs.state
        startDate: inputs.startDate
        endDate: inputs.endDate
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: sprint
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
