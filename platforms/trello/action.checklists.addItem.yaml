meta:
  id: trello.checklists.addItem
  name: Add Checklist Item
  category: Checklists
  type: Action
  platform: trello
  description: "Adds an item to a checklist."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idChecklist
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: checkItem
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/checklists/{{ get 'inputs.idChecklist' }}/checkItems"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: checkItem
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
