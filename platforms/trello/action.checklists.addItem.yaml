meta:
  permissions: ["network:api.trello.com"]
  id: trello.checklists.addItem
  name: Add Checklist Item
  category: Checklists
  type: Action
  platform: trello
  description: Adds a new item to an existing Trello checklist.
  version: 1.0.0
  discovery:
    purpose: Add a specific checkbox item to a checklist.
    usage_context: Use this to populate checklists with specific steps or requirements discovered during a workflow.
    agent_hints:
      - "Requires the checklist ID ('id')."
    waml_examples:
      - title: Add Checklist Item
        waml: |
          - step: add_todo
            call: trello.action.checklists.addItem
            with:
               id: 65b...
               name: Test on iOS

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idChecklist
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: checkItem
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/checklists/" + inputs.idChecklist + "/checkItems"
      headers: =platform.headers
      body:
        name: =inputs.name
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: checkItem
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
