meta:
  permissions: ["network:api.trello.com"]
  id: trello.checklists.markComplete
  name: Mark Checklist Item Complete
  category: Checklists
  type: Action
  platform: trello
  description: Marks a checklist item as complete or incomplete.
  version: 1.0.0
  discovery:
    purpose: Check or uncheck an item in a Trello checklist.
    usage_context: Use this to automate task progress tracking as workflow steps succeed.
    agent_hints:
      - "Requires the card ID ('idCard'), and 'idCheckItem'."
    waml_examples:
      - title: Check Off Task
        waml: |
          - step: finish_todo
            call: trello.action.checklists.markComplete
            with:
               idCard: 65a...
               idCheckItem: 65c...
               state: complete

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idCard
      type: string
    - name: idCheckItem
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: checkItem
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >-
        =platform.base_url + "/cards/" + inputs.idCard + "/checkItem/" + inputs.idCheckItem
      headers: =platform.headers
      body:
        state: complete
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: checkItem
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
