meta:
  permissions: ["network:api.trello.com"]
  id: trello.checklists.markComplete
  name: Mark Checklist Item Complete
  category: Checklists
  type: Action
  platform: trello
  description: "Marks a checklist item as complete."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idCard
      type: string
    - name: idCheckItem
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: checkItem
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/cards/" + inputs.idCard + "/checkItem/" + inputs.idCheckItem
      headers: platform.headers
      body:
        state: complete
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: checkItem
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
