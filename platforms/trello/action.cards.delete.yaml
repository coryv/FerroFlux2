meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.delete
  name: Delete Card
  category: Cards
  type: Action
  platform: trello
  description: Permanently deletes a Trello card.
  version: 1.0.0
  discovery:
    purpose: Remove a card from the board.
    usage_context: Use this to clean up temporary cards or remove duplicate tasks. Use with caution as this is irreversible.
    agent_hints:
      - "Requires the card ID."
    waml_examples:
      - title: Delete Duplicate Card
        waml: |
          - step: rm_card
            call: trello.action.cards.delete
            with:
               id: 65a...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/cards/" + inputs.id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
