meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.move
  name: Move Card
  category: Cards
  type: Action
  platform: trello
  description: Moves an existing Trello card to a different list or board.
  version: 1.0.0
  discovery:
    purpose: Organize tasks by changing their container (list) or project area (board).
    usage_context: Use this to move cards from 'In Progress' to 'Done', or to transition a card across different project boards.
    agent_hints:
      - "Requires the card ID."
      - "You must specify 'idList' and optionally 'idBoard'."
    waml_examples:
      - title: Move to Done
        waml: |
          - step: move_it
            call: trello.action.cards.move
            with:
               id: 65a...
               idList: 65b...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
    - name: idList
      type: string
    - name: idBoard
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: card
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/cards/" + inputs.id
      headers: =platform.headers
      body:
        idList: =inputs.idList
        idBoard: =inputs.idBoard
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: card
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
