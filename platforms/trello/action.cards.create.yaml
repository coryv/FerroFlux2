meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.create
  name: Create Card
  category: Cards
  type: Action
  platform: trello
  description: "Creates a new card in a specific Trello list."
  version: "1.0.0"
  discovery:
    purpose: "Add a new task or note to a Trello board."
    usage_context: "Use this to automate task creation from external triggers, such as email, form submissions, or incident reports. Requires a 'idList' and 'name'."
    agent_hints:
      - "Requires the 'idList' (Short string ID)."
      - "Supports setting due dates, labels, and descriptions."
    waml_examples:
      - title: "Create Bug Card"
        waml: |
          - step: mk_card
            call: trello.action.cards.create
            with:
               idList: "65a..."
               name: "Report: Broken Login"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idList
      type: string
    - name: name
      type: string
    - name: desc
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: card
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/cards"
      headers: platform.headers
      body:
        idList: inputs.idList
        name: inputs.name
        desc: inputs.desc
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: card
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
