meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.create
  name: Create Card
  category: Cards
  type: Action
  platform: trello
  description: "Creates a new card."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idList
      type: string
    - name: name
      type: string
    - name: desc
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: card
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/cards"
      headers: "{{ platform.headers }}"
      body:
        idList: "{{ get 'inputs.idList' }}"
        name: "{{ get 'inputs.name' }}"
        desc: "{{ get 'inputs.desc' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: card
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
