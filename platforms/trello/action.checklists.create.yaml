meta:
  permissions: ["network:api.trello.com"]
  id: trello.checklists.create
  name: Create Checklist
  category: Checklists
  type: Action
  platform: trello
  description: Creates a new checklist on a Trello card.
  version: 1.0.0
  discovery:
    purpose: Add a structured checklist (e.g. 'To Do', 'Requirements') to a card.
    usage_context: Use this to programmatically add standard checklists to specific task cards, such as a 'QA Checklist' for bug reports.
    agent_hints:
      - "Requires the card ID ('idCard') and a 'name'."
    waml_examples:
      - title: Add Requirements Checklist
        waml: |
          - step: mk_list
            call: trello.action.checklists.create
            with:
               idCard: 65a...
               name: Acceptance Criteria

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idCard
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: checklist
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/cards/" + inputs.idCard + "/checklists"
      headers: =platform.headers
      body:
        name: =inputs.name
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: checklist
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
