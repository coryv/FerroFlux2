meta:
  permissions: ["network:api.trello.com"]
  id: trello.checklists.create
  name: Create Checklist
  category: Checklists
  type: Action
  platform: trello
  description: "Creates a checklist on a card."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idCard
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: checklist
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/cards/{{ get 'inputs.idCard' }}/checklists"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: checklist
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
