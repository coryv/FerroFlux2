meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.update
  name: Update Card
  category: Cards
  type: Action
  platform: trello
  description: "Updates a card."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
    - name: name
      type: string
    - name: desc
      type: string
    - name: closed
      type: boolean
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: card
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/cards/" + inputs.id
      headers: platform.headers
      body:
        name: inputs.name
        desc: inputs.desc
        closed: inputs.closed
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: card
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
