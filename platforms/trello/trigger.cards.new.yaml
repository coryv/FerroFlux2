meta:
  permissions: ["network:api.trello.com"]
  id: trello.trigger.cards.new
  name: New Card
  category: Cards
  type: Trigger
  platform: trello
  description: Triggers when a new card is created on a Trello board.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a new work item appears in Trello.
    usage_context: Use this to notify team members on Slack, sync new tasks to an external tool, or trigger automated task assignment.
    agent_hints:
      - "Polls the board for new cards based on the 'date_created' timestamp."
      - "Requires the board ID ('idBoard')."
    waml_examples:
      - title: Sync New Cards
        waml: |
          trigger:
            new_card:
               call: =trello.trigger.cards.new
               with:
                  idBoard: 65e...

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: card
      type: object
  settings:
    - name: board_id
      label: Board ID
      type: string
      required: true
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/1/boards/" + settings.board_id + "/actions"
      headers: =platform.headers
      query:
        filter: createCard
        since: >
          has(event.cursor) ? event.cursor : "1970-01-01T00:00:00.000Z"
        limit: 50
    returns:
      status: status_code
      body: response_body

  - id: extract_cards
    tool: rhai
    params:
      script: >
        input.actions.map(|a| a.data.card)
      input:
        actions: =steps.query.response_body
    returns:
      result: cards_array

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_cards.cards_array
          cursor_key: date
          port: card
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.query.response_body
