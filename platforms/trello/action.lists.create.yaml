meta:
  permissions: ["network:api.trello.com"]
  id: trello.lists.create
  name: Create List
  category: Lists
  type: Action
  platform: trello
  description: Creates a new list on a Trello board.
  version: 1.0.0
  discovery:
    purpose: Create a container for cards within a specific project board.
    usage_context: Use this to automate list creation for new project phases, sprints, or client onboarding checklists.
    agent_hints:
      - "Requires the board ID ('idBoard') and a 'name'."
    waml_examples:
      - title: Create Task List
        waml: |
          - step: mk_list
            call: trello.action.lists.create
            with:
               idBoard: 65e...
               name: Backlog

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idBoard
      type: string
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: list
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/boards/" + inputs.idBoard + "/lists"
      headers: =platform.headers
      body:
        name: =inputs.name
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: list
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
