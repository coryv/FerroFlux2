meta:
  id: trello.boards.create
  name: Create Board
  category: Boards
  type: Action
  platform: trello
  description: "Creates a board."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: board
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/boards"
      headers: "{{ platform.headers }}"
      body:
        name: "{{ get 'inputs.name' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: board
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
