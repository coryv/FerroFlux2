meta:
  permissions: ["network:api.trello.com"]
  id: trello.boards.create
  name: Create Board
  category: Boards
  type: Action
  platform: trello
  description: Creates a new Trello board.
  version: 1.0.0
  discovery:
    purpose: Provision a new visual project area (board) in Trello.
    usage_context: Use this to create project-specific boards for new clients, monthly marketing plans, or team brainstorms.
    agent_hints:
      - "Requires a 'name'."
      - "Optional parameters include 'defaultLabels', 'defaultLists', and 'idOrganization'."
    waml_examples:
      - title: Create Client Board
        waml: |
          - step: mk_board
            call: trello.action.boards.create
            with:
               name: Acme Web Redesign

interface:
  inputs:
    - name: Exec
      type: flow
    - name: name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: board
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/boards"
      headers: =platform.headers
      body:
        name: =inputs.name
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: board
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
