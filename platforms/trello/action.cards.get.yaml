meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.get
  name: Get Card
  category: Cards
  type: Action
  platform: trello
  description: Retrieves detailed information about a Trello card.
  version: 1.0.0
  discovery:
    purpose: Fetch the properties, due date, and labels of a specific Trello card.
    usage_context: Use this when you have a Card ID and need to check its status, read its description, or identify which list it belongs to.
    agent_hints:
      - "Requires the card ID (Short string)."
      - "Returns the full card object with its associations (ID List, ID Board, labels)."
    waml_examples:
      - title: Get Card Status
        waml: |
          - step: read_card
            call: trello.action.cards.get
            with:
               id: 65a...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: card
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/cards/" + inputs.id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: card
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
