meta:
  id: trello.cards.list
  name: List Cards
  category: Cards
  type: Action
  platform: trello
  description: "Lists cards in a list."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idList
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: cards
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/lists/{{ get 'inputs.idList' }}/cards"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: cards
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
