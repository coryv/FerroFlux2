meta:
  permissions: ["network:api.trello.com"]
  id: trello.cards.list
  name: List Cards
  category: Cards
  type: Action
  platform: trello
  description: "Lists cards within a specific Trello list."
  version: "1.0.0"
  discovery:
    purpose: "Browse and find tasks belonging to a specific list."
    usage_context: "Use this to fetch all tasks in a 'Backlog' list, sync board items to a spreadsheet, or audit card ages."
    agent_hints:
      - "Requires the 'idList' (Short string ID)."
      - "Returns a list of card summaries (ID, name, pos, etc.)."
    waml_examples:
      - title: "List List Cards"
        waml: |
          - step: get_todo
            call: trello.action.cards.list
            with:
               id: "65a..."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idList
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: cards
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/lists/" + inputs.idList + "/cards"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: cards
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
