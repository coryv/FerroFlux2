meta:
  permissions: ["network:api.trello.com"]
  id: trello.comments.create
  name: Add Comment
  category: Comments
  type: Action
  platform: trello
  description: "Adds a comment to an existing Trello card."
  version: "1.0.0"
  discovery:
    purpose: "Communicate updates and provide context on a task card."
    usage_context: "Use this to log progress, notify team members of results, or record completion details within the card's history."
    agent_hints:
      - "Requires the card ID."
    waml_examples:
      - title: "Post Status Update"
        waml: |
          - step: say_it
            call: trello.action.comments.create
            with:
               id: "65a..."
               text: "Processing complete. Please check the results."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idCard
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: comment
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/cards/" + inputs.idCard + "/actions/comments"
      headers: platform.headers
      body:
        text: inputs.text
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: comment
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
