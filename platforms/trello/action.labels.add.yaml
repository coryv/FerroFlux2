meta:
  id: trello.labels.add
  name: Add Label
  category: Labels
  type: Action
  platform: trello
  description: "Adds a label to a card."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: idCard
      type: string
    - name: idLabel
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/cards/{{ get 'inputs.idCard' }}/idLabels"
      headers: "{{ platform.headers }}"
      query:
        value: "{{ get 'inputs.idLabel' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
