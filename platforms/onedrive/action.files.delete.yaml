meta:
  permissions: ["network:graph.microsoft.com"]
  id: onedrive.files.delete
  name: Delete File
  category: Files
  type: Action
  platform: onedrive
  description: Deletes a file or folder from Microsoft OneDrive.
  version: 1.0.0
  discovery:
    purpose: Permanently remove a file or directory in OneDrive.
    usage_context: Use this to clean up temporary assets, remove outdated reports, or manage account storage quotas. Use with caution as this is irreversible.
    agent_hints:
      - "Requires the explicit 'path' to the item (e.g. '/Temp/log.txt')."
      - "Deleting a folder will delete all its contents."
    waml_examples:
      - title: Cleanup Old Reports
        waml: |
          - step: delete_report
            call: onedrive.action.files.delete
            with:
               path: /Reports/Archive/2023.pdf

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: >-
        =platform.base_url + "/me/drive/items/" + inputs.file_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
