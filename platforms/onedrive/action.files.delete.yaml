meta:
  id: onedrive.files.delete
  name: Delete File
  category: Files
  type: Action
  platform: onedrive
  description: "Delete a file or folder in OneDrive."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: "{{ platform.base_url }}/me/drive/items/{{ get 'inputs.file_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
