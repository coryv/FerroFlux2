meta:
  permissions: ["network:graph.microsoft.com"]
  id: onedrive.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: onedrive
  description: "Upload a small file (up to 4MB) to OneDrive."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
    - name: file
      type: blob
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: item
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "{{ platform.base_url }}/me/drive/root:/{{ get 'inputs.path' }}:/content"
      headers:
        Authorization: "{{ platform.headers.Authorization }}"
        Content-Type: "application/octet-stream"
      body_type: binary
      body_var: "inputs.file"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item
          value: "{{ steps.request.response_body }}"
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
