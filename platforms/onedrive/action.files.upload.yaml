meta:
  permissions: ["network:graph.microsoft.com"]
  id: onedrive.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: onedrive
  description: Uploads a local file (blob reference) to Microsoft OneDrive.
  version: 1.0.0
  discovery:
    purpose: Store a local FerroFlux 'blob' in OneDrive for external sharing or backup.
    usage_context: Use this to share reports, images, or data within the Microsoft 365 environment. The file must be provided as a 'blob_id' generated by another step.
    agent_hints:
      - "The 'destination' must be the full path (e.g. '/Uploads/report.xlsx')."
      - "Will overwrite existing files by default."
    waml_examples:
      - title: Backup Invoice
        waml: |
          - step: backup_doc
            call: onedrive.action.files.upload
            with:
               file: =steps.generate_excel.blob_id
               destination: /Invoices/INV-1002.xlsx

interface:
  inputs:
    - name: Exec
      type: flow
    - name: path
      type: string
    - name: file
      type: blob
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: item
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/me/drive/root:'=/" + inputs.path + ":/content"'
      headers:
        Authorization: =platform.headers.Authorization
        Content-Type: >
          "application/octet-stream"
      body_type: binary
      body_var: =inputs.file
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item
          value: =steps.request.response_body
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
