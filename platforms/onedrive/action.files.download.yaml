meta:
  permissions: ["network:graph.microsoft.com"]
  id: onedrive.files.download
  name: Download File
  category: Files
  type: Action
  platform: onedrive
  description: "Download a file from OneDrive as a blob."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: blob

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/me/drive/items/{{ get 'inputs.file_id' }}/content"
      headers: "{{ platform.headers }}"
      response_type: blob
    returns:
      status: status_code
      body: response_blob

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_blob }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_blob }}"
