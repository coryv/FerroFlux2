meta:
  id: redis.keys.set
  name: Set Key
  category: Database
  type: Action
  platform: redis
  description: "Set the value of a key in Redis."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: key
      type: string
      required: true
    - name: value
      type: string
      required: true
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow


execution:
  - id: redis
    tool: redis_query
    params:
      connection_string: settings.connection_string
      operation: set
      key: inputs.key
      value: inputs.value

routing:
  match: steps.redis.status
  cases:
    default:
      - tool: emit
        params:
          port: Success
