meta:
  id: redis.keys.set
  name: Set Key
  category: Database
  type: Action
  platform: redis
  description: Sets the value of a single key in Redis.
  version: 1.0.0
  discovery:
    purpose: Store a value in the Redis in-memory cache.
    usage_context: Use this to save temporary state, cache API responses, or store tokens. Ideal for fast, short-term data persistence.
    agent_hints:
      - "If the key already exists, its value is overwritten."
      - "Values are stored as strings by default."
    waml_examples:
      - title: Cache User Session
        waml: |
          - step: cache_session
            call: redis.action.keys.set
            with:
               key: "session:user_456"
               value: active

interface:
  inputs:
    - name: Exec
      type: flow
    - name: key
      type: string
      required: true
    - name: value
      type: string
      required: true
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow


execution:
  - id: redis
    tool: redis_query
    params:
      connection_string: =settings.connection_string
      operation: set
      key: =inputs.key
      value: =inputs.value

routing:
  match: =steps.redis.status
  cases:
    default:
      - tool: emit
        params:
          port: Success
