meta:
  id: redis.key.set
  name: Set Key
  category: Database
  type: Action
  platform: redis
  description: "Sets the value of a single key in Redis, optionally with a TTL."
  version: "1.0.0"
  discovery:
    purpose: "Store a value in the Redis in-memory cache."
    usage_context: "Use this to save temporary state, cache API responses, or store tokens. Supports a Time-To-Live (TTL) to automatically expire data."
    agent_hints:
      - "If the key already exists, its value is overwritten."
      - "The 'ttl' is in seconds. Use this to prevent the database from filling up with stale data."
    waml_examples:
      - title: "Cache API Response"
        waml: |
          - step: cache_data
            call: redis.action.key.set
            with:
               key: "external_api:cache:123"
               value: steps.fetch_api.body
               ttl: 3600 # 1 hour

interface:
  inputs:
    - name: Exec
      type: flow
    - name: key
      type: string
    - name: value
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: connection
      label: Redis Connection
      type: connection_select
      required: true

execution:
  - id: query
    tool: redis_query
    params:
      connection_string: settings.connection
      operation: set
      key: inputs.key
      value: inputs.value
    returns:
      ok: success_flag

routing:
  cases:
    success:
      - tool: emit
        params:
          port: Success
