meta:
  id: redis.key.set
  name: Set Key
  category: Database
  type: Action
  platform: redis
  description: "Set the value of a key in Redis."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: key
      type: string
    - name: value
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: connection
      label: Redis Connection
      type: connection_select
      required: true

execution:
  - id: query
    tool: redis_query
    params:
      connection_string: settings.connection
      operation: set
      key: inputs.key
      value: inputs.value
    returns:
      ok: success_flag

routing:
  cases:
    success:
      - tool: emit
        params:
          port: Success
