meta:
  id: redis.key.get
  name: Get Key
  category: Database
  type: Action
  platform: redis
  description: "Retrieve the value of a key from Redis."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: key
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: value
      type: string
  settings:
    - name: connection
      label: Redis Connection
      type: connection_select
      required: true

execution:
  - id: query
    tool: redis_query
    params:
      connection_string: "{{ settings.connection }}"
      operation: get
      key: "{{ get 'inputs.key' }}"
    returns:
      value: key_value

routing:
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: value
          value: "{{ steps.query.key_value }}"
