meta:
  id: redis.keys.get
  name: Get Key
  category: Database
  type: Action
  platform: redis
  description: Gets the value of a single key from Redis.
  version: 1.0.0
  discovery:
    purpose: Retrieve a value associated with a specific key from the in-memory store.
    usage_context: Use this to fetch configuration flags, cached results, or temporary state with minimal latency.
    agent_hints:
      - "Returns 'null' if the key does not exist."
      - "Note that Redis values are typically strings unless otherwise parsed."
    waml_examples:
      - title: Get Cached Token
        waml: |
          - step: get_token
            call: =redis.action.keys.get
            with:
               key: "auth:token:user_123"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: key
      type: string
      required: true
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: value
      type: string

execution:
  - id: redis
    tool: redis_query
    params:
      connection_string: =settings.connection_string
      operation: get
      key: =inputs.key
    returns:
      value: value

routing:
  match: =steps.redis.status
  cases:
    default:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: value
          value: =steps.redis.value
