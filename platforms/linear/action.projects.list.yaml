meta:
  permissions: ["network:api.linear.app"]
  id: linear.projects.list
  name: List Projects
  category: Projects
  type: Action
  platform: linear
  description: Lists projects available in your Linear workspace.
  version: 1.0.0
  discovery:
    purpose: Browse and identify projects for organizing issues and roadmaps.
    usage_context: Use this to starting a project-specific automation, find a project's UUID by its name, or audit project health.
    agent_hints:
      - "Returns a list of projects with their names, UUIDs, and statuses."
      - "You can filter and sort results using GraphQL-style fragments."
    waml_examples:
      - title: List Projects
        waml: |
          - step: get_projs
            call: linear.action.projects.list
            with:
               first: 20

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: projects
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: >
          "query Projects { projects { nodes { id name state } } }"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: projects
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
