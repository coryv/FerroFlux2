meta:
  permissions: ["network:api.linear.app"]
  id: linear.projects.list
  name: List Projects
  category: Projects
  type: Action
  platform: linear
  description: "Lists all projects in Linear using GraphQL."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: projects
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: "query Projects { projects { nodes { id name state } } }"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: projects
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
