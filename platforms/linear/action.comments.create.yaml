meta:
  permissions: ["network:api.linear.app"]
  id: linear.comments.create
  name: Create Comment
  category: Comments
  type: Action
  platform: linear
  description: Adds a comment to an existing Linear issue.
  version: 1.0.0
  discovery:
    purpose: Communicate updates, provide feedback, or link external resources to a Linear issue.
    usage_context: Use this to log debugging results, attach deployment URLs, or notify engineers of customer feedback by mentioning them in a comment.
    agent_hints:
      - "Requires the 'issueId' (UUID)."
      - "Supports markdown for formatting."
    waml_examples:
      - title: Post Build Result
        waml: |
          - step: log_result
            call: linear.action.comments.create
            with:
               issueId: issue_uuid_123
               body: "Deployment successful to [Staging](https://staging.example.com)."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: issueId
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: comment
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: >
          "mutation CommentCreate($issueId: 'String!, $body: String!) { commentCreate(input: { issueId: $issueId, body: $body }) { success comment { id body } } }"'
        variables:
          issueId: =inputs.issueId
          body: =inputs.body
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: comment
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
