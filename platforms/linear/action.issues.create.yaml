meta:
  permissions: ["network:api.linear.app"]
  id: linear.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: linear
  description: "Creates a new issue in a Linear team."
  version: "1.0.0"
  discovery:
    purpose: "Add a new bug, feature, or task to a Linear engineering board."
    usage_context: "Use this to automate issue creation from customer feedback, bug reports, or sprint planning. Requires a 'teamId' and 'title'."
    agent_hints:
      - "Uses UUIDs for 'teamId', 'projectId', and 'assigneeId'."
      - "Returns the new issue object with its ID and identifier (e.g. 'ENG-123')."
    waml_examples:
      - title: "Create Bug Issue"
        waml: |
          - step: log_bug
            call: linear.action.issues.create
            with:
               teamId: "team_uuid_123"
               title: "High priority: Fix auth leak"
               description: "Found in production logs."
               priority: 1

interface:
  inputs:
    - name: Exec
      type: flow
    - name: teamId
      type: string
    - name: title
      type: string
    - name: description
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: >
          "mutation IssueCreate($teamId: String!, $title: String!, $description: String) { issueCreate(input: { teamId: $teamId, title: $title, description: $description }) { success issue { id title } } }"
        variables:
          teamId: inputs.teamId
          title: inputs.title
          description: inputs.description
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
