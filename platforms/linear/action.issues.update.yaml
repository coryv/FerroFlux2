meta:
  id: linear.issues.update
  name: Update Issue
  category: Issues
  type: Action
  platform: linear
  description: "Updates an issue in Linear using GraphQL."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
    - name: title
      type: string
    - name: stateId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: "mutation IssueUpdate($id: String!, $title: String, $stateId: String) { issueUpdate(id: $id, input: { title: $title, stateId: $stateId }) { success issue { id title state { name } } } }"
        variables:
          id: "{{ get 'inputs.id' }}"
          title: "{{ get 'inputs.title' }}"
          stateId: "{{ get 'inputs.stateId' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
