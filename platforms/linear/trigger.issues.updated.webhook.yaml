meta:
  permissions: ["network:api.linear.app"]
  id: linear.trigger.issues.updated.webhook
  name: Issue Updated (Webhook)
  category: Issues
  type: Trigger
  platform: linear
  description: Triggers in real-time when an existing Linear issue is modified (webhook).
  version: 1.0.0
  discovery:
    purpose: React instantly to status changes, assignments, or priority updates in Linear.
    usage_context: Use this for immediate Slack updates on issue progress or to trigger CI/CD pipelines when an issue is moved to a specific status.
    agent_hints:
      - "Requires a webhook URL to be configured in Linear."
      - "Provides the 'before' and 'after' state for detected changes."
    waml_examples:
      - title: Immediate Status Update
        waml: |
          trigger:
            issue_change:
               call: =linear.trigger.issues.updated.webhook
               with: {}

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: issue
      type: object
  settings:
    - name: webhook_secret
      label: Webhook Signing Secret
      type: string
      required: true
      description: The signing secret from your Linear webhook configuration.

execution:
  - id: verify
    tool: verify_signature
    params:
      body: =event.raw_body
      secret: =settings.webhook_secret
      signature: '=event.headers["linear-signature"]'
      algorithm: hmac-sha256
      encoding: hex
    returns:
      valid: is_valid

  - id: check_event
    tool: logic
    params:
      condition: >
        steps.verify.is_valid && event.body.action == "update" && event.body.type == "Issue"

routing:
  match: =steps.check_event.result
  cases:
    "true":
      - tool: emit
        params:
          port: issue
          value: =event.body.data
      - tool: emit
        params:
          port: Success
    "false": []
