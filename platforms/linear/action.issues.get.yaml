meta:
  permissions: ["network:api.linear.app"]
  id: linear.issues.get
  name: Get Issue
  category: Issues
  type: Action
  platform: linear
  description: "Retrieves detailed information about a Linear issue."
  version: "1.0.0"
  discovery:
    purpose: "Fetch the properties, status, and comments of a specific Linear issue."
    usage_context: "Use this when you have an Issue UUID and need to check its current state (Draft, In Progress, Done) or identify the Assignee."
    agent_hints:
      - "Requires the 'id' (UUID)."
      - "Returns the full issue object, including its team and project associations."
    waml_examples:
      - title: "Get Issue Details"
        waml: |
          - step: read_issue
            call: linear.action.issues.get
            with:
               id: "issue_uuid_123"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: >
          "query Issue($id: String!) { issue(id: $id) { id title description state { name } assignee { name } } }"
        variables:
          id: inputs.id
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
