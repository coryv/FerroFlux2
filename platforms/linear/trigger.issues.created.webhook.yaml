meta:
  permissions: ["network:api.linear.app"]
  id: linear.trigger.issues.created.webhook
  name: Issue Created (Webhook)
  category: Issues
  type: Trigger
  platform: linear
  description: "Triggers in real-time when a new issue is created in Linear (webhook)."
  version: "1.0.0"
  discovery:
    purpose: "React instantly to new bugs or tasks logged in Linear."
    usage_context: "Use this for time-sensitive notifications (e.g. Critical Bug alerts) or for maintaining real-time data syncs across platforms."
    agent_hints:
      - "Requires a webhook URL to be configured in Linear."
      - "Processes incoming JSON payloads from Linear's webhook system."
    waml_examples:
      - title: "Real-time Bug Alert"
        waml: |
          trigger:
            raw_bug:
               call: linear.trigger.issues.created.webhook
               with: {} 

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: issue
      type: object
  settings:
    - name: webhook_secret
      label: "Webhook Signing Secret"
      type: string
      required: true
      description: "The signing secret from your Linear webhook configuration."

execution:
  - id: verify
    tool: verify_signature
    params:
      body: event.raw_body
      secret: settings.webhook_secret
      signature: event.headers["linear-signature"]
      algorithm: hmac-sha256
      encoding: hex
    returns:
      valid: is_valid

  - id: check_event
    tool: logic
    params:
      condition: >
        steps.verify.is_valid && event.body.action == "create" && event.body.type == "Issue"

routing:
  match: steps.check_event.result
  cases:
    "true":
      - tool: emit
        params:
          port: issue
          value: event.body.data
      - tool: emit
        params:
          port: Success
    "false": []
