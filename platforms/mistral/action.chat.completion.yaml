meta:
  id: mistral.chat.completion
  name: Chat Completion
  category: LLM
  type: Action
  platform: mistral
  description: "Generate text using Mistral models."
  version: "1.0.0"
  permissions:
    - "network:api.mistral.ai"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
      default: "mistral-tiny"
    - name: messages
      type: array
    - name: temperature
      type: number
      default: 0.7
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: text
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/chat/completions"
      headers: "{{ platform.headers }}"
      body:
        model: "{{ get 'inputs.model' }}"
        messages: "{{ inputs.messages }}"
        temperature: "{{ get 'inputs.temperature' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

  - id: extract_text
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/choices/0/message/content"
    returns:
      result: content

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: text
          value: "{{ steps.extract_text.content }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
