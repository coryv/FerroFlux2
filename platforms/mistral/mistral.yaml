meta:
  id: mistral
  name: Mistral
  type: Platform
  category: AI/ML
  description: "Connects to the Mistral AI API."
  version: "1.0.0"
  permissions:
    - "network:api.mistral.ai"

config:
  base_url: "https://api.mistral.ai/v1"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_API_KEY_HERE"

settings:
  - name: api_key
    label: "API Key"
    type: string
    required: true
