meta:
  id: mistral
  name: Mistral
  type: Platform
  category: AI/ML
  description: "European high-performance AI models for developers."
  version: "1.0.0"
  discovery:
    purpose: "Access Mistral Large and Pixtral models with strong reasoning and multi-lingual support."
    usage_context: "Great alternative to GPT models for enterprise-grade reasoning and localized AI tasks."
    agent_hints:
      - "Strong performance in French and other European languages."
      - "Often more cost-effective for medium-complexity tasks."
  permissions:
    - "network:api.mistral.ai"

config:
  base_url: "https://api.mistral.ai/v1"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_API_KEY_HERE"

settings:
  - name: api_key
    label: "API Key"
    type: string
    required: true
