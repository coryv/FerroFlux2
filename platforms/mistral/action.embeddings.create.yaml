meta:
  id: mistral.embeddings.create
  name: Create Embeddings
  category: Embeddings
  type: Action
  platform: mistral
  description: "Generate embeddings for a given input text."
  version: "1.0.0"
  permissions:
    - "network:api.mistral.ai"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
      default: "mistral-embed"
    - name: input
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: embeddings
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/embeddings"
      headers: "{{ platform.headers }}"
      body:
        model: "{{ get 'inputs.model' }}"
        input: "{{ inputs.input }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: embeddings
          value: "{{ steps.request.response_body.data }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
