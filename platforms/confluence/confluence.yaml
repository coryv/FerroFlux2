meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence
  name: Confluence
  type: Platform
  category: Productivity
  description: "Connects to the Atlassian Confluence Cloud REST API v2."
  version: "1.0.0"
  discovery:
    purpose: "Collaborate on and manage wiki-style documentation and knowledge bases in Atlassian Confluence."
    usage_context: "Use this to automate documentation updates, synchronize project requirements, and manage internal wiki content."
    agent_hints:
      - "Requires an Atlassian Cloud domain and OAuth2 authentication."
      - "Uses Confluence REST API v2 (Atlassian Document Format for content)."

config:
  base_url: >
    "https://" + settings.domain + ".atlassian.net/wiki/api/v2"
  headers:
    Authorization: >
      "Bearer " + settings.connection.access_token
    Content-Type: "application/json"
    Accept: "application/json"

settings:
  - name: domain
    label: "Atlassian Domain (e.g. mycompany)"
    type: string
    required: true
  - name: connection
    label: "Atlassian Connection"
    type: oauth2
    required: true
