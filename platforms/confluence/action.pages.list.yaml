meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.pages.list
  name: List Pages
  category: Pages
  type: Action
  platform: confluence
  description: Retrieve a list of pages, optionally filtered by space.
  version: 1.0.0
  discovery:
    purpose: Search and retrieve a list of Confluence pages.
    usage_context: Use this to find existing documentation for updates, audits, or linking in other tools.
    agent_hints:
      - "Supports searching by space, title, or CQL (Confluence Query Language)."
    waml_examples:
      - title: List Space Pages
        waml: |
          - step: get_pages
            call: confluence.action.pages.list
            with:
               spaceId: 543216789
               limit: 20

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
    - name: limit
      type: number
      default: 20
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: pages
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/pages"
      headers: =platform.headers
      query:
        spaceId: =inputs.space_id
        limit: >
          (has(inputs.limit) ? inputs.limit : '20')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: pages
          value: =steps.request.response_body.results
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
