meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.pages.get
  name: Get Page
  category: Pages
  type: Action
  platform: confluence
  description: "Retrieve details for a specific Confluence page."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve the full content and metadata for a specific Confluence page."
    usage_context: "Use this to fetch current page content for summarization, archiving, or audit purposes."
    agent_hints:
      - "Requires a pageId."
      - "Returns the page object including title, status, and body (Atlas Document Format)."
    waml_examples:
      - title: "Fetch Page Content"
        waml: |
          - step: get_page
            call: confluence.action.pages.get
            with:
               pageId: "123456789"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/pages/" + inputs.page_id
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
