meta:
  id: confluence.spaces.list
  name: List Spaces
  category: Spaces
  type: Action
  platform: confluence
  description: "Retrieve a list of Confluence spaces."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: limit
      type: number
      default: 20
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: spaces
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/spaces"
      headers: "{{ platform.headers }}"
      query:
        limit: "{{ get 'inputs.limit' '20' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: spaces
          value: "{{ steps.request.response_body.results }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
