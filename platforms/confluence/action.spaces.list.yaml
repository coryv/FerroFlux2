meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.spaces.list
  name: List Spaces
  category: Spaces
  type: Action
  platform: confluence
  description: "Retrieve a list of Confluence spaces."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve a list of all Confluence spaces that the authenticated user can access."
    usage_context: "Use to find space IDs for creating or listing pages, or for auditing project distribution."
    agent_hints:
      - "Returns an array of space objects including name, key, and id."
    waml_examples:
      - title: "List Spaces"
        waml: |
          - step: get_spaces
            call: confluence.action.spaces.list
            with:
               limit: 20
               type: "global"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: limit
      type: number
      default: 20
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: spaces
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/spaces"
      headers: platform.headers
      query:
        limit: >
          (has(inputs.limit) ? inputs.limit : '20')
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: spaces
          value: steps.request.response_body.results
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
