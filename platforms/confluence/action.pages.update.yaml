meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.pages.update
  name: Update Page
  category: Pages
  type: Action
  platform: confluence
  description: Update the title or body of an existing page.
  version: 1.0.0
  discovery:
    purpose: Modify the title or content of an existing Confluence page.
    usage_context: Use to automate ongoing project status updates, append notes, or keep technical documentation in sync with code changes.
    agent_hints:
      - "Requires pageId, new title, and updated body content."
    waml_examples:
      - title: Update Page Content
        waml: |
          - step: update_page
            call: confluence.action.pages.update
            with:
               pageId: 123456789
               title: Updated Project Specs
               body: "<h1>New Specifications</h1><p>Status: Updated</p>"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
    - name: version
      type: number
    - name: title
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >-
        =platform.base_url + "/pages/" + inputs.page_id
      headers: =platform.headers
      body:
        id: inputs.page_id
        version:
          number: =inputs.version
        title: =inputs.title
        body:
          storage:
            value: >
              "<p>" + inputs.body + "</p>"
            representation: storage
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
