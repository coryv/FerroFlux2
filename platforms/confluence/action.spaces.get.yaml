meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.spaces.get
  name: Get Space Info
  category: Spaces
  type: Action
  platform: confluence
  description: Retrieve details for a specific Confluence space.
  version: 1.0.0
  discovery:
    purpose: Retrieve detailed metadata for a specific Confluence space.
    usage_context: Use this to verify space keys, check space permissions, or fetch space-specific settings.
    agent_hints:
      - "Requires a spaceId."
      - "Returns the full space object."
    waml_examples:
      - title: Get Space Info
        waml: |
          - step: fetch_space
            call: confluence.action.spaces.get
            with:
               spaceId: 123456789

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: space
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/spaces/" + inputs.space_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: space
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
