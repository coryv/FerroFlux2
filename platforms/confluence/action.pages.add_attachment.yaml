meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.pages.add_attachment
  name: Add Attachment
  category: Pages
  type: Action
  platform: confluence
  description: Add a file attachment to a Confluence page.
  version: 1.0.0
  discovery:
    purpose: Upload a file as an attachment to a specific Confluence page.
    usage_context: Use to attach PDF reports, images, or log files generated during a workflow to relevant project documentation.
    agent_hints:
      - "Requires pageId and a file object (URL or file stream)."
    waml_examples:
      - title: Attach Report
        waml: |
          - step: upload
            call: confluence.action.pages.add_attachment
            with:
               pageId: 123456789
               file: =steps.generate_pdf.output
               comment: Daily automated report.
               minorEdit: true

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
    - name: attachment
      type: string # Blob ID / SecureTicket
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        ="https://" + settings.domain + ".atlassian.net/wiki/rest/api/content/" + inputs.page_id + "/child/attachment"
      headers:
        Authorization: >
          "Bearer " + settings.connection.access_token
        X-Atlassian-Token: nocheck
        Content-Type: >
          "multipart/form-data"
      body:
        file:
          ticket: =inputs.attachment
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
