meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.trigger.pages.updated
  name: Page Updated
  category: Pages
  type: Trigger
  platform: confluence
  description: Polls Confluence for recently updated pages.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow whenever a Confluence page is modified.
    usage_context: Use to track documentation changes, notify stakeholders of wiki updates, or sync content to other knowledge management tools.
    agent_hints:
      - "Provides information on the modified page and the user who made the changes."
    waml_examples:
      - title: Page Update Sync
        waml: |
          - step: log_change
            type: trigger
            call: =confluence.trigger.pages.updated

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: page
      type: object
  settings:
    - name: space_id
      label: Space ID (Optional)
      type: string
    - name: limit
      label: Batch Limit
      type: number
      default: 20

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/pages"
      headers: =platform.headers
      query:
        spaceId: =settings.space_id
        sort: >
          "-modified-date"
        limit: >
          (has(settings.limit) ? settings.limit : '20')
    returns:
      status: status_code
      body: response_body

  - id: extract_pages
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/results"
    returns:
      pages: pages_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_pages.pages_array
          cursor_key: version.number
          port: page
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
