meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.comments.add
  name: Add Comment to Page
  category: Pages
  type: Action
  platform: confluence
  description: "Add a comment to a specific Confluence page."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: page_id
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/comments"
      headers: platform.headers
      body:
        pageId: inputs.page_id
        body:
          storage:
            value: >
              "<p>" + inputs.body + "</p>"
            representation: storage
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
