meta:
  id: confluence.pages.create
  name: Create Page
  category: Pages
  type: Action
  platform: confluence
  description: "Create a new page in a Confluence space."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
    - name: title
      type: string
    - name: body
      type: string
    - name: parent_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/pages"
      headers: "{{ platform.headers }}"
      body:
        spaceId: "{{ get 'inputs.space_id' }}"
        title: "{{ get 'inputs.title' }}"
        parentId: "{{ get 'inputs.parent_id' }}"
        body:
          storage:
            value: "<p>{{ get 'inputs.body' }}</p>" # Simple HTML wrapper
            representation: "storage"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
