meta:
  permissions: ["network:*.atlassian.net"]
  id: confluence.pages.create
  name: Create Page
  category: Pages
  type: Action
  platform: confluence
  description: Create a new page in a Confluence space.
  version: 1.0.0
  discovery:
    purpose: Create a new page in a specific Confluence space.
    usage_context: Use to generate project status reports, documentation from code templates, or meeting minute summaries.
    agent_hints:
      - "Requires spaceId, title, and body content."
    waml_examples:
      - title: Create Report Page
        waml: |
          - step: write_page
            call: confluence.action.pages.create
            with:
               spaceId: 543216789
               title: Monthly Project Report
               body: "<h1>Report</h1><p>Status: Green</p>"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: space_id
      type: string
    - name: title
      type: string
    - name: body
      type: string
    - name: parent_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: page
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/pages"
      headers: =platform.headers
      body:
        spaceId: =inputs.space_id
        title: =inputs.title
        parentId: =inputs.parent_id
        body:
          storage:
            value: >
              "\"<p>" + inputs.body + "</p>\" # Simple HTML wrapper"
            representation: storage
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: page
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
