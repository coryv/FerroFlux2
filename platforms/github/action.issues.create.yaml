meta:
  permissions: ["network:api.github.com"]
  id: github.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: github
  description: "Create a new issue in a GitHub repository."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: owner
      type: string
    - name: repo
      type: string
    - name: title
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings:
    - name: labels
      label: "Labels (comma-separated)"
      type: string
      required: false
      placeholder: "bug,enhancement"
    - name: assignees
      label: "Assignees (comma-separated usernames)"
      type: string
      required: false
      placeholder: "octocat,hubot"

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/repos/" + inputs.owner + "/" + inputs.repo + "/issues"
      headers: platform.headers
      body:
        title: inputs.title
        body: inputs.body
        labels: settings.labels
        assignees: settings.assignees
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
