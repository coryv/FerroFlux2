meta:
  permissions: ["network:api.github.com"]
  id: github.repos.list
  name: List Repositories
  category: Repositories
  type: Action
  platform: github
  description: "List repositories for a user or organization."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: owner
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: repos
      type: array
  settings:
    - name: owner_type
      label: "Owner Type"
      type: select
      required: true
      default: "users"
      options:
        - label: "User"
          value: "users"
        - label: "Organization"
          value: "orgs"
    - name: per_page
      label: "Results Per Page"
      type: number
      default: 30
      min: 1
      max: 100
    - name: page
      label: "Page"
      type: number
      default: 1
      min: 1
    - name: sort
      label: "Sort By"
      type: select
      default: "updated"
      options:
        - label: "Updated"
          value: "updated"
        - label: "Created"
          value: "created"
        - label: "Pushed"
          value: "pushed"
        - label: "Full Name"
          value: "full_name"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/" + settings.owner_type + "/" + inputs.owner + "/repos?per_page=" + settings.per_page + "&page=" + settings.page + "&sort=" + settings.sort
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: repos
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
