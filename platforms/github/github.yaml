meta:
  permissions: ["network:api.github.com"]
  id: github
  name: GitHub
  type: Platform
  category: Developer Tools
  description: "The world's leading platform for software development and version control."
  version: "1.0.0"
  discovery:
    purpose: "Manage repositories, pull requests, issues, and CI/CD workflows."
    usage_context: "Use this to automate software delivery, track bugs, and manage code changes across team projects."
    agent_hints:
      - "Requires personal access tokens or OAuth for authentication."
      - "Supports webhooks for real-time CI/CD and repository events."

config:
  base_url: "https://api.github.com"
  headers:
    Content-Type: "application/json"
    Accept: "application/vnd.github+json"
    X-GitHub-Api-Version: "2022-11-28"
    Authorization: "Bearer PASTE_YOUR_TOKEN_HERE"

settings:
  - name: api_key
    label: "Personal Access Token"
    type: string
    required: true
