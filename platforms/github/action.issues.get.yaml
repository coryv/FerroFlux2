meta:
  permissions: ["network:api.github.com"]
  id: github.issues.get
  name: Get Issue
  category: Issues
  type: Action
  platform: github
  description: "Retrieves detailed information about a GitHub issue."
  version: "1.0.0"
  discovery:
    purpose: "Fetch the properties, status, and comments of a specific repository issue."
    usage_context: "Use this to check issue status (Open, Closed), read developer comments, or identify the current assignees before performing an update."
    agent_hints:
      - "Requires 'owner', 'repo', and the 'issue_number' (integer)."
      - "Returns the full issue object, including its labels, milestone, and state changes."
    waml_examples:
      - title: "Get Issue Details"
        waml: |
          - step: read_issue
            call: github.action.issues.get
            with:
               owner: "octocat"
               repo: "hello-world"
               issue_number: 123

interface:
  inputs:
    - name: Exec
      type: flow
    - name: owner
      type: string
    - name: repo
      type: string
    - name: issue_number
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/repos/" + inputs.owner + "/" + inputs.repo + "/issues/" + inputs.issue_number
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
