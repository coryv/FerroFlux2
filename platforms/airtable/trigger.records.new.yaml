meta:
  permissions: ["network:api.airtable.com"]
  id: airtable.trigger.records.new
  name: New Record
  category: Records
  type: Trigger
  platform: airtable
  description: Triggers when a new record is created in an Airtable table.
  version: 1.0.0
  discovery:
    purpose: Monitor an Airtable table for new entries.
    usage_context: Use this to start a workflow whenever a new row is added. Ideal for lead capture, task assignment, or data synchronization.
    agent_hints:
      - "This trigger polls Airtable every 5 minutes by default."
      - "Ensure the table has a 'Created' time field for reliable sorting/detection if possible, though Airtable handles this internally."
      - "The payload includes all fields from the new record."
    waml_examples:
      - title: Trigger on New Lead
        waml: |
          trigger:
            id: airtable_new_lead
            call: airtable.trigger.records.new
            with:
              base_id: app123456789
              table_id_or_name: Leads

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: record
      type: object
  settings:
    - name: base_id
      label: Base ID
      type: string
      required: true
    - name: table_name
      label: Table Name
      type: string
      required: true
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/" + settings.base_id + "/" + settings.table_name
      headers: =platform.headers
      query:
        sort[0][field]: "Created Time"
        sort[0][direction]: asc
        filterByFormula: >
          has(event.cursor) ? "IS_AFTER(CREATED_TIME(), '" + event.cursor + "')" : "1=1"
        pageSize: 50
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.query.response_body.records
          cursor_key: createdTime
          port: record
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.query.response_body
