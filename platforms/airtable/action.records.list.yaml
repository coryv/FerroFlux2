meta:
  permissions: ["network:api.airtable.com"]
  id: airtable.records.list
  name: List Records
  category: Records
  type: Action
  platform: airtable
  description: "Lists records in a table with pagination and filtering."
  version: "1.0.0"
  discovery:
    purpose: "Retrieve a list of records from a specific Airtable base and table."
    usage_context: "Use to fetch CRM data, inventory lists, or task status updates for reporting and processing."
    agent_hints:
      - "Requires baseId and tableIdOrName."
      - "Supports the 'filterByFormula' parameter for server-side filtering."
    waml_examples:
      - title: "List Open Tasks"
        waml: |
          - step: fetch_tasks
            call: airtable.action.records.list
            with:
               baseId: "app12345"
               tableIdOrName: "Tasks"
               filterByFormula: "{Status} = 'Done'"
               maxRecords: 100

interface:
  inputs:
    - name: Exec
      type: flow
    - name: base_id
      type: string
    - name: table_id_or_name
      type: string
    - name: filterByFormula
      type: string
    - name: maxRecords
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: records
      type: array
  settings: []

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >
        platform.base_url + "/" + inputs.base_id + "/" + inputs.table_id_or_name
      headers: platform.headers
      strategy: cursor
      cursor_param: offset
      query:
        filterByFormula: inputs.filterByFormula
        maxRecords: inputs.maxRecords
    returns:
      items: records
      total_pages: page_count
      total_items: item_count

  - id: check_status
    tool: switch
    params:
      value: 200
      cases:
        - condition: 200
          output: success

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: records
          value: steps.request.records
