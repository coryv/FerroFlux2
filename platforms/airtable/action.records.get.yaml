meta:
  id: airtable.records.get
  name: Get Record
  category: Records
  type: Action
  platform: airtable
  description: "Retrieves a single record by its ID."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: base_id
      type: string
    - name: table_id_or_name
      type: string
    - name: record_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: record
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/{{ get 'inputs.base_id' }}/{{ get 'inputs.table_id_or_name' }}/{{ get 'inputs.record_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: record
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
