meta:
  permissions: ["network:api.airtable.com"]
  id: airtable.records.delete
  name: Delete Record
  category: Records
  type: Action
  platform: airtable
  description: Deletes a single record in a table.
  version: 1.0.0
  discovery:
    purpose: Permanently delete a single record from a specific Airtable base and table.
    usage_context: Use to cleanup old entries, remove canceled orders, or manage the lifecycle of temporary records.
    agent_hints:
      - "Requires a valid recordId."
      - "Deletion is immediate."
    waml_examples:
      - title: Remove Record
        waml: |
          - step: delete
            call: airtable.action.records.delete
            with:
               baseId: app12345
               tableIdOrName: Leads
               recordId: rec12345

interface:
  inputs:
    - name: Exec
      type: flow
    - name: base_id
      type: string
    - name: table_id_or_name
      type: string
    - name: record_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =response
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/" + inputs.base_id + "/" + inputs.table_id_or_name + "/" + inputs.record_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =response
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
