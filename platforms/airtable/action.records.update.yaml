meta:
  permissions: ["network:api.airtable.com"]
  id: airtable.records.update
  name: Update Record
  category: Records
  type: Action
  platform: airtable
  description: "Updates a single record in a table."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: base_id
      type: string
    - name: table_id_or_name
      type: string
    - name: record_id
      type: string
    - name: fields
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: record
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: >
        platform.base_url + "/" + inputs.base_id + "/" + inputs.table_id_or_name + "/" + inputs.record_id
      headers: platform.headers
      body:
        fields: inputs.fields
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: record
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
