meta:
  id: pipedrive
  name: "Pipedrive"
  category: "CRM"
  type: Platform
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/pipedrive.svg"
  permissions: ["network:api.pipedrive.com"]

config:
  base_url: "https://api.pipedrive.com/v1"
  auth_type: "oauth2"
  auth:
    type: "bearer"
  connection_schema:
    - name: "api_token"
      type: "string"
      required: false
      is_secret: true
      description: "Personal API Token (can be used as api_token param)"
