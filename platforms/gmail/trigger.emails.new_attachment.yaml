meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.trigger.emails.new_attachment
  name: New Attachment
  category: Emails
  type: Trigger
  platform: gmail
  description: Triggers when a new email containing one or more attachments is received.
  version: 1.0.0
  discovery:
    purpose: Monitor an inbox for any new message that includes a file attachment.
    usage_context: "Use this for automated document pipelines, such as saving incoming PDFs to a cloud drive or scanning email attachments for malware. This is a shorthand for a 'matching_search' trigger with 'has:attachment'."
    agent_hints:
      - "The 'message' output contains the message ID and thread ID. Use 'gmail.emails.get' to retrieve the list of actual attachments and their IDs."
    waml_examples:
      - title: Monitor All New Attachments
        waml: |
          trigger:
            id: attachment_listener
            call: =gmail.trigger.emails.new_attachment
            with:
               limit: 10

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
  settings:
    - name: limit
      label: Batch Limit
      type: number
      default: 10

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/messages"
      headers: =platform.headers
      query:
        q: >
          "has:'attachment"'
        maxResults: >
          (has(settings.limit) ? settings.limit : '10')
    returns:
      status: status_code
      body: response_body

  - id: extract_messages
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/messages"
    returns:
      messages: messages_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_messages.messages_array
          cursor_key: id
          port: message
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
