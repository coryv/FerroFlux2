meta:
  id: gmail.trigger.emails.new_attachment
  name: New Attachment
  category: Emails
  type: Trigger
  platform: gmail
  description: "Polls for new emails that contain attachments."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
  settings:
    - name: limit
      label: "Batch Limit"
      type: number
      default: 10

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/messages"
      headers: "{{ platform.headers }}"
      query:
        q: "has:attachment"
        maxResults: "{{ get 'settings.limit' '10' }}"
    returns:
      status: status_code
      body: response_body

  - id: extract_messages
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/messages"
    returns:
      messages: messages_array

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: iterate
        params:
          items: "{{ steps.extract_messages.messages_array }}"
          cursor_key: "id"
          port: message
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
