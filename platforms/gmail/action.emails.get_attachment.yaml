meta:
  id: gmail.emails.get_attachment
  name: Get Attachment
  category: Emails
  type: Action
  platform: gmail
  description: "Retrieve a specific attachment from an email and store it in the BlobStore."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
    - name: attachment_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: blob_id
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/messages/{{ get 'inputs.message_id' }}/attachments/{{ get 'inputs.attachment_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: blob_id
          value: "{{ steps.request.response_body.data }}" # This is base64 encoded by Gmail
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
