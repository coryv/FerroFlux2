meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.emails.remove_label
  name: Remove Label
  category: Emails
  type: Action
  platform: gmail
  description: Removes a specific label from a Gmail message.
  version: 1.0.0
  discovery:
    purpose: Untag a Gmail message.
    usage_context: Use this to clean up labels after a multi-step process or to remove a message from a specific automated watch-list.
    agent_hints:
      - "Does not delete the message; only removes the specified label reference."
    waml_examples:
      - title: Clear Processed Label
        waml: |
          - step: untag
            call: =gmail.emails.remove_label
            with:
               message_id: 18e986fe...
               label_id: Label_Processing

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
    - name: label_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/messages/" + inputs.message_id + "/modify"
      headers: =platform.headers
      body:
        removeLabelIds: >
          "[\"" + inputs.label_id + "\"]"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
