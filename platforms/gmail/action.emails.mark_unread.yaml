meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.emails.mark_unread
  name: Mark as Unread
  category: Emails
  type: Action
  platform: gmail
  description: Marks a specific Gmail message as unread.
  version: 1.0.0
  discovery:
    purpose: Reset the read status of a Gmail message.
    usage_context: Use this if an automation fails to process a message and you want a human to see it as 'new' in their inbox.
    agent_hints:
      - "Technically adds the 'UNREAD' system label to the message."
    waml_examples:
      - title: Failed Processing Alert
        waml: |
          - step: flag_for_human
            call: gmail.emails.mark_unread
            with:
               message_id: 18e986fe...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: message_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/messages/" + inputs.message_id + "/modify"
      headers: =platform.headers
      body:
        addLabelIds: >
          "[\"UNREAD\"]"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
