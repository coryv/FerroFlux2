meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.trigger.emails.new_matching_search
  name: New Email Matching Search
  category: Emails
  type: Trigger
  platform: gmail
  description: "Triggers when a new email matches a specific Gmail search query."
  version: "1.0.0"
  discovery:
    purpose: "Continuously monitor an inbox for messages that meet specific criteria."
    usage_context: "Use this as the start of an automation for incoming invoices, customer feedback, or alerts. You can specify complex filters like 'from:alerts@system.com is:unread label:cloud-alerts'."
    agent_hints:
      - "This trigger polls for new IDs that match the query and haven't been seen by the cursor yet."
      - "Ensure the query is as specific as possible to avoid triggering on irrelevant messages."
    waml_examples:
      - title: "Watch for Unread Invoices"
        waml: |
          trigger:
            id: invoice_watcher
            call: gmail.trigger.emails.new_matching_search
            with:
               query: "is:unread label:invoices"
               limit: 5

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: message
      type: object
  settings:
    - name: query
      label: "Search Query (e.g. from:boss@company.com is:unread)"
      type: string
    - name: limit
      label: "Batch Limit"
      type: number
      default: 10

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/messages"
      headers: platform.headers
      query:
        q: settings.query
        maxResults: >
          (has(settings.limit) ? settings.limit : '10')
    returns:
      status: status_code
      body: response_body

  - id: extract_messages
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/messages"
    returns:
      messages: messages_array

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: steps.extract_messages.messages_array
          cursor_key: id
          port: message
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
