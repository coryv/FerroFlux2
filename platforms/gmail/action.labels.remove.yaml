meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.labels.remove
  name: Delete Label
  category: Labels
  type: Action
  platform: gmail
  description: Permanently delete a user label from the Gmail account.
  version: 1.0.0
  discovery:
    purpose: Permanently remove a label from the entire Gmail account.
    usage_context: Use this to clean up temporary labels or manage the account's organizational structure. This does NOT delete the messages, but it removes the label from all of them.
    agent_hints:
      - "This operation is irreversible. Ensure the correct 'label_id' is provided."
      - "System labels (e.g. 'INBOX', 'TRASH') cannot be deleted."
    waml_examples:
      - title: Cleanup Temporary Label
        waml: |
          - step: delete_temp_label
            call: =gmail.labels.remove
            with:
               label_id: Label_12345

interface:
  inputs:
    - name: Exec
      type: flow
    - name: label_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/labels/" + inputs.label_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
