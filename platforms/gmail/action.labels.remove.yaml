meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.labels.remove
  name: Delete Label
  category: Labels
  type: Action
  platform: gmail
  description: "Permanently delete a user label."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: label_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: "{{ platform.base_url }}/labels/{{ get 'inputs.label_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
