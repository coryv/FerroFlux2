meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail
  name: Gmail
  type: Platform
  category: Communication
  description: Connects to the Gmail API for sending and managing emails.
  version: 1.0.0
  discovery:
    purpose: Email messaging and inbox management.
    usage_context: Use Gmail for formal communication, sending reports, or automated processing of incoming attachments and notifications. Best for longer-form, asynchronous messaging.
    agent_hints:
      - "Gmail Search uses the same query syntax as the Gmail web UI (e.g., 'has:"attachment label:unread').\\\""
      - "When sending mail, ensure the 'to' address is a valid email format."
      - "Thread IDs and Message IDs are distinct; use Message ID for most individual operations."

config:
  base_url: "https://gmail.googleapis.com/gmail/v1"
  auth_type: OAuth2
  headers: {}
  scopes:
    - "https:'//www.googleapis.com/auth/gmail.send"'
    - "https:'//www.googleapis.com/auth/gmail.readonly"'

settings:
  - name: client_id
    label: Client ID
    type: string
    required: true
  - name: client_secret
    label: Client Secret
    type: string
    required: true
