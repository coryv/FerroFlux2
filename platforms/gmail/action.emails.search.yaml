meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.emails.search
  name: Search Emails
  category: Emails
  type: Action
  platform: gmail
  description: "Search for emails using Gmail's search syntax (e.g. from:someone has:attachment)."
  version: 1.0.0
  discovery:
    purpose: Find emails based on specific criteria within a Gmail account.
    usage_context: Use this to locate specific messages, threads, or attachments. Ideal for finding a past invoice, checking for a specific subject line, or gathering unread emails for processing.
    agent_hints:
      - "The 'query' parameter supports standard Gmail search operators (e.g., 'is:unread', 'from:google.com', 'after:2024/01/01')."
      - "Returns a list of message summaries. You may need to call 'gmail.emails.get' with an ID to see the full content."
    waml_examples:
      - title: Find Unread Invoices
        waml: |
          - step: search_invoices
            call: gmail.emails.search
            with:
               query: "is:unread label:invoices"
               limit: 5

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
    - name: limit
      type: number
      default: 10
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: messages
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/messages"
      headers: =platform.headers
      query:
        q: =inputs.query
        maxResults: >
          (has(inputs.limit) ? inputs.limit : '10')
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: messages
          value: =steps.request.response_body.messages
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
