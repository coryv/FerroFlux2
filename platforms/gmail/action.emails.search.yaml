meta:
  permissions: ["network:gmail.googleapis.com"]
  id: gmail.emails.search
  name: Search Emails
  category: Emails
  type: Action
  platform: gmail
  description: "Search for emails using Gmail's search syntax (e.g. from:someone has:attachment)."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
    - name: limit
      type: number
      default: 10
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: messages
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/messages"
      headers: "{{ platform.headers }}"
      query:
        q: "{{ get 'inputs.query' }}"
        maxResults: "{{ get 'inputs.limit' '10' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: messages
          value: "{{ steps.request.response_body.messages }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
