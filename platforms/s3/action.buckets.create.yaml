meta:
  permissions: ["network:*.amazonaws.com"]
  id: s3.buckets.create
  name: Create Bucket
  category: Buckets
  type: Action
  platform: s3
  description: "Creates a new S3 bucket in a specified region."
  version: "1.0.0"
  discovery:
    purpose: "Provision a new storage container in AWS S3."
    usage_context: "Use this to create isolated storage for new projects, customers, or environments. Note that bucket names must be globally unique across all AWS."
    agent_hints:
      - "Bucket names must be DNS-compliant (lowercase, no spaces, 3-63 characters)."
      - "Requires appropriate IAM permissions (s3:CreateBucket)."
    waml_examples:
      - title: "Create Project Bucket"
        waml: |
          - step: mk_bucket
            call: s3.action.buckets.create
            with:
               bucket: "my-app-logs-2024"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: region
      label: "Region"
      type: string
      required: true
      default: "us-east-1"

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >
        "https://" + inputs.bucket + ".s3." + settings.region + ".amazonaws.com/"
      aws_auth:
        service: s3
        region: settings.region
        access_key: settings.access_key
        secret_key: settings.secret_key
      body_type: binary
      content_type: >
        "application/xml"
      body:
        CreateBucketConfiguration:
          LocationConstraint: settings.region
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
