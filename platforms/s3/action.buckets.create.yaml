meta:
  permissions: ["network:*.amazonaws.com"]
  id: s3.buckets.create
  name: Create Bucket
  category: Buckets
  type: Action
  platform: s3
  description: "Create a new S3 bucket."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: region
      label: "Region"
      type: string
      required: true
      default: "us-east-1"

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: "https://{{ get 'inputs.bucket' }}.s3.{{ get 'settings.region' }}.amazonaws.com/"
      aws_auth:
        service: "s3"
        region: "{{ get 'settings.region' }}"
        access_key: "{{ get 'settings.access_key' }}"
        secret_key: "{{ get 'settings.secret_key' }}"
      body_type: binary
      content_type: "application/xml"
      body:
        CreateBucketConfiguration:
          LocationConstraint: "{{ get 'settings.region' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
