meta:
  permissions: ["network:*.amazonaws.com"]
  id: s3.objects.upload
  name: Upload Object
  category: Objects
  type: Action
  platform: s3
  description: Uploads a local file (blob reference) to an S3 bucket.
  version: 1.0.0
  discovery:
    purpose: Transfer a local FerroFlux 'blob' to the AWS S3 cloud storage.
    usage_context: Use this to backup data, share reports, or host static assets in production. The file must be provided as a 'blob_id' generated by another step.
    agent_hints:
      - "Bucket names must be globally unique."
      - "The 'key' is the full path (e.g. 'uploads/image.png')."
      - "Overwrites existing objects by default."
    waml_examples:
      - title: Upload Daily Backup
        waml: |
          - step: backup_db
            call: s3.action.objects.upload
            with:
               bucket: my-backups
               key: daily/db_dump.sql
               file: =steps.dump_db.blob_id
               content_type: application/sql

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
    - name: key
      type: string
    - name: file
      type: blob
    - name: content_type
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings:
    - name: region
      label: Region
      type: string
      required: true
      default: us-east-1

execution:
  - id: request
    tool: http_client
    params:
      method: PUT
      url: >-
        ="https://" + inputs.bucket + ".s3." + settings.region + ".amazonaws.com/" + inputs.key
      body_type: binary
      body_var: =inputs.file
      content_type: =inputs.content_type
      aws_auth:
        service: s3
        region: =settings.region
        access_key: =settings.access_key
        secret_key: =settings.secret_key

    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    "201":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
