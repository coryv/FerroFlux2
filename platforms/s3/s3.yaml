meta:
  id: s3
  name: AWS S3
  type: Platform
  category: Storage
  description: "Connects to the AWS S3 REST API using Signature Version 4."
  version: "1.0.0"

config:
  base_url: "https://s3.amazonaws.com"
  headers:
    Content-Type: "application/json"

settings:
  - name: access_key
    label: "Access Key ID"
    type: string
    required: true
  - name: secret_key
    label: "Secret Access Key"
    type: password
    required: true
  - name: region
    label: "Region"
    type: string
    required: true
    default: "us-east-1"
