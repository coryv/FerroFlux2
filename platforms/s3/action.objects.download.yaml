meta:
  permissions: ["network:*.amazonaws.com"]
  id: s3.objects.download
  name: Download Object
  category: Objects
  type: Action
  platform: s3
  description: Downloads an object from an S3 bucket and stores it in the BlobStore.
  version: 1.0.0
  discovery:
    purpose: Retrieve a file from AWS S3 for processing in the workflow.
    usage_context: Use this to fetch images, data files, or archives for processing. The file is stored as a 'blob' in FerroFlux.
    agent_hints:
      - "Requires the 'bucket' name and the 'key' (full path within the bucket)."
      - "Returns a 'blob_id' which can be sent to other platforms."
    waml_examples:
      - title: Download Image
        waml: |
          - step: fetch_image
            call: s3.action.objects.download
            with:
               bucket: my-app-assets
               key: images/logo.png

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
    - name: key
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: blob
  settings:
    - name: region
      label: Region
      type: string
      required: true
      default: us-east-1

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        "https:'=//" + inputs.bucket + ".s3." + settings.region + ".amazonaws.com/" + inputs.key'
      response_type: blob
      aws_auth:
        service: s3
        region: =settings.region
        access_key: =settings.access_key
        secret_key: =settings.secret_key

    returns:
      status: status_code
      body: response_blob

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: =steps.request.response_blob
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_blob
