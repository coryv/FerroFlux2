meta:
  id: s3.objects.download
  name: Download Object
  category: Objects
  type: Action
  platform: s3
  description: "Download a file from an S3 bucket as a blob."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
    - name: key
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: blob
  settings:
    - name: region
      label: "Region"
      type: string
      required: true
      default: "us-east-1"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "https://{{ get 'inputs.bucket' }}.s3.{{ get 'settings.region' }}.amazonaws.com/{{ get 'inputs.key' }}"
      response_type: blob
      aws_auth:
        service: "s3"
        region: "{{ get 'settings.region' }}"
        access_key: "{{ get 'settings.access_key' }}"
        secret_key: "{{ get 'settings.secret_key' }}"

    returns:
      status: status_code
      body: response_blob

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_blob }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_blob }}"
