meta:
  permissions: ["network:*.amazonaws.com"]
  id: s3.objects.list
  name: List Objects
  category: Objects
  type: Action
  platform: s3
  description: Lists objects in an S3 bucket.
  version: 1.0.0
  discovery:
    purpose: Browse the contents of an S3 bucket.
    usage_context: Use this to find files to process, list logs, or audit storage. Supports prefix filtering for specific 'folders' and pagination for large buckets.
    agent_hints:
      - "Requires the 'bucket' name."
      - "The 'prefix' behaves like a directory filter (e.g. 'logs/2024/')."
      - "Returns a list of object summaries (key, size, lastModified, etag)."
    waml_examples:
      - title: List PDF Reports
        waml: |
          - step: list_pdfs
            call: s3.action.objects.list
            with:
               bucket: client-uploads
               prefix: reports/
               delimiter: /

interface:
  inputs:
    - name: Exec
      type: flow
    - name: bucket
      type: string
    - name: prefix
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: objects
      type: array
  settings:
    - name: region
      label: Region
      type: string
      required: true
      default: us-east-1

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        "https://" + inputs.bucket + ".s3." + settings.region + ".amazonaws.com/?list-type=2&prefix=" + inputs.prefix
      aws_auth:
        service: s3
        region: =settings.region
        access_key: =settings.access_key
        secret_key: =settings.secret_key

    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract_objects
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "\"/content/Contents\"          # Path in the XML-to-JSON converted body"
    returns:
      result: objects_raw

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: objects
          value: =steps.extract_objects.objects_raw
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
