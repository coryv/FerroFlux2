meta:
  permissions: ["network:gitlab.com"]
  id: gitlab.issues.create
  name: Create Issue
  category: Issues
  type: Action
  platform: gitlab
  description: Creates a new issue in a GitLab project.
  version: 1.0.0
  discovery:
    purpose: Log a bug, feature request, or task directly into a project's issue tracker.
    usage_context: Use this to automate bug reporting from GitLab pipelines, customer support tickets, or development task management. Requires the project 'id' (URL-encoded path or numeric ID) and 'title'.
    agent_hints:
      - "Requires the project 'id' string (e.g. 'gitlab-org%2Fgitlab' or '12345')."
      - "Supports markdown in the 'description' and labels via 'labels' (comma-separated)."
    waml_examples:
      - title: Create Bug Issue
        waml: |
          - step: log_bug
            call: gitlab.action.issues.create
            with:
               id: group%2Frepo
               title: Broken link in footer
               description: Found by the link checker.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: projectId
      type: string
    - name: title
      type: string
    - name: description
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: issue
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/projects/" + inputs.projectId + "/issues"
      headers: =platform.headers
      body:
        title: =inputs.title
        description: =inputs.description
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 201
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: issue
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
