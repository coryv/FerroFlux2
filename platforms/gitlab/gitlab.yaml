meta:
  permissions: ["network:gitlab.com"]
  id: gitlab
  name: GitLab
  type: Platform
  category: Developer Tools
  description: "A complete DevOps platform for source control and automated pipelines."
  version: "1.0.0"
  discovery:
    purpose: "Manage projects, merge requests, issues, and complex CI/CD environments."
    usage_context: "Use this to manage code changes, automate deployments, and track team velocity in a self-hosted or cloud environment."
    agent_hints:
      - "Requires Project or Personal Access Tokens for API access."
      - "Supports detailed job and pipeline status monitoring."

config:
  base_url: "https://gitlab.com/api/v4"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer PASTE_YOUR_TOKEN_HERE"

settings:
  - name: api_key
    label: "Personal Access Token"
    type: string
    required: true
