meta:
  permissions: ["network:sheets.googleapis.com"]
  id: google_sheets.values.update
  name: Update Sheet Values
  category: Values
  type: Action
  platform: google_sheets
  description: Sets values in a range of a spreadsheet.
  version: 1.0.0
  discovery:
    purpose: Modify or overwrite values in a specific cell range in a Google Sheet.
    usage_context: Use to update line items, change status labels in a tracker, or reset specific cell values.
    agent_hints:
      - "Requires a Spreadsheet ID and the cell range (e.g., 'Sheet1!A1')."
    waml_examples:
      - title: Update Status
        waml: |
          - step: mark_complete
            call: google_sheets.action.values.update
            with:
               spreadsheet_id: 12345abcdefg
               range: "Sheet1!B2"
               values: ["Completed"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: spreadsheet_id
      type: string
    - name: range
      type: string
    - name: values
      type: array
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =response
      type: object
  settings:
    - name: value_input_option
      label: Value Input Option
      type: select
      required: true
      default: USER_ENTERED
      options:
        - value: RAW
          label: Raw
        - value: USER_ENTERED
          label: User Entered

execution:
  - id: =request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/" + inputs.spreadsheet_id + "/values/" + inputs.range + "?valueInputOption=" + settings.value_input_option
      headers: =platform.headers
      body:
        values: =inputs.values
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =response
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
