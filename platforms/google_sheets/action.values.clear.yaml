meta:
  permissions: ["network:sheets.googleapis.com"]
  id: google_sheets.values.clear
  name: Clear Sheet Values
  category: Values
  type: Action
  platform: google_sheets
  description: "Clears values from a spreadsheet."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: spreadsheet_id
      type: string
    - name: range
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/" + inputs.spreadsheet_id + "/values/" + inputs.range + ":clear"
      headers: platform.headers
      body: >
        "{}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: response
          value: steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
