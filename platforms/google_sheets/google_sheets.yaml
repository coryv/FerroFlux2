meta:
  permissions: ["network:sheets.googleapis.com"]
  id: google_sheets
  name: Google Sheets
  type: Platform
  category: Spreadsheets
  description: "Connects to the Google Sheets API."
  version: "1.0.0"

config:
  base_url: "https://sheets.googleapis.com/v4/spreadsheets"
  headers:
    Content-Type: "application/json"

settings:
  - name: connection
    label: "Google Account"
    type: connection_select
    required: true
