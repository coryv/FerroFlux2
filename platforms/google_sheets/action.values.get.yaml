meta:
  permissions: ["network:sheets.googleapis.com"]
  id: google_sheets.values.get
  name: Get Sheet Values
  category: Values
  type: Action
  platform: google_sheets
  description: "Returns a range of values from a spreadsheet."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: spreadsheet_id
      type: string
    - name: range
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: values
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/" + inputs.spreadsheet_id + "/values/" + inputs.range
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

  - id: extract
    tool: json_query
    params:
      json: steps.request.response_body
      path: >
        "/values"
    returns:
      result: values_array

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: values
          value: steps.extract.values_array
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
