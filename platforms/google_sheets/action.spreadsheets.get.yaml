meta:
  permissions: ["network:sheets.googleapis.com"]
  id: google_sheets.spreadsheets.get
  name: Get Spreadsheet
  category: Spreadsheets
  type: Action
  platform: google_sheets
  description: Get properties and metadata of a spreadsheet.
  version: 1.0.0
  discovery:
    purpose: Retrieve metadata for an entire Google Sheets spreadsheet.
    usage_context: Use to fetch sheet names, sheet IDs, formatting rules, or the spreadsheet title.
    agent_hints:
      - "Requires a Spreadsheet ID."
      - "Returns the full spreadsheet object including metadata and sheet properties."
    waml_examples:
      - title: Get Sheet Metadata
        waml: |
          - step: fetch_meta
            call: google_sheets.action.spreadsheets.get
            with:
               spreadsheet_id: 12345abcdefg

interface:
  inputs:
    - name: Exec
      type: flow
    - name: spreadsheet_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: spreadsheet
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/" + inputs.spreadsheet_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: spreadsheet
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
