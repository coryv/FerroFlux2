meta:
  id: salesforce.objects.describe
  name: Get Fields (Describe)
  category: Objects
  type: Action
  platform: salesforce
  description: "Gets metadata and fields for an SObject."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sObjectName
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metadata
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/sobjects/{{ get 'inputs.sObjectName' }}/describe"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metadata
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
