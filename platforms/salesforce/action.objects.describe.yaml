meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.objects.describe
  name: Get Fields (Describe)
  category: Objects
  type: Action
  platform: salesforce
  description: Retrieves metadata about a Salesforce object (SObject).
  version: 1.0.0
  discovery:
    purpose: Understand the fields, relationships, and capabilities of a specific Salesforce object.
    usage_context: Use this to dynamically discover which fields are available on 'Account', 'Lead', or custom objects before performing a query or update.
    agent_hints:
      - "Requires the 'object' API name (e.g., 'Account', 'CustomObject__c')."
      - "Returns detailed field metadata (type, label, length, picklist values)."
    waml_examples:
      - title: Describe Lead Fields
        waml: |
          - step: get_fields
            call: salesforce.action.objects.describe
            with:
               object: Lead

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sObjectName
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metadata
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/sobjects/" + inputs.sObjectName + "/describe"
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metadata
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
