meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.records.get
  name: Get Record
  category: Records
  type: Action
  platform: salesforce
  description: "Retrieves a standard or custom SObject record."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sObjectName
      type: string
    - name: recordId
      type: string
    - name: fields
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: record
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/sobjects/" + inputs.sObjectName + "/" + inputs.recordId
      headers: platform.headers
      query:
        fields: inputs.fields
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: record
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
