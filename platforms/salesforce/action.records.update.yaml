meta:
  id: salesforce.records.update
  name: Update Record
  category: Records
  type: Action
  platform: salesforce
  description: "Updates a standard or custom SObject record."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sObjectName
      type: string
    - name: recordId
      type: string
    - name: fields
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: PATCH
      url: "{{ platform.base_url }}/sobjects/{{ get 'inputs.sObjectName' }}/{{ get 'inputs.recordId' }}"
      headers: "{{ platform.headers }}"
      body: "{{ get 'inputs.fields' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
