meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.records.update
  name: Update Record
  category: Records
  type: Action
  platform: salesforce
  description: Updates an existing Salesforce record by its ID.
  version: 1.0.0
  discovery:
    purpose: Modify fields on an existing Salesforce object.
    usage_context: Use this to update a Lead's status, change an Opportunity's close date, or sync contact information from an external source.
    agent_hints:
      - "Requires the 'object' name and the 'id'."
      - "The 'fields' parameter should only contain the fields you wish to change (partial update)."
    waml_examples:
      - title: Close Opportunity
        waml: |
          - step: win_opp
            call: salesforce.action.records.update
            with:
               object: Opportunity
               id: 006...
               fields:
                 StageName: Closed Won
                 CloseDate: 2024-04-15

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sObjectName
      type: string
    - name: recordId
      type: string
    - name: fields
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: PATCH
      url: >
        platform.base_url + "/sobjects/" + inputs.sObjectName + "/" + inputs.recordId
      headers: =platform.headers
      body: =inputs.fields
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
