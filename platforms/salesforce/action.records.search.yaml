meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.records.search
  name: Search Records (SOSL)
  category: Records
  type: Action
  platform: salesforce
  description: Executes a Salesforce SOSL search to find text across multiple objects.
  version: 1.0.0
  discovery:
    purpose: Perform a global text search across records, objects, and fields.
    usage_context: Use this when you have a piece of text (like a name or email) and don't know which object it belongs to, or want to search all objects at once.
    agent_hints:
      - "The 'q' parameter must be a valid SOSL string (e.g. 'FIND {Acme} IN ALL FIELDS RETURNING Account(Id, Name), Lead(Id, Name)')."
      - "SOSL is optimized for text indexing across the entire SObject space."
    waml_examples:
      - title: Global Company Search
        waml: |
          - step: find_acme
            call: salesforce.action.records.search
            with:
               q: "FIND {Acme} IN ALL FIELDS RETURNING Account(Id, Name), Lead(Id, Name)"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: results
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/search"
      headers: =platform.headers
      query:
        q: =inputs.query
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: results
          value: =steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
