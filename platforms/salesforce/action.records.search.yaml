meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.records.search
  name: Search Records (SOSL)
  category: Records
  type: Action
  platform: salesforce
  description: "Executes a SOSL search."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: results
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/search"
      headers: "{{ platform.headers }}"
      query:
        q: "{{ get 'inputs.query' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: results
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
