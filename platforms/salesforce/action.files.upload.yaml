meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: salesforce
  description: "Uploads a file (blob reference) to Salesforce as a ContentVersion record."
  version: "1.0.0"
  discovery:
    purpose: "Store a local FerroFlux 'blob' in Salesforce and link it to a record (Account, Case, etc.)."
    usage_context: "Use this to attach signed contracts to opportunities, upload log files to cases, or store profile images for contacts."
    agent_hints:
      - "The 'file' must be a valid 'blob_id' from a previous step."
      - "The 'Title' and 'PathOnClient' are required for the Salesforce ContentVersion object."
    waml_examples:
      - title: "Upload Signed PDF"
        waml: |
          - step: upload_doc
            call: salesforce.action.files.upload
            with:
               file: steps.get_blob.blob_id
               Title: "Signed_Contract.pdf"
               PathOnClient: "contract.pdf"
               FirstPublishLocationId: "001..." 

interface:
  inputs:
    - name: Exec
      type: flow
    - name: title
      type: string
    - name: pathOnClient
      type: string
    - name: versionData
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/sobjects/ContentVersion/"
      headers: platform.headers
      body:
        Title: inputs.title
        PathOnClient: inputs.pathOnClient
        VersionData: inputs.versionData
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: steps.request.response_body
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
