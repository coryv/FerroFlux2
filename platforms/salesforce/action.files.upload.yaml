meta:
  id: salesforce.files.upload
  name: Upload File
  category: Files
  type: Action
  platform: salesforce
  description: "Uploads a document (ContentVersion) to Salesforce."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: title
      type: string
    - name: pathOnClient
      type: string
    - name: versionData
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/sobjects/ContentVersion/"
      headers: "{{ platform.headers }}"
      body:
        Title: "{{ get 'inputs.title' }}"
        PathOnClient: "{{ get 'inputs.pathOnClient' }}"
        VersionData: "{{ get 'inputs.versionData' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: "{{ steps.request.response_body }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
