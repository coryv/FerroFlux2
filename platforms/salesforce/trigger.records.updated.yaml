meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.records.updated
  name: Updated Record
  category: Records
  type: Trigger
  platform: salesforce
  description: Triggers when an existing Salesforce record is modified.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever a record (e.g. Lead, Account) is updated.
    usage_context: Use this to sync profile changes to external systems, alert account owners of stage changes, or update inventory when an order status changes.
    agent_hints:
      - "Polls for modifications based on the 'SystemModstamp' field."
      - "Requires the 'object' name (e.g. 'Account')."
    waml_examples:
      - title: Sync Account Updates
        waml: |
          trigger:
            updated_account:
               call: salesforce.trigger.records.updated
               with:
                  object: Account

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: record
      type: object
  settings:
    - name: sObjectName
      label: SObject Name
      type: string
      required: true
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/query"
      headers: =platform.headers
      query:
        q: >
          "SELECT Id FROM " + settings.sObjectName + " WHERE SystemModstamp > " + state.last_poll + " ORDER BY SystemModstamp ASC"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: foreach
        params:
          items: =steps.query.response_body.records
          action:
            - tool: emit
              params:
                port: Success
            - tool: emit
              params:
                port: record
                value: item
