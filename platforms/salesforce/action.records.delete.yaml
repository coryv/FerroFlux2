meta:
  permissions: ["network:*.salesforce.com"]
  id: salesforce.records.delete
  name: Delete Record
  category: Records
  type: Action
  platform: salesforce
  description: Permanently deletes a Salesforce record by its ID.
  version: 1.0.0
  discovery:
    purpose: Remove a record from Salesforce storage.
    usage_context: Use this to delete test data, remove duplicates, or clean up outdated records. Use with caution as this is irreversible.
    agent_hints:
      - "Requires the 'object' name and the 'id'."
    waml_examples:
      - title: Delete Duplicate Lead
        waml: |
          - step: rm_lead
            call: salesforce.action.records.delete
            with:
               object: Lead
               id: 00Q...

interface:
  inputs:
    - name: Exec
      type: flow
    - name: sObjectName
      type: string
    - name: recordId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: >-
        =platform.base_url + "/sobjects/" + inputs.sObjectName + "/" + inputs.recordId
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "204":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
