meta:
  id: segment.events.track
  name: Track
  category: Events
  type: Action
  platform: segment
  description: "Record any actions your users perform."
  version: "1.0.0"
  permissions:
    - "network:api.segment.io"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: event
      type: string
    - name: userId
      type: string
    - name: anonymousId
      type: string
    - name: properties
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/track"
      headers: "{{ platform.headers }}"
      body:
        event: "{{ get 'inputs.event' }}"
        userId: "{{ get 'inputs.userId' }}"
        anonymousId: "{{ get 'inputs.anonymousId' }}"
        properties: "{{ inputs.properties }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
