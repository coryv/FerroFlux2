meta:
  id: segment
  name: Segment
  type: Platform
  category: Analytics
  description: "Connects to the Segment V1 API for unified customer data tracking."
  version: "1.0.0"
  permissions:
    - "network:api.segment.io"

config:
  base_url: "https://api.segment.io/v1"
  headers:
    Content-Type: "application/json"
    Authorization: >
      "Basic " + base64 (concat settings.write_key ':')

settings:
  - name: write_key
    label: "Write Key"
    type: string
    required: true
