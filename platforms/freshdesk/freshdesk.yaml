meta:
  id: freshdesk
  name: Freshdesk
  category: Support
  type: Platform
  description: "Connects to the Freshdesk API for tickets and customer support."
  version: "1.0.0"
  permissions: ["network:*.freshdesk.com"]
  signature: null

config:
  base_url: >
    "https://" + domain + ".freshdesk.com/api/v2"
  auth_type: "basic"
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/freshdesk.svg"

settings:
  - name: "domain"
    label: "Freshdesk Domain (e.g. company)"
    type: "string"
    required: true
  - name: "api_key"
    label: "API Key"
    type: "string"
    required: true
    is_secret: true
