meta:
  id: woocommerce
  name: "WooCommerce"
  category: "E-commerce"
  type: Platform
  icon_url: "https://unpkg.com/simple-icons@v9.0.0/icons/woocommerce.svg"
  permissions: ["network:*"]

config:
  base_url: >
    "https://" + store_url + "/wp-json/wc/v3"
  auth_type: "basic"
  auth:
    type: "basic"
  connection_schema:
    - name: "store_url"
      type: "string"
      required: true
    - name: "consumer_key"
      type: "string"
      required: true
    - name: "consumer_secret"
      type: "string"
      required: true
      is_secret: true
