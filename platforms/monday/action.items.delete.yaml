meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.delete
  name: Delete Item
  category: Items
  type: Action
  platform: monday
  description: "Permanently deletes an item from a Monday.com board."
  version: "1.0.0"
  discovery:
    purpose: "Remove an item from the board and workspace."
    usage_context: "Use this to clean up temporary data, remove duplicates, or delete outdated records. Use with caution as this is irreversible."
    agent_hints:
      - "Requires the numeric 'item_id'."
    waml_examples:
      - title: "Delete Duplicate Record"
        waml: |
          - step: rm_row
            call: monday.action.items.delete
            with:
               item_id: "890..."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: item_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: |
          mutation ($itemId: ID!) {
            delete_item (item_id: $itemId) {
              id
            }
          }
        variables:
          itemId: inputs.item_id
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
