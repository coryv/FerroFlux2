meta:
  permissions: ["network:api.monday.com"]
  id: monday.boards.list
  name: List Boards
  category: Boards
  type: Action
  platform: monday
  description: Lists boards available in your Monday.com workspace.
  version: 1.0.0
  discovery:
    purpose: Browse and identify boards for project tracking and data storage.
    usage_context: Use this to starting a board-specific automation, find a board's ID by its name, or audit workspace layout.
    agent_hints:
      - "Can be filtered by 'limit', 'page', and 'state' (active, archived, deleted)."
      - "Returns a list of board summaries (ID, name, description)."
    waml_examples:
      - title: List Active Boards
        waml: |
          - step: get_boards
            call: monday.action.boards.list
            with:
               limit: 20

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: boards
      type: array

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: |
          query {
            boards (limit: "100) {"
              id
              name
            }
          }
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: boards
          value: =steps.request.response_body.data.boards
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
