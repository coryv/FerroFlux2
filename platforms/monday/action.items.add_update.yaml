meta:
  id: monday.items.add_update
  name: Add Update to Item
  category: Items
  type: Action
  platform: monday
  description: "Add a new update (comment) to a specified item."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: item_id
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: |
          mutation ($itemId: ID!, $body: String!) {
            create_update (item_id: $itemId, body: $body) {
              id
            }
          }
        variables:
          itemId: "{{ get 'inputs.item_id' }}"
          body: "{{ get 'inputs.body' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
