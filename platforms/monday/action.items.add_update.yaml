meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.add_update
  name: Add Update to Item
  category: Items
  type: Action
  platform: monday
  description: Adds a new update (note) to a Monday.com item.
  version: 1.0.0
  discovery:
    purpose: Communicate updates, provide context, and log history on a board item.
    usage_context: Use this to post progress reports, notify team members of results, or record completion details within the item's update feed.
    agent_hints:
      - "Requires the numeric 'item_id' and the 'body' text."
      - "Updates appear in the 'Activity' column of the Monday board."
    waml_examples:
      - title: Post Task Update
        waml: |
          - step: say_it
            call: monday.action.items.add_update
            with:
               item_id: 890...
               body: Processing complete. Please check the results.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: item_id
      type: string
    - name: body
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: |
          mutation ($itemId: "ID!, $body: String!) {"
            create_update (item_id: "$itemId, body: $body) {"
              id
            }
          }
        variables:
          itemId: =inputs.item_id
          body: =inputs.body
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
