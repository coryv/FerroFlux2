meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.new
  name: New Item
  category: Items
  type: Trigger
  platform: monday
  description: "Polls for new items on a specified board."
  version: "1.0.0"

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: item
      type: object
  settings:
    - name: board_id
      label: "Board ID"
      type: string
      required: true
    - name: limit
      label: "Batch Limit"
      type: number
      default: 10

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: |
          query ($boardId: ID!, $limit: Int!) {
            boards (ids: [$boardId]) {
              items (limit: $limit) {
                id
                name
                created_at
                column_values {
                  id
                  text
                }
              }
            }
          }
        variables:
          boardId: "{{ get 'settings.board_id' }}"
          limit: "{{ get 'settings.limit' }}"
    returns:
      status: status_code
      body: response_body

  - id: extract_items
    tool: json_query
    params:
      json: "{{ steps.request.response_body }}"
      path: "/data/boards/0/items"
    returns:
      items: items_array

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: iterate
        params:
          items: "{{ steps.extract_items.items_array }}"
          cursor_key: "id" # Item IDs are generally increasing
          port: item
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
