meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.get
  name: Get Item
  category: Items
  type: Action
  platform: monday
  description: "Retrieves detailed information about an item on a Monday board."
  version: "1.0.0"
  discovery:
    purpose: "Fetch the properties, status, and column values of a specific Monday row."
    usage_context: "Use this when you have an Item ID and need to read its data before performing logic or updating other systems."
    agent_hints:
      - "Requires the numeric 'item_id'."
      - "Returns the full item object, including its column values and group association."
    waml_examples:
      - title: "Get Item Details"
        waml: |
          - step: read_row
            call: monday.action.items.get
            with:
               item_id: "890..."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: item_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: item
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: |
          query ($itemId: ID!) {
            items (ids: [$itemId]) {
              id
              name
              board {
                id
                name
              }
              column_values {
                id
                text
                value
                type
              }
            }
          }
        variables:
          itemId: inputs.item_id
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item
          value: >
            steps.request.response_body.data.items[0]
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
