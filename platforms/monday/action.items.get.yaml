meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.get
  name: Get Item
  category: Items
  type: Action
  platform: monday
  description: "Retrieve details for a specific item."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: item_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: item
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: |
          query ($itemId: ID!) {
            items (ids: [$itemId]) {
              id
              name
              board {
                id
                name
              }
              column_values {
                id
                text
                value
                type
              }
            }
          }
        variables:
          itemId: "{{ get 'inputs.item_id' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item
          value: "{{ steps.request.response_body.data.items[0] }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
