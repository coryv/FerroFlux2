meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.archive
  name: Archive Item
  category: Items
  type: Action
  platform: monday
  description: "Archive a specified item from a board."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: item_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: |
          mutation ($itemId: ID!) {
            archive_item (item_id: $itemId) {
              id
            }
          }
        variables:
          itemId: inputs.item_id
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
