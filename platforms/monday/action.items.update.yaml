meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.update
  name: Update Item
  category: Items
  type: Action
  platform: monday
  description: Updates multiple column values for an item on a Monday board.
  version: 1.0.0
  discovery:
    purpose: Modify existing data on a board item.
    usage_context: Use this to sync multiple fields at once, update task statuses, or record external system outcomes back into Monday.
    agent_hints:
      - "Requires 'board_id', 'item_id', and 'column_values'."
      - "The 'column_values' parameter must be a JSON string-encoded object of column IDs and values."
    waml_examples:
      - title: Sync Record Changes
        waml: |
          - step: sync_field
            call: monday.action.items.update
            with:
               board_id: 1234567
               item_id: 890...
               column_values: '{"status": {"label": "Done"}, "text": "Sync completed"}'

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
    - name: item_id
      type: string
    - name: column_values
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: |
          mutation ($boardId: "ID!, $itemId: ID!, $columnValues: JSON!) {"
            change_multiple_column_values (board_id: "$boardId, item_id: $itemId, column_values: $columnValues) {"
              id
            }
          }
        variables:
          boardId: =inputs.board_id
          itemId: =inputs.item_id
          columnValues: >
            (has(inputs.column_values) ? inputs.column_values : "'{}')"
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
