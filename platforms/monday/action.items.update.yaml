meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.update
  name: Update Item
  category: Items
  type: Action
  platform: monday
  description: "Update multiple column values for a specified item."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
    - name: item_id
      type: string
    - name: column_values
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: |
          mutation ($boardId: ID!, $itemId: ID!, $columnValues: JSON!) {
            change_multiple_column_values (board_id: $boardId, item_id: $itemId, column_values: $columnValues) {
              id
            }
          }
        variables:
          boardId: "{{ get 'inputs.board_id' }}"
          itemId: "{{ get 'inputs.item_id' }}"
          columnValues: "{{ get 'inputs.column_values' '{}' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
