meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.updated
  name: Updated Item
  category: Items
  type: Trigger
  platform: monday
  description: Triggers when any property of a Monday.com item is modified.
  version: 1.0.0
  discovery:
    purpose: Start a workflow whenever an item's name, text column, or date changes.
    usage_context: Use this for maintaining real-time data syncs between Monday and other tools, or for triggering notifications when important item details are updated.
    agent_hints:
      - "Polls for modifications across the entire board based on the 'updated_at' timestamp."
      - "Requires the numeric 'board_id'."
    waml_examples:
      - title: Sync Item Changes
        waml: |
          trigger:
            row_changed:
               call: monday.trigger.items.updated
               with:
                  board_id: 1234567

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: item
      type: object
  settings:
    - name: board_id
      label: Board ID
      type: string
      required: true

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: |
          query ($boardId: ID!) {
            boards (ids: [$boardId]) {
              items (limit: 50) {
                id
                name
                updated_at
              }
            }
          }
        variables:
          boardId: =settings.board_id
    returns:
      status: status_code
      body: response_body

  - id: extract_items
    tool: json_query
    params:
      json: =steps.request.response_body
      path: >
        "/data/boards/0/items"
    returns:
      items: items_array

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: iterate
        params:
          items: =steps.extract_items.items_array
          cursor_key: updated_at
          port: item
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
