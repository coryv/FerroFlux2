meta:
  id: monday.columns.update_value
  name: Update Column Value
  category: Columns
  type: Action
  platform: monday
  description: "Update the value of a single column for a specified item."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
    - name: item_id
      type: string
    - name: column_id
      type: string
    - name: value
      type: any # Could be String or JSON depending on column type
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: |
          mutation ($boardId: ID!, $itemId: ID!, $columnId: String!, $value: JSON!) {
            change_column_value (board_id: $boardId, item_id: $itemId, column_id: $columnId, value: $value) {
              id
            }
          }
        variables:
          boardId: "{{ get 'inputs.board_id' }}"
          itemId: "{{ get 'inputs.item_id' }}"
          columnId: "{{ get 'inputs.column_id' }}"
          value: "{{ get 'inputs.value' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
