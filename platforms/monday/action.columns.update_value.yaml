meta:
  permissions: ["network:api.monday.com"]
  id: monday.columns.update_value
  name: Update Column Value
  category: Columns
  type: Action
  platform: monday
  description: "Updates a specific column value for an item on a Monday board."
  version: "1.0.0"
  discovery:
    purpose: "Modify a single cell in the Monday table."
    usage_context: "Use this when you only need to change one property (like 'Status', 'Date', or 'Text') without affecting others. More targeted than 'update_item'."
    agent_hints:
      - "Requires 'board_id', 'item_id', and 'column_id'."
      - "The 'value' must be a JSON string-encoded object specific to the column type."
    waml_examples:
      - title: "Update Status Column"
        waml: |
          - step: set_status
            call: monday.action.columns.update_value
            with:
               board_id: "1234567"
               item_id: "890..."
               column_id: "status"
               value: '{"label": "Done"}'

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
    - name: item_id
      type: string
    - name: column_id
      type: string
    - name: value
      type: any # Could be String or JSON depending on column type
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: |
          mutation ($boardId: ID!, $itemId: ID!, $columnId: String!, $value: JSON!) {
            change_column_value (board_id: $boardId, item_id: $itemId, column_id: $columnId, value: $value) {
              id
            }
          }
        variables:
          boardId: inputs.board_id
          itemId: inputs.item_id
          columnId: inputs.column_id
          value: inputs.value
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
