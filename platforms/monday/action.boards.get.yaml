meta:
  permissions: ["network:api.monday.com"]
  id: monday.boards.get
  name: Get Board
  category: Boards
  type: Action
  platform: monday
  description: Retrieves detailed information about a Monday.com board.
  version: 1.0.0
  discovery:
    purpose: Fetch the schema, columns, and settings of a specific board.
    usage_context: Use this to discover column IDs (like 'status', 'text', 'date') before performing item updates or queries.
    agent_hints:
      - "Requires the numeric 'board_id'."
      - "Returns column metadata which is essential for correctly mapping 'column_values' JSON."
    waml_examples:
      - title: Get Board Schema
        waml: |
          - step: read_board
            call: monday.action.boards.get
            with:
               board_id: 1234567

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: board
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: =platform.base_url
      headers: =platform.headers
      body:
        query: |
          query ($boardId: "ID!) {"
            boards (ids: [$boardId]) {
              id
              name
              description
              columns {
                id
                title
                type
              }
            }
          }
        variables:
          boardId: =inputs.board_id
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: board
          value: >
            steps.request.response_body.data.boards[0]
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
