meta:
  permissions: ["network:api.monday.com"]
  id: monday.items.create
  name: Create Item
  category: Items
  type: Action
  platform: monday
  description: "Creates a new item (row) on a Monday.com board."
  version: "1.0.0"
  discovery:
    purpose: "Add a new record to your Monday Work OS project board."
    usage_context: "Use this to log new requests, create tasks from emails, or sync records from other systems into Monday's table view."
    agent_hints:
      - "Requires the numeric 'board_id' and 'item_name'."
      - "Optionally specify a 'group_id' and 'column_values' as continuous JSON."
    waml_examples:
      - title: "Create Roadmap Item"
        waml: |
          - step: log_task
            call: monday.action.items.create
            with:
               board_id: "1234567"
               item_name: "Sprint 5: Auth Refactor"
               column_values: '{"status": {"label": "Working on it"}}'

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
    - name: item_name
      type: string
    - name: column_values
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: item_id
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: platform.base_url
      headers: platform.headers
      body:
        query: |
          mutation ($boardId: ID!, $itemName: String!, $columnValues: JSON!) {
            create_item (board_id: $boardId, item_name: $itemName, column_values: $columnValues) {
              id
            }
          }
        variables:
          boardId: inputs.board_id
          itemName: inputs.item_name
          columnValues: >
            (has(inputs.column_values) ? inputs.column_values : '{}')
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item_id
          value: steps.request.response_body.data.create_item.id
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
