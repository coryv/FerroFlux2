meta:
  id: monday.items.create
  name: Create Item
  category: Items
  type: Action
  platform: monday
  description: "Create a new item on a specified board."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: board_id
      type: string
    - name: item_name
      type: string
    - name: column_values
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: item_id
      type: string

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}"
      headers: "{{ platform.headers }}"
      body:
        query: |
          mutation ($boardId: ID!, $itemName: String!, $columnValues: JSON!) {
            create_item (board_id: $boardId, item_name: $itemName, column_values: $columnValues) {
              id
            }
          }
        variables:
          boardId: "{{ get 'inputs.board_id' }}"
          itemName: "{{ get 'inputs.item_name' }}"
          columnValues: "{{ get 'inputs.column_values' '{}' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: item_id
          value: "{{ steps.request.response_body.data.create_item.id }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
