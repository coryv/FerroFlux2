meta:
  id: postgresql.query.execute
  name: Execute Query
  category: Query
  type: Action
  platform: postgresql
  description: Executes an arbitrary SQL query against a PostgreSQL database.
  version: 1.0.0
  discovery:
    purpose: Perform custom SQL operations (INSERT, UPDATE, DELETE, or DDL).
    usage_context: Use this when specialized SQL is required, such as creating tables, performing complex updates, or using database-specific functions that aren't covered by standard 'select' or 'insert' nodes.
    agent_hints:
      - "The 'query' must be valid PostgreSQL SQL."
      - "Returns the number of affected rows or the result of the query where applicable."
      - "Use '$1', '$2', etc. for parameters to prevent SQL injection."
    waml_examples:
      - title: Update Many Records
        waml: |
          - step: bulk_update
            call: postgresql.action.query.execute
            with:
               query: '=UPDATE \"orders\" SET \"status\" = $1 WHERE \"created_at\" < $2'
               params: ["archived", "2023-01-01"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: query
      type: string
      description: "The SQL query to execute (e.g. SELECT * FROM users WHERE id = $1)."
    - name: bind
      type: array
      description: Optional. Array of values to bind to parameters in the query.
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =rows
      type: array
      description: The result sets returned by the query.

execution:
  - id: execute
    tool: sql_query
    params:
      operation: execute
      connection_string: =settings.connection_string
      query: =inputs.query
      bind: =inputs.bind
    returns:
      rows: rows

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =rows
          value: =steps.execute.rows
