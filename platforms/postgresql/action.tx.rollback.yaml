meta:
  id: postgresql.tx.rollback
  name: Rollback Transaction
  category: Transaction
  type: Action
  platform: postgresql
  description: Rolls back the active SQL transaction and discards any changes.
  version: 1.0.0
  discovery:
    purpose: Cancel the current transaction and discard all pending changes.
    usage_context: Call this in an error path or catch block when a step within a database transaction fails.
    agent_hints:
      - "Ensures the database returns to the state it was in before 'begin_transaction' was called."
    waml_examples:
      - title: Rollback Update
        waml: |
          - step: rollback_tx
            call: postgresql.action.tx.rollback
            error: true

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: rollback
    tool: sql_query
    params:
      operation: rollback
      connection_string: =settings.connection_string
    returns:
      status: status

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
