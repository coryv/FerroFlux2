meta:
  id: postgresql.tx.begin
  name: Begin Transaction
  category: Transaction
  type: Action
  platform: postgresql
  description: "Starts a new SQL transaction for the current execution flow."
  version: "1.0.0"
  discovery:
    purpose: "Begin a sequence of SQL operations that must be atomic."
    usage_context: "Use transactions when moving data between tables (e.g., deducting balance from one table and adding to another) or when multiple related rows must be updated consistently."
    agent_hints:
      - "You must call 'commit' at the end of the success path or 'rollback' on the error path."
    waml_examples:
      - title: "Begin Atomic Transaction"
        waml: |
          - step: start_tx
            call: postgresql.action.tx.begin

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: begin
    tool: sql_query
    params:
      operation: begin
      connection_string: settings.connection_string
    returns:
      status: status

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
