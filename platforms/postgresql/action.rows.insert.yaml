meta:
  id: postgresql.rows.insert
  name: Insert Row
  category: Tables
  type: Action
  platform: postgresql
  description: Inserts a new row into a PostgreSQL table.
  version: 1.0.0
  discovery:
    purpose: Add a new record to a database table.
    usage_context: Use this to create new resources, like a new user account, a support ticket, or a transaction record. Supports native PostgreSQL types including JSONB.
    agent_hints:
      - "The 'rows' parameter must be an array of objects where each key is a column name."
      - "Omit auto-increment columns (like 'id' or SERIAL) to let the database generate them."
    waml_examples:
      - title: Create New User
        waml: |
          - step: create_user
            call: postgresql.action.rows.insert
            with:
               table: users
               rows:
                 - email: alice@example.com
                   name: Alice
                   metadata: { "source": "web" }

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
      description: The name of the table to insert into.
    - name: data
      type: object
      description: "The data to insert (column: value)."
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: result
      type: object

execution:
  # This uses a Rhai script to construct the INSERT query dynamically
  - id: build_query
    tool: rhai
    params:
      code: |
        let table = get("inputs.table");
        let data = get("inputs.data");
        let columns = data.keys();
        let values = data.values();
        let placeholders = columns.map(|col, idx| "$" + (idx + 1).to_string());
        
        let query = "INSERT INTO " + table + " (" + columns.join(", ") + ") VALUES (" + placeholders.join(", ") + ") RETURNING *";
        
        set("query", query);
        set("bind", values);
    returns:
      query: query
      bind: bind

  - id: execute
    tool: sql_query
    params:
      operation: execute
      connection_string: =settings.connection_string
      query: =steps.build_query.query
      bind: =steps.build_query.bind
    returns:
      result: >
        "rows[0]"

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: result
          value: =steps.execute.result
