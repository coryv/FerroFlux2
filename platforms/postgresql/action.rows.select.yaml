meta:
  id: postgresql.rows.select
  name: Select Rows
  category: Database
  type: Action
  platform: postgresql
  description: Executes a SELECT query against a PostgreSQL database.
  version: 1.0.0
  discovery:
    purpose: Retrieve rows from a database table using SQL.
    usage_context: Use this to fetch records for processing, such as getting a list of pending orders or looking up a user's details. Supports parameterized queries for security.
    agent_hints:
      - "The 'query' must be valid PostgreSQL SQL."
      - "Always use double quotes for case-sensitive identifiers (e.g., SELECT * FROM \"Users\")."
      - "The 'params' array matches the '$1', '$2' placeholders in your query in order."
    waml_examples:
      - title: Fetch Active Users
        waml: |
          - step: get_users
            call: postgresql.action.rows.select
            with:
               query: 'SELECT id, email FROM \"users\" WHERE \"status\" = $1'
               params: ["active"]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: table
      type: string
    - name: limit
      type: number
      default: 100
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: =rows
      type: array

execution:
  - id: sql
    tool: sql_query
    params:
      connection_string: =settings.connection_string
      query: >
        "SELECT * FROM " + inputs.table + " LIMIT " + (has(inputs.limit) ? inputs.limit : '100')
    returns:
      rows: rows

routing:
  match: =steps.sql.status
  cases:
    default:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =rows
          value: =steps.sql.rows
