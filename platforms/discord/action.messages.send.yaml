meta:
  id: discord.action.messages.send
  name: Send Message
  category: Messages
  type: Action
  platform: discord
  description: "Sends a message to a Discord channel."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: channel_id
      type: string
      required: true
    - name: content
      type: string
      required: true
    - name: tts
      type: boolean
      default: false
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: message
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/channels/{{ get 'inputs.channel_id' }}/messages"
      headers: "{{ platform.headers }}"
      body:
        content: "{{ get 'inputs.content' }}"
        tts: "{{ get 'inputs.tts' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "201"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: message
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
