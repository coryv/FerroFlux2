meta:
  permissions: ["network:discord.com"]
  id: discord.messages.send_dm
  name: Send Direct Message
  category: Messages
  type: Action
  platform: discord
  description: Send a direct message to a specific user.
  version: 1.0.0
  discovery:
    purpose: Send a private message to an individual Discord user.
    usage_context: Use this for private notifications or 1-on-1 interactions with server members. This action handles the 'channel creation' step required by Discord automatically.
    agent_hints:
      - "Requires the Snowflake ID of the recipient user."
      - "Note: 'Bots can only DM users they share a server with, and who have DMs enabled."'
    waml_examples:
      - title: Send a Private Welcome
        waml: |
          - step: private_greet
            call: discord.action.messages.send_dm
            with:
               recipient_id: 123456789012345678
               content: "Thanks for joining! Use !help for more info."

interface:
  inputs:
    - name: Exec
      type: flow
    - name: recipient_id
      type: string
    - name: content
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: create_dm
    tool: =http_client
    params:
      method: POST
      url: >
        platform.base_url + "/users/@me/channels"
      headers: =platform.headers
      body:
        recipient_id: =inputs.recipient_id
    returns:
      status: status_code
      body: response_body

  - id: send_message
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/channels/" + steps.create_dm.response_body.id + "/messages"
      headers: =platform.headers
      body:
        content: =inputs.content
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.send_message.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.send_message.response_body
