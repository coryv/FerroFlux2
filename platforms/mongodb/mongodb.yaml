meta:
  id: mongodb
  name: MongoDB
  category: Database
  type: Platform
  description: "Direct connection to MongoDB clusters via binary protocol."
  version: "1.0.0"
  discovery:
    purpose: "NoSQL document-based database for flexible, JSON-like storage."
    usage_context: "Use MongoDB when your data schema is evolving, or when you need to store large, nested objects that don't fit well into traditional relational tables. Ideal for logs, user profiles, and catalog data."
    agent_hints:
      - "Queries use the standard MongoDB BSON/JSON syntax."
      - "Requires a connection string (URI) and a target database name."
      - "Ensure the FerroFlux engine's IP is allow-listed in your MongoDB Atlas or firewall settings."

config:
  driver: mongodb
  base_url: "mongodb://localhost" # Placeholder for database platforms
  headers: {}                  # Placeholder for database platforms

settings:
  - name: connection_string
    label: "Connection String"
    type: string
    required: true
    secret: true
    placeholder: "mongodb+srv://user:password@cluster.mongodb.net/dbname"
    description: "The full connection URI for your MongoDB cluster."
  - name: database
    label: "Default Database"
    type: string
    required: true
    description: "The name of the database to use by default."

interface:
  inputs: []
  outputs: []
