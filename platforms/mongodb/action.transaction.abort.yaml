meta:
  id: mongodb.transaction.abort
  name: Abort Transaction
  category: Transaction
  type: Action
  platform: mongodb
  description: Aborts the active transaction and rolls back any changes.
  version: 1.0.0
  discovery:
    purpose: Cancel the current transaction and discard all pending changes.
    usage_context: Call this in an error path or catch block when a step within a transaction sequence fails.
    agent_hints:
      - "Ensures the database returns to the state it was in before 'begin_transaction' was called."
    waml_examples:
      - title: Rollback Update
        waml: |
          - step: rollback
            call: mongodb.action.transaction.abort
            error: true

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: abort
    tool: mongo_query
    params:
      operation: abort_transaction
      connection_string: =settings.connection_string
      database: =settings.database
      collection: >
        "\"_\" # Unused for this op"
    returns:
      status: status

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
