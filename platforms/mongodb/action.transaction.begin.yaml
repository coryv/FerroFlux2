meta:
  id: mongodb.transaction.begin
  name: Begin Transaction
  category: Transaction
  type: Action
  platform: mongodb
  description: Commits the active transaction for the current execution flow.
  version: 1.0.0
  discovery:
    purpose: Permanently save all changes made during the current transaction.
    usage_context: Call this at the end of a successful sequence following a 'begin_transaction' call.
    agent_hints:
      - "You must call 'commit' at the end of the success path or 'abort' on the error path."
    waml_examples:
      - title: Begin Atomic Update
        waml: |
          - step: start_tx
            call: mongodb.action.transaction.begin

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow

execution:
  - id: begin
    tool: mongo_query
    params:
      operation: begin_transaction
      connection_string: =settings.connection_string
      database: =settings.database
      collection: >
        "\"_\" # Unused for this op"
    returns:
      status: status

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
