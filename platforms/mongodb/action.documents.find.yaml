meta:
  id: mongodb.documents.find
  name: Find Documents
  category: Database
  type: Action
  platform: mongodb
  description: "Retrieve documents from a MongoDB collection."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: collection
      type: string
      required: true
    - name: filter
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: documents
      type: array

execution:
  - id: mongo
    tool: mongo_query
    params:
      connection_string: settings.connection_string
      database: settings.database
      collection: inputs.collection
      operation: find
      filter: inputs.filter
    returns:
      documents: documents

routing:
  match: steps.mongo.status
  cases:
    default:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: documents
          value: steps.mongo.documents
