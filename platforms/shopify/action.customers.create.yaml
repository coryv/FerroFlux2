meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.customers.create
  name: Create Customer
  category: Customers
  type: Action
  platform: shopify
  description: "Creates a new customer."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: firstName
      type: string
    - name: lastName
      type: string
    - name: email
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: customer
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/customers.json"
      headers: "{{ platform.headers }}"
      body:
        customer:
          first_name: "{{ get 'inputs.firstName' }}"
          last_name: "{{ get 'inputs.lastName' }}"
          email: "{{ get 'inputs.email' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: customer
          value: "{{ steps.request.response_body.customer }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
