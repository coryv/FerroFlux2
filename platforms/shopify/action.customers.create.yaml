meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.customers.create
  name: Create Customer
  category: Customers
  type: Action
  platform: shopify
  description: "Creates a new customer."
  version: "1.0.0"
  discovery:
    purpose: "Create a new customer profile in the Shopify store."
    usage_context: "Use to synchronize customer data from external marketing tools or CRM systems."
    agent_hints:
      - "Requires email and optionally first/last name."
    waml_examples:
      - title: "New Customer"
        waml: |
          - step: register_user
            call: shopify.action.customers.create
            with:
               email: "john.doe@example.com"
               first_name: "John"
               last_name: "Doe"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: firstName
      type: string
    - name: lastName
      type: string
    - name: email
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: customer
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/customers.json"
      headers: platform.headers
      body:
        customer:
          first_name: inputs.firstName
          last_name: inputs.lastName
          email: inputs.email
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: customer
          value: steps.request.response_body.customer
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
