meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.inventory.get
  name: Get Inventory Level
  category: Inventory
  type: Action
  platform: shopify
  description: Gets the inventory level for an item at a location.
  version: 1.0.0
  discovery:
    purpose: Retrieve the current inventory levels for a product variant at a specific location.
    usage_context: Use to verify stock availability before fulfilling an order or syncing with an external warehouse.
    agent_hints:
      - "Requires inventory_item_id and location_id."
    waml_examples:
      - title: Check Stock
        waml: |
          - step: check
            call: shopify.action.inventory.get
            with:
               inventory_item_id: 808950896
               location_id: 905684977

interface:
  inputs:
    - name: Exec
      type: flow
    - name: inventoryItemId
      type: string
    - name: locationId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: inventoryLevel
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/inventory_levels.json"
      headers: =platform.headers
      query:
        inventory_item_ids: =inputs.inventoryItemId
        location_ids: =inputs.locationId
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: inventoryLevel
          value: =steps.request.response_body.inventory_levels
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
