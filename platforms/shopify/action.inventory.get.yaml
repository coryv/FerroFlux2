meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.inventory.get
  name: Get Inventory Level
  category: Inventory
  type: Action
  platform: shopify
  description: "Gets the inventory level for an item at a location."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: inventoryItemId
      type: string
    - name: locationId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: inventoryLevel
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/inventory_levels.json"
      headers: platform.headers
      query:
        inventory_item_ids: inputs.inventoryItemId
        location_ids: inputs.locationId
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: inventoryLevel
          value: steps.request.response_body.inventory_levels
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
