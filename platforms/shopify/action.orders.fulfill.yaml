meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.orders.fulfill
  name: Fulfill Order
  category: Orders
  type: Action
  platform: shopify
  description: "Creates a fulfillment for an order."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: orderId
      type: string
    - name: locationId
      type: string
    - name: trackingNumber
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: fulfillment
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/orders/" + inputs.orderId + "/fulfillments.json"
      headers: platform.headers
      body:
        fulfillment:
          location_id: inputs.locationId
          tracking_number: inputs.trackingNumber
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: fulfillment
          value: steps.request.response_body.fulfillment
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
