meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.orders.update
  name: Update Order
  category: Orders
  type: Action
  platform: shopify
  description: Updates an existing Shopify order.
  version: 1.0.0
  discovery:
    purpose: Modify the details of an existing Shopify order.
    usage_context: Use to update order notes, tags, or customer information after initial placement.
    agent_hints:
      - "Requires the order_id."
    waml_examples:
      - title: Tag Order
        waml: |
          - step: tag
            call: shopify.action.orders.update
            with:
               order_id: 543216789
               tags: priority,vip
               note: Customer requested expedited shipping.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: orderId
      type: string
    - name: note
      type: string
    - name: email
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: order
      type: object

execution:
  - id: =request
    tool: http_client
    params:
      method: PUT
      url: >
        platform.base_url + "/orders/" + inputs.orderId + ".json"
      headers: =platform.headers
      body:
        order:
          id: inputs.orderId
          note: =inputs.note
          email: =inputs.email
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: order
          value: =steps.request.response_body.order
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
