meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.orders.cancel
  name: Cancel Order
  category: Orders
  type: Action
  platform: shopify
  description: "Cancels an existing Shopify order."
  version: "1.0.0"
  discovery:
    purpose: "Cancel an existing Shopify order."
    usage_context: "Use to automate order cancellations based on fraud detection, payment failure, or customer requests."
    agent_hints:
      - "Requires the order_id."
    waml_examples:
      - title: "Cancel Fraudulent Order"
        waml: |
          - step: cancel
            call: shopify.action.orders.cancel
            with:
               order_id: "543216789"
               reason: "fraud"
               note: "Automated cancellation due to high fraud risk score."
               email: true

interface:
  inputs:
    - name: Exec
      type: flow
    - name: orderId
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: order
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/orders/" + inputs.orderId + "/cancel.json"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: order
          value: steps.request.response_body.order
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
