meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.metafields.create
  name: Create Metafield
  category: Metafields
  type: Action
  platform: shopify
  description: "Creates a new Metafield for a resource."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: namespace
      type: string
    - name: key
      type: string
    - name: value
      type: string
    - name: type
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metafield
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/metafields.json"
      headers: "{{ platform.headers }}"
      body:
        metafield:
          namespace: "{{ get 'inputs.namespace' }}"
          key: "{{ get 'inputs.key' }}"
          value: "{{ get 'inputs.value' }}"
          type: "{{ get 'inputs.type' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metafield
          value: "{{ steps.request.response_body.metafield }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
