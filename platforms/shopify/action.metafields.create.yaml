meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.metafields.create
  name: Create Metafield
  category: Metafields
  type: Action
  platform: shopify
  description: Creates a new Metafield for a resource.
  version: 1.0.0
  discovery:
    purpose: Store custom data (metafields) on a Shopify resource (order, product, customer).
    usage_context: Use to store external IDs, custom preferences, or additional context required for third-party integrations.
    agent_hints:
      - "Requires owner_id, owner_resource, namespace, key, and value."
    waml_examples:
      - title: Store External ID
        waml: |
          - step: save_meta
            call: shopify.action.metafields.create
            with:
               owner_id: 543216789
               owner_resource: order
               namespace: external_sync
               key: erp_id
               value: ERP-999
               type: single_line_text_field

interface:
  inputs:
    - name: Exec
      type: flow
    - name: namespace
      type: string
    - name: key
      type: string
    - name: value
      type: string
    - name: type
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: metafield
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/metafields.json"
      headers: =platform.headers
      body:
        metafield:
          namespace: =inputs.namespace
          key: =inputs.key
          value: =inputs.value
          type: inputs.type
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: metafield
          value: =steps.request.response_body.metafield
    default:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
