meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.inventory.adjust
  name: Adjust Inventory Level
  category: Inventory
  type: Action
  platform: shopify
  description: "Adjusts the inventory level of an item at a location."
  version: "1.0.0"
  discovery:
    purpose: "Adjust the inventory level of a product variant at a specific location."
    usage_context: "Use to update stock levels based on warehouse receipts, manual audits, or external sales."
    agent_hints:
      - "Requires inventory_item_id, location_id, and available_adjustment amount."
    waml_examples:
      - title: "Restock Item"
        waml: |
          - step: restock
            call: shopify.action.inventory.adjust
            with:
               inventory_item_id: "808950896"
               location_id: "905684977"
               available_adjustment: 10

interface:
  inputs:
    - name: Exec
      type: flow
    - name: inventoryItemId
      type: string
    - name: locationId
      type: string
    - name: availableAdjustment
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: inventoryLevel
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/inventory_levels/adjust.json"
      headers: platform.headers
      body:
        inventory_item_id: inputs.inventoryItemId
        location_id: inputs.locationId
        available_adjustment: inputs.availableAdjustment
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "200":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: inventoryLevel
          value: steps.request.response_body.inventory_level
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
