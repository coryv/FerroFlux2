meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.products.create
  name: Create Product
  category: Products
  type: Action
  platform: shopify
  description: "Creates a new product."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: title
      type: string
    - name: bodyHtml
      type: string
    - name: vendor
      type: string
    - name: productType
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: product
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/products.json"
      headers: platform.headers
      body:
        product:
          title: inputs.title
          body_html: inputs.bodyHtml
          vendor: inputs.vendor
          product_type: inputs.productType
    returns:
      status: status_code
      body: response_body

routing:
  match: steps.request.status_code
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: product
          value: steps.request.response_body.product
    default:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
