meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.orders.new
  name: New Order
  category: Orders
  type: Trigger
  platform: shopify
  description: Triggers when a new order is placed.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow when a new order is created in Shopify.
    usage_context: Use to automate order confirmation, fulfillment workflows, or customer data synchronization.
    agent_hints:
      - "Provides the full order object, including customer details and line items."
    waml_examples:
      - title: Order Sync
        waml: |
          - step: on_order
            type: trigger
            call: shopify.trigger.orders.new

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: order
      type: object
  settings:
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/orders.json"
      headers: =platform.headers
      query:
        created_at_min: state.last_poll
        status: any
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: foreach
        params:
          items: =steps.query.response_body.orders
          action:
            - tool: emit
              params:
                port: Success
            - tool: emit
              params:
                port: order
                value: item
