meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.customers.new
  name: New Customer
  category: Customers
  type: Trigger
  platform: shopify
  description: Triggers when a new customer registers.
  version: 1.0.0
  discovery:
    purpose: Initialize a workflow when a new customer is registered in Shopify.
    usage_context: Use to trigger onboarding sequences, update internal CRMs, or send welcome gifts.
    agent_hints:
      - "Provides the full customer object, including email, name, and marketing preferences."
    waml_examples:
      - title: Welcome Sequence
        waml: |
          - step: on_customer
            type: trigger
            call: shopify.trigger.customers.new

interface:
  inputs: []
  outputs:
    - name: Success
      type: flow
    - name: customer
      type: object
  settings:
    - name: polling_interval
      label: Polling Interval (minutes)
      type: number
      default: 15

execution:
  - id: query
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/customers.json"
      headers: =platform.headers
      query:
        created_at_min: state.last_poll
    returns:
      status: status_code
      body: response_body

routing:
  match: =steps.query.status_code
  cases:
    "200":
      - tool: foreach
        params:
          items: =steps.query.response_body.customers
          action:
            - tool: emit
              params:
                port: Success
            - tool: emit
              params:
                port: customer
                value: item
