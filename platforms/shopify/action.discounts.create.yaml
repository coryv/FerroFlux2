meta:
  id: shopify.discounts.create
  name: Create Discount (PriceRule)
  category: Discounts
  type: Action
  platform: shopify
  description: "Creates a new PriceRule (Discount)."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: title
      type: string
    - name: targetType
      type: string
    - name: targetSelection
      type: string
    - name: allocationMethod
      type: string
    - name: valueType
      type: string
    - name: value
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: priceRule
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/price_rules.json"
      headers: "{{ platform.headers }}"
      body:
        price_rule:
          title: "{{ get 'inputs.title' }}"
          target_type: "{{ get 'inputs.targetType' }}"
          target_selection: "{{ get 'inputs.targetSelection' }}"
          allocation_method: "{{ get 'inputs.allocationMethod' }}"
          value_type: "{{ get 'inputs.valueType' }}"
          value: "{{ get 'inputs.value' }}"
          starts_at: "2024-01-01T00:00:00Z"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: priceRule
          value: "{{ steps.request.response_body.price_rule }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
