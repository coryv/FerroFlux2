meta:
  id: shopify.orders.create
  name: Create Order
  category: Orders
  type: Action
  platform: shopify
  description: "Creates a new Shopify order."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: lineItems
      type: array
    - name: email
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: order
      type: object

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/orders.json"
      headers: "{{ platform.headers }}"
      body:
        order:
          line_items: "{{ get 'inputs.lineItems' }}"
          email: "{{ get 'inputs.email' }}"
    returns:
      status: status_code
      body: response_body

routing:
  match: "{{ steps.request.status_code }}"
  cases:
    "201":
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: order
          value: "{{ steps.request.response_body.order }}"
    default:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
