meta:
  permissions: ["network:*.myshopify.com"]
  id: shopify.products.list
  name: List Products
  category: Products
  type: Action
  platform: shopify
  description: Lists store products.
  version: 1.0.0
  discovery:
    purpose: Search and retrieve a list of products from the Shopify catalog.
    usage_context: Use to fetch product IDs for inventory management or to sync a catalog to an external marketing platform.
    agent_hints:
      - "Returns an array of product objects including title, id, and variants."
    waml_examples:
      - title: List Products
        waml: |
          - step: get_products
            call: shopify.action.products.list
            with:
               limit: 20

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: products
      type: array

execution:
  - id: request
    tool: paginate
    params:
      method: GET
      url: >
        platform.base_url + "/products.json"
      headers: =platform.headers
      strategy: cursor
      cursor_path: link
      cursor_param: page_info
      items_path: >
        "/products"
    returns:
      items: all_items

routing:
  match: success
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: products
          value: =steps.request.all_items
