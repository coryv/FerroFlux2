meta:
  id: gemini.ai.generate_with_vision
  name: Generate with Vision
  category: AI
  type: Action
  platform: gemini
  description: "Generate a response from a Gemini model using text and image data."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: prompt
      type: string
    - name: image_base64
      type: string
    - name: mime_type
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
  settings:
    - name: temperature
      label: "Temperature"
      type: number
      required: false
      default: 0.7

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/v1beta/models/{{ get 'inputs.model' }}:generateContent"
      headers: "{{ platform.headers }}"
      body:
        contents:
          - role: user
            parts:
              - text: "{{ get 'inputs.prompt' }}"
              - inline_data:
                  mime_type: "{{ get 'inputs.mime_type' }}"
                  data: "{{ get 'inputs.image_base64' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: response
          value: "{{ steps.request.response_body }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
