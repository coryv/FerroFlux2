meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.generate_with_vision
  name: Generate with Vision
  category: AI
  type: Action
  platform: gemini
  description: Analyses images and provides content based on visual inputs.
  version: 1.0.0
  discovery:
    purpose: Extract information from images or provide visual reasoning.
    usage_context: Use this to describe photos, identify objects in a scene, or extract data from screenshots and diagrams.
    agent_hints:
      - "Requires a 'model' with vision capabilities (e.g. 'gemini-1.5-pro')."
      - "Pass image data as base64 or via a file URL in the 'parts' array."
    waml_examples:
      - title: Analyze Screenshot
        waml: |
          - step: see_it
            call: gemini.action.ai.generate_with_vision
            with:
               model: gemini-1.5-pro
               prompt: "What is shown in this image?"
               image_url: "https://example.com/screenshot.png"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: prompt
      type: string
    - name: image_base64
      type: string
    - name: mime_type
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
  settings:
    - name: temperature
      label: Temperature
      type: number
      required: false
      default: 0.7

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/v1beta/models/" + inputs.model + ":'generateContent"'
      headers: =platform.headers
      body:
        contents:
          - role: user
            parts:
              - text: =inputs.prompt
              - inline_data:
                  mime_type: =inputs.mime_type
                  data: =inputs.image_base64
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: =response
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
