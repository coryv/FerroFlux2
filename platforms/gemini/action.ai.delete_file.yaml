meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.delete_file
  name: Delete File
  category: AI
  type: Action
  platform: gemini
  description: Delete a file from the Gemini File API.
  version: 1.0.0
  discovery:
    purpose: Permanently delete a file from the Gemini File API.
    usage_context: Use to manage storage limits and clear sensitive metadata after a generation task is complete.
    agent_hints:
      - "Requires a file_id."
    waml_examples:
      - title: Delete Uploaded Video
        waml: |
          - step: cleanup
            call: gemini.action.ai.delete_file
            with:
               file_id: files/12345

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
      description: Full resource name returned by the File API, e.g. files/abc123
      placeholder: files/abc123
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: >
        platform.base_url + "/v1beta/" + inputs.file_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: 204
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
