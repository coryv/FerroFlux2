meta:
  id: gemini.ai.delete_cache
  name: Delete Context Cache
  category: AI
  type: Action
  platform: gemini
  description: "Delete a specific context cache."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: cache_id
      type: string
      description: "Full resource name returned by Create Context Cache, e.g. cachedContents/abc123"
      placeholder: "cachedContents/abc123"
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: DELETE
      url: "{{ platform.base_url }}/v1beta/{{ get 'inputs.cache_id' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: "204"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: emit
        params:
          port: Success
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
