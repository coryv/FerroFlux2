meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.count_tokens
  name: Count Tokens
  category: AI
  type: Action
  platform: gemini
  description: "Count the number of tokens in a prompt for a specific model."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: total_tokens
      type: number
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/v1beta/models/" + inputs.model + ":countTokens"
      headers: platform.headers
      body:
        contents:
          - parts:
              - text: inputs.text
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: total_tokens
          value: steps.request.response_body.totalTokens
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
