meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.count_tokens
  name: Count Tokens
  category: AI
  type: Action
  platform: gemini
  description: Calculates the token count for a specific prompt or message.
  version: 1.0.0
  discovery:
    purpose: Estimate the cost and context usage of a prompt before generation.
    usage_context: Use this for budget monitoring, context window management, or determining if a document needs to be chunked.
    agent_hints:
      - "Tokenization varies by model; specify the target 'model' for accurate results."
    waml_examples:
      - title: Estimate Request Cost
        waml: |
          - step: check_tokens
            call: gemini.action.ai.count_tokens
            with:
               model: gemini-1.5-pro
               contents:
                  - parts: [{ text: "Evaluate this large JSON file." }]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: total_tokens
      type: number
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/v1beta/models/" + inputs.model + ":countTokens"
      headers: =platform.headers
      body:
        contents:
          - parts:
              - text: =inputs.text
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: total_tokens
          value: =steps.request.response_body.totalTokens
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
