meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.chat
  name: Chat
  category: AI
  type: Action
  platform: gemini
  description: Creates a conversational response using Gemini's chat interface.
  version: 1.0.0
  discovery:
    purpose: Engage in multi-turn natural language conversations with Gemini models.
    usage_context: Use this for interactive assistants, customer support bots, and any task requiring back-and-forth dialogue.
    agent_hints:
      - "Specify the 'model' (e.g. 'gemini-1.5-flash')."
      - "Maintains history via the 'contents' array (role: 'user/model')."
    waml_examples:
      - title: Start Gemini Chat
        waml: |
          - step: ask_gemini
            call: gemini.action.ai.chat
            with:
               model: gemini-1.5-flash
               contents:
                  - role: user
                    parts: [{ text: "Explain quantum entanglement like I'm five." }]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: history
      type: array
    - name: message
      type: string
    - name: tools
      type: array
    - name: tool_config
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
    - name: tool_calls
      type: array
  settings:
    - name: temperature
      label: Temperature
      type: number
      required: false
      default: 0.7
    - name: max_tokens
      label: Max Tokens
      type: number
      required: false
      default: 2048

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >-
        =platform.base_url + "/v1beta/models/" + inputs.model + ":generateContent"
      headers: =platform.headers
      body:
        contents: =inputs.history
        tools: =inputs.tools
        toolConfig: =inputs.tool_config
        generationConfig:
          temperature: =settings.temperature
          maxOutputTokens: =settings.max_tokens
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: response
          value: =steps.request.response_body
      - tool: json_query
        params:
          json: =steps.request.response_body
          path: >
            "/candidates/0/content/parts"
        returns:
          result: parts_result
      - tool: emit
        params:
          port: tool_calls
          value: parts_result
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
