meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.list_files
  name: List Files
  category: AI
  type: Action
  platform: gemini
  description: "Lists all files uploaded to the Gemini File API."
  version: "1.0.0"
  discovery:
    purpose: "Audit and manage multimodal assets (video, audio, PDF) for Gemini generation."
    usage_context: "Use this to track available documents for context windows or clean up old assets."
    agent_hints:
      - "Returns metadata like 'displayName', 'mimeType', and 'state'."
    waml_examples:
      - title: "Find Uploaded Docs"
        waml: |
          - step: see_docs
            call: gemini.action.ai.list_files
            with:
               pageSize: 10

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: files
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/v1beta/files"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: files
          value: steps.request.response_body.files
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
