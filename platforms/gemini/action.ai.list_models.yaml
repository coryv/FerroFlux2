meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.list_models
  name: List Models
  category: AI
  type: Action
  platform: gemini
  description: "List the models available through the Gemini API."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: models
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/v1beta/models"
      headers: platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: models
          value: steps.request.response_body.models
    error:
      - tool: emit
        params:
          port: Error
          value: steps.request.response_body
