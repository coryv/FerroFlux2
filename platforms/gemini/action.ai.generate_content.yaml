meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.generate_content
  name: Generate Content
  category: AI
  type: Action
  platform: gemini
  description: Generates text or multimodal content from a prompt.
  version: 1.0.0
  discovery:
    purpose: Perform single-turn generation for text, code, or data analysis.
    usage_context: Use this for summarization, translation, code generation, and analyzing complex documents or media.
    agent_hints:
      - "Supports up to 1M+ tokens context window in 1.5 Pro."
      - "Use 'generationConfig' for temperature and top-p settings."
    waml_examples:
      - title: Generate Summary
        waml: |
          - step: summarize
            call: gemini.action.ai.generate_content
            with:
               model: gemini-1.5-pro
               contents:
                  - parts: [{ text: "Summarize this 100-page PDF." }]

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: prompt
      type: string
    - name: tools
      type: array
    - name: tool_config
      type: object
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: response
      type: object
    - name: tool_calls
      type: array
  settings:
    - name: temperature
      label: Temperature
      type: number
      required: false
      default: 0.7
    - name: max_tokens
      label: Max Tokens
      type: number
      required: false
      default: 2048

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/v1beta/models/" + inputs.model + ":generateContent"
      headers: =platform.headers
      body:
        contents:
          - role: user
            parts:
              - text: =inputs.prompt
        tools: =inputs.tools
        toolConfig: =inputs.tool_config
        generationConfig:
          temperature: =settings.temperature
          maxOutputTokens: =settings.max_tokens
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: response
          value: =steps.request.response_body
      - tool: json_query
        params:
          json: =steps.request.response_body
          path: >
            "/candidates/0/content/parts"
        returns:
          result: parts_result
      - tool: emit
        params:
          port: tool_calls
          value: parts_result
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
