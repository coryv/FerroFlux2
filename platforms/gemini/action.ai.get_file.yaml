meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.get_file
  name: Get File
  category: AI
  type: Action
  platform: gemini
  description: Get metadata for a specific file in the Gemini File API.
  version: 1.0.0
  discovery:
    purpose: Retrieve metadata for a file in the Gemini File API.
    usage_context: Use to verify a file's state (e.g. processed vs active) before using it in generating content.
    agent_hints:
      - "Requires a file_id."
      - "Returns the file object including URI and processing state."
    waml_examples:
      - title: Get File Info
        waml: |
          - step: fetch_file
            call: gemini.action.ai.get_file
            with:
               file_id: files/12345

interface:
  inputs:
    - name: Exec
      type: flow
    - name: file_id
      type: string
      description: Full resource name returned by the File API, e.g. files/abc123
      placeholder: files/abc123
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: file
      type: object
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: >-
        =platform.base_url + "/v1beta/" + inputs.file_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: file
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
