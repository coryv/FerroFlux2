meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.get_cache
  name: Get Context Cache
  category: AI
  type: Action
  platform: gemini
  description: Get metadata for a specific context cache by its name.
  version: 1.0.0
  discovery:
    purpose: Retrieve metadata for a specific context cache in the Gemini API.
    usage_context: Use to verify cache expiration, model compatibility, and reuse tokens for massive context retrieval.
    agent_hints:
      - "Requires a cache_name."
      - "Returns the cache object including TTL and token count."
    waml_examples:
      - title: Verify Cache
        waml: |
          - step: check_cache
            call: gemini.action.ai.get_cache
            with:
               cache_name: cachedContents/12345

interface:
  inputs:
    - name: Exec
      type: flow
    - name: cache_id
      type: string
      description: Full resource name returned by Create Context Cache, e.g. cachedContents/abc123
      placeholder: cachedContents/abc123
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: cache
      type: object
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: GET
      url: >
        platform.base_url + "/v1beta/" + inputs.cache_id
      headers: =platform.headers
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: cache
          value: =steps.request.response_body
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
