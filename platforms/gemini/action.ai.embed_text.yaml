meta:
  permissions: ["network:generativelanguage.googleapis.com"]
  id: gemini.ai.embed_text
  name: Embed Text
  category: AI
  type: Action
  platform: gemini
  description: Generates vector embeddings for a given text string.
  version: 1.0.0
  discovery:
    purpose: Convert text into numerical vectors for semantic search or clustering.
    usage_context: Use this to build RAG (Retrieval Augmented Generation) pipelines, find similar documents, or classify text based on meaning.
    agent_hints:
      - "Specify the 'model' (e.g. 'text-embedding-004')."
      - "The resulting vector can be stored in a vector database like Pinecone or Supabase."
    waml_examples:
      - title: Embed Document
        waml: |
          - step: vectorize
            call: gemini.action.ai.embed_text
            with:
               model: text-embedding-004
               text: The quick brown fox jumps over the lazy dog.

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: =Error
      type: flow
    - name: =embedding
      type: array
  settings: []

execution:
  - id: =request
    tool: http_client
    params:
      method: POST
      url: >
        platform.base_url + "/v1beta/models/" + inputs.model + ":'embedContent"'
      headers: =platform.headers
      body:
        content:
          parts:
            - text: =inputs.text
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: =steps.request.status_code
      cases:
        - condition: 200
          output: success
        - condition: default
          output: error

routing:
  match: =steps.check_status.branch
  cases:
    success:
      - tool: json_query
        params:
          json: =steps.request.response_body
          path: >
            "/embedding/values"
        returns:
          result: embedding_values
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: embedding
          value: embedding_values
    error:
      - tool: emit
        params:
          port: Error
          value: =steps.request.response_body
