meta:
  id: gemini.ai.embed_text
  name: Embed Text
  category: AI
  type: Action
  platform: gemini
  description: "Generate an embedding from text using a Gemini embedding model."
  version: "1.0.0"

interface:
  inputs:
    - name: Exec
      type: flow
    - name: model
      type: string
    - name: text
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: embedding
      type: array
  settings: []

execution:
  - id: request
    tool: http_client
    params:
      method: POST
      url: "{{ platform.base_url }}/v1beta/models/{{ get 'inputs.model' }}:embedContent"
      headers: "{{ platform.headers }}"
      body:
        content:
          parts:
            - text: "{{ get 'inputs.text' }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/embedding/values"
        returns:
          result: embedding_values
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: embedding
          value: "{{ embedding_values }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
