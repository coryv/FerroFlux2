meta:
  id: open-meteo.forecast.hourly
  name: Get Hourly Forecast
  category: Forecast
  type: Action
  platform: open-meteo
  description: "Fetch hourly weather forecast data for a location, including temperature, humidity, precipitation, and wind over multiple days."
  version: "1.0.0"
  data_strategy: enrich

interface:
  inputs:
    - name: Exec
      type: flow
    - name: latitude
      type: number
    - name: longitude
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: hourly
      type: object
  settings:
    - name: forecast_days
      label: "Forecast Days"
      type: number
      required: false
      default: 7
      min: 1
      max: 16
    - name: hourly_variables
      label: "Hourly Variables (comma-separated)"
      type: string
      required: false
      default: "temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,visibility,uv_index"
      placeholder: "temperature_2m,precipitation_probability,wind_speed_10m,..."
    - name: temperature_unit
      label: "Temperature Unit"
      type: select
      required: false
      default: "celsius"
      options:
        - label: "Celsius"
          value: "celsius"
        - label: "Fahrenheit"
          value: "fahrenheit"
    - name: wind_speed_unit
      label: "Wind Speed Unit"
      type: select
      required: false
      default: "kmh"
      options:
        - label: "km/h"
          value: "kmh"
        - label: "mph"
          value: "mph"
        - label: "m/s"
          value: "ms"
        - label: "knots"
          value: "kn"
    - name: timezone
      label: "Timezone"
      type: string
      required: false
      default: "auto"
      placeholder: "e.g. America/New_York, Europe/London, auto"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/forecast?latitude={{ get 'inputs.latitude' }}&longitude={{ get 'inputs.longitude' }}&hourly={{ get 'settings.hourly_variables' }}&forecast_days={{ get 'settings.forecast_days' }}&temperature_unit={{ get 'settings.temperature_unit' }}&wind_speed_unit={{ get 'settings.wind_speed_unit' }}&timezone={{ get 'settings.timezone' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/hourly"
        returns:
          result: hourly_data
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: hourly
          value: "{{ steps.request.hourly_data }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
