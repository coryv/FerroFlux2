meta:
  permissions: ["network:api.open-meteo.com"]
  id: open-meteo.airquality.get
  name: Get Air Quality
  category: Air Quality
  type: Action
  platform: open-meteo
  description: "Fetch current and forecast air quality data including AQI, PM2.5, PM10, ozone, and other pollutants for a location."
  version: "1.0.0"
  data_strategy: enrich

interface:
  inputs:
    - name: Exec
      type: flow
    - name: latitude
      type: number
    - name: longitude
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: current_air_quality
      type: object
    - name: hourly_air_quality
      type: object
  settings:
    - name: current_variables
      label: "Current Variables (comma-separated)"
      type: string
      required: false
      default: "european_aqi,us_aqi,pm10,pm2_5,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide"
      placeholder: "european_aqi,us_aqi,pm2_5,pm10,..."
    - name: hourly_variables
      label: "Hourly Variables (comma-separated)"
      type: string
      required: false
      default: "pm10,pm2_5,ozone,nitrogen_dioxide"
      placeholder: "pm10,pm2_5,ozone,..."
    - name: forecast_days
      label: "Forecast Days"
      type: number
      required: false
      default: 1
      min: 1
      max: 7
    - name: timezone
      label: "Timezone"
      type: string
      required: false
      default: "auto"
      placeholder: "e.g. America/New_York, auto"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ get 'inputs.latitude' }}&longitude={{ get 'inputs.longitude' }}&current={{ get 'settings.current_variables' }}&hourly={{ get 'settings.hourly_variables' }}&forecast_days={{ get 'settings.forecast_days' }}&timezone={{ get 'settings.timezone' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/current"
        returns:
          result: current_aq
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/hourly"
        returns:
          result: hourly_aq
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: current_air_quality
          value: "{{ steps.request.current_aq }}"
      - tool: emit
        params:
          port: hourly_air_quality
          value: "{{ steps.request.hourly_aq }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
