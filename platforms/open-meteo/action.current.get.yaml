meta:
  id: open-meteo.current.get
  name: Get Current Weather
  category: Current Conditions
  type: Action
  platform: open-meteo
  description: "Fetch current weather conditions for a given latitude and longitude, including temperature, wind, and precipitation."
  version: "1.0.0"
  data_strategy: enrich

interface:
  inputs:
    - name: Exec
      type: flow
    - name: latitude
      type: number
    - name: longitude
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: current_weather
      type: object
  settings:
    - name: temperature_unit
      label: "Temperature Unit"
      type: select
      required: false
      default: "celsius"
      options:
        - label: "Celsius"
          value: "celsius"
        - label: "Fahrenheit"
          value: "fahrenheit"
    - name: wind_speed_unit
      label: "Wind Speed Unit"
      type: select
      required: false
      default: "kmh"
      options:
        - label: "km/h"
          value: "kmh"
        - label: "mph"
          value: "mph"
        - label: "m/s"
          value: "ms"
        - label: "knots"
          value: "kn"
    - name: current_variables
      label: "Current Variables (comma-separated)"
      type: string
      required: false
      default: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day"
      placeholder: "temperature_2m,relative_humidity_2m,wind_speed_10m,..."

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/forecast?latitude={{ get 'inputs.latitude' }}&longitude={{ get 'inputs.longitude' }}&current={{ get 'settings.current_variables' }}&temperature_unit={{ get 'settings.temperature_unit' }}&wind_speed_unit={{ get 'settings.wind_speed_unit' }}&timezone={{ get 'platform.default_timezone' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/current"
        returns:
          result: current_data
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: current_weather
          value: "{{ steps.request.current_data }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
