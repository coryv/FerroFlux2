meta:
  id: open-meteo.geocoding.search
  name: Search Location
  category: Geocoding
  type: Action
  platform: open-meteo
  description: "Search for a city or location by name and return its latitude, longitude, and metadata for use in weather queries."
  version: "1.0.0"
  data_strategy: enrich

interface:
  inputs:
    - name: Exec
      type: flow
    - name: city_name
      type: string
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: results
      type: array
    - name: latitude
      type: number
    - name: longitude
      type: number
  settings:
    - name: count
      label: "Max Results"
      type: number
      required: false
      default: 1
      min: 1
      max: 100
    - name: language
      label: "Language"
      type: string
      required: false
      default: "en"
      placeholder: "e.g. en, de, fr"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "https://geocoding-api.open-meteo.com/v1/search?name={{ get 'inputs.city_name' }}&count={{ get 'settings.count' }}&language={{ get 'settings.language' }}&format=json"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/results"
        returns:
          result: location_list
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/results/0/latitude"
        returns:
          result: first_latitude
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/results/0/longitude"
        returns:
          result: first_longitude
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: results
          value: "{{ steps.request.location_list }}"
      - tool: emit
        params:
          port: latitude
          value: "{{ steps.request.first_latitude }}"
      - tool: emit
        params:
          port: longitude
          value: "{{ steps.request.first_longitude }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
