meta:
  permissions: ["network:api.open-meteo.com"]
  id: open-meteo.forecast.daily
  name: Get Daily Forecast
  category: Forecast
  type: Action
  platform: open-meteo
  description: "Fetch daily weather forecast summaries including high/low temperatures, sunrise/sunset, precipitation totals, and UV index."
  version: "1.0.0"
  data_strategy: enrich

interface:
  inputs:
    - name: Exec
      type: flow
    - name: latitude
      type: number
    - name: longitude
      type: number
  outputs:
    - name: Success
      type: flow
    - name: Error
      type: flow
    - name: daily
      type: object
  settings:
    - name: forecast_days
      label: "Forecast Days"
      type: number
      required: false
      default: 7
      min: 1
      max: 16
    - name: daily_variables
      label: "Daily Variables (comma-separated)"
      type: string
      required: false
      default: "temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,weather_code,sunrise,sunset,uv_index_max,wind_speed_10m_max"
      placeholder: "temperature_2m_max,temperature_2m_min,precipitation_sum,..."
    - name: temperature_unit
      label: "Temperature Unit"
      type: select
      required: false
      default: "celsius"
      options:
        - label: "Celsius"
          value: "celsius"
        - label: "Fahrenheit"
          value: "fahrenheit"
    - name: timezone
      label: "Timezone"
      type: string
      required: false
      default: "auto"
      placeholder: "e.g. America/New_York, Europe/London, auto"

execution:
  - id: request
    tool: http_client
    params:
      method: GET
      url: "{{ platform.base_url }}/forecast?latitude={{ get 'inputs.latitude' }}&longitude={{ get 'inputs.longitude' }}&daily={{ get 'settings.daily_variables' }}&forecast_days={{ get 'settings.forecast_days' }}&temperature_unit={{ get 'settings.temperature_unit' }}&timezone={{ get 'settings.timezone' }}"
      headers: "{{ platform.headers }}"
    returns:
      status: status_code
      body: response_body

  - id: check_status
    tool: switch
    params:
      value: "{{ steps.request.status_code }}"
      cases:
        - condition: "200"
          output: success
        - condition: default
          output: error

routing:
  match: "{{ steps.check_status.branch }}"
  cases:
    success:
      - tool: json_query
        params:
          json: "{{ steps.request.response_body }}"
          path: "/daily"
        returns:
          result: daily_data
      - tool: emit
        params:
          port: Success
      - tool: emit
        params:
          port: daily
          value: "{{ steps.request.daily_data }}"
    error:
      - tool: emit
        params:
          port: Error
          value: "{{ steps.request.response_body }}"
