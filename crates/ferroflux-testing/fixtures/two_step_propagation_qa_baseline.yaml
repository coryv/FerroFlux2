name: Two-Step Propagation QA Baseline
description: "Webhook fires with user_id -> slack.action.users.get -> slack.messages.send_dm. Verifies user object from step 1 propagates into step 2."
triggers:
  - id: webhook_in
    name: Incoming Webhook
    type: core.trigger.webhook
    config:
      path: /two-step-qa
nodes:
  - id: get_user
    name: Get Slack User
    type: slack.action.users.get
    config:
      user_id: =inputs.body.user_id

  - id: send_dm
    name: Send Direct Message
    type: slack.messages.send_dm
    config:
      user_id: =inputs.user.id
      text: "Hello, inputs.user.real_name!"

edges:
  - source_id: webhook_in
    source_handle: body
    target_id: get_user
    target_handle: body

  - source_id: get_user
    source_handle: user
    target_id: send_dm
    target_handle: user
