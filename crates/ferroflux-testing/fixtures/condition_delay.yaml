name: Condition with Delay
description: "=Logic (100 > 50) -> Delay(200ms) -> Log"
triggers:
  - id: webhook_in
    name: Incoming Webhook
    type: core.trigger.webhook
    config:
      path: /cond-delay
nodes:
  - id: set_a
    name: Set A=100
    type: core.action.script
    config:
      script: return 100;
  - id: set_b
    name: Set B=50
    type: core.action.script
    config:
      script: return 50;
  - id: check
    name: "Compare A > B"
    type: core.logic.condition
    config:
      operator: ">"
  - id: wait
    name: Wait 200ms
    type: core.action.delay
    config:
      duration: 200
  - id: log_true
    name: Final Log
    type: core.action.log
    config:
      level: INFO
      message: =Condition TRUE + Delay complete
edges:
  - source_id: webhook_in
    source_handle: Success
    target_id: set_a
    target_handle: Exec
  - source_id: set_a
    source_handle: Success
    target_id: set_b
    target_handle: Exec
  - source_id: set_a
    source_handle: result
    target_id: check
    target_handle: a
  - source_id: set_b
    source_handle: Success
    target_id: check
    target_handle: Exec
  - source_id: set_b
    source_handle: result
    target_id: check
    target_handle: b
  - source_id: check
    source_handle: True
    target_id: wait
    target_handle: Exec
  - source_id: wait
    source_handle: Success
    target_id: log_true
    target_handle: Exec
