name: Delay Steps
description: "Log -> Delay(500ms) -> Log"
triggers:
  - id: webhook_in
    name: Incoming Webhook
    type: core.trigger.webhook
    config:
      path: /delay
nodes:
  - id: log_1
    name: Start Log
    type: core.action.log
    config:
      level: INFO
      message: "Step 1: Start"
  - id: wait
    name: Wait 500ms
    type: core.action.delay
    config:
      duration: 500
      unit: milliseconds
  - id: log_2
    name: End Log
    type: core.action.log
    config:
      level: INFO
      message: "Step 2: End after delay"
edges:
  - source_id: webhook_in
    source_handle: Success
    target_id: log_1
    target_handle: Exec
  - source_id: log_1
    source_handle: Success
    target_id: wait
    target_handle: Exec
  - source_id: wait
    source_handle: Success
    target_id: log_2
    target_handle: Exec
