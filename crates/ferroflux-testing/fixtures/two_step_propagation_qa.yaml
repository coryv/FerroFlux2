name: "Two-Step Propagation QA: Webhook → users.get → send_dm"
description: "QA test: webhook fires with user_id U42, users.get fetches user info, the user object propagates into send_dm's user_id input"
triggers:
  - id: webhook_in
    name: Incoming Webhook
    type: core.trigger.webhook
    config:
      path: /two-step-propagation
nodes:
  - id: get_user
    name: Get Slack User
    type: slack.action.users.get
    config:
      user_id: U42

  - id: send_dm
    name: Send Direct Message
    type: slack.messages.send_dm
    config:
      text: Hello from propagation test
edges:
  - source_id: webhook_in
    source_handle: body
    target_id: get_user
    target_handle: Exec

  - source_id: get_user
    source_handle: Success
    target_id: send_dm
    target_handle: Exec

  - source_id: get_user
    source_handle: user
    target_id: send_dm
    target_handle: user_id
