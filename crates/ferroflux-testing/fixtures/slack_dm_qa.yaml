name: "Webhook to Slack Send DM"
description: "QA test: webhook receives user_id and text, then sends a Slack DM via conversations.open + chat.postMessage"
triggers:
  - id: "webhook_in"
    name: "Incoming Webhook"
    type: "core.trigger.webhook"
    config:
      path: "/slack-dm-test"
nodes:
  - id: "send_dm"
    name: "Send Slack DM"
    type: "slack.messages.send_dm"
    config:
      user_id: "U99"
      text: "hello world"
edges:
  - source_id: "webhook_in"
    source_handle: "Success"
    target_id: "send_dm"
    target_handle: "Exec"
