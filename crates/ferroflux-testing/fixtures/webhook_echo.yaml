name: "Webhook Echo"
description: "Receives a POST webhook and logs the raw body"
triggers:
  - id: "webhook_in"
    name: "Incoming Webhook"
    type: "core.trigger.webhook"
    config:
      path: "/echo"
nodes:
  - id: "log_out"
    name: "Debug Log"
    type: "core.action.log"
    config:
      level: "'INFO'"
      message: "Webhook data received"
edges:
  - source_id: "webhook_in"
    source_handle: "Success"
    target_id: "log_out"
    target_handle: "Exec"
  - source_id: "webhook_in"
    source_handle: "body"
    target_id: "log_out"
    target_handle: "body" # Violation of strict WAML? Let's test if the engine handles it.
