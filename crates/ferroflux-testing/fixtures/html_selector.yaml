name: "HTML Selector Extraction"
description: "Extracts h1 text from an HTML string via webhook."
triggers:
  - id: "webhook_in"
    name: "Incoming Webhook"
    type: "core.trigger.webhook"
    config:
      path: "/html-test"
nodes:
  - id: "html_extract"
    name: "HTML Parser"
    type: "core.utils.html"
    config:
      html: "=html"
      selector: "h1"
  - id: "log_res"
    name: "Log Result"
    type: "core.action.log"
    config:
      message: "Extracted H1"
edges:
  - source_id: "webhook_in"
    source_handle: "Success"
    target_id: "html_extract"
    target_handle: "Exec"
  - source_id: "html_extract"
    source_handle: "Exec"
    target_id: "log_res"
    target_handle: "Exec"
  - source_id: "html_extract"
    source_handle: "result"
    target_id: "log_res"
    target_handle: "body"
