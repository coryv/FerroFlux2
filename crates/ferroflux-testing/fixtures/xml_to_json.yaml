name: "XML to JSON Pipeline"
description: "Parses XML and extracts a field using JSON query."
triggers:
  - id: "webhook_in"
    name: "Incoming Webhook"
    type: "core.trigger.webhook"
    config:
      path: "/xml-test"
nodes:
  - id: "xml_parse"
    name: "XML Parser"
    type: "core.utils.xml"
    config:
      xml: "=xml"
  - id: "json_query"
    name: "JSON Query"
    type: "core.utils.json"
    config:
      operation: "query"
      expression: "root.item.title"
  - id: "log_res"
    name: "Log Result"
    type: "core.action.log"
    config:
      message: "Extracted Title"
edges:
  - source_id: "webhook_in"
    source_handle: "Success"
    target_id: "xml_parse"
    target_handle: "Exec"
  - source_id: "xml_parse"
    source_handle: "Exec"
    target_id: "json_query"
    target_handle: "Exec"
  - source_id: "xml_parse"
    source_handle: "result"
    target_id: "json_query"
    target_handle: "input"
  - source_id: "json_query"
    source_handle: "Exec"
    target_id: "log_res"
    target_handle: "Exec"
  - source_id: "json_query"
    source_handle: "result"
    target_id: "log_res"
    target_handle: "body"
