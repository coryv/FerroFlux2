name: Slack DM QA Baseline Workflow
description: "Webhook receives { user_id, text } and sends a Slack DM via slack.messages.send_dm"
triggers:
  - id: webhook_in
    name: Incoming Webhook
    type: core.trigger.webhook
    config:
        path: /slack-dm-qa
nodes:
  - id: send_dm
    name: Send Direct Message
    type: slack.messages.send_dm
    config:
      user_id: =body.user_id
      text: =body.text
edges:
  - source_id: webhook_in
    source_handle: Success
    target_id: send_dm
    target_handle: Exec
  - source_id: webhook_in
    source_handle: body
    target_id: send_dm
    target_handle: body
