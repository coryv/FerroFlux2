name: "Simple ETL Workflow"
description: "Webhook to Log"
triggers:
  - id: "webhook_in"
    name: "Incoming Webhook"
    type: "core.trigger.webhook"
    config:
        path: "/etl-webhook"
nodes:
  - id: "log_out"
    name: "Log Message"
    type: "core.action.log"
    config:
      level: "INFO"
      message: "Received data: {{ get 'body.data' }}"
edges:
  - source_id: "webhook_in"
    source_handle: "body"
    target_id: "log_out"
    target_handle: "body"
