[package]
name = "ferroflux-connectors"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bevy_ecs = "0.13.0"
chrono = { version = "0.4", features = ["serde"] }
ferroflux-types = { path = "../ferroflux-types" }
ferroflux-db = { path = "../ferroflux-db" }
ferroflux-security = { path = "../ferroflux-security" }
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream"] }
uuid = { version = "1.7", features = ["serde", "v4"] }
async-channel = "2.3"
rss = "2.0"
ssh2 = "0.9"
suppaftp = "5.0"
quick-xml = { version = "0.31", features = ["serialize"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.36", features = ["full"] }
