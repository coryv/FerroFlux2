[package]
name = "ferroflux_core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-channel = "2.3.1"
async-trait = "0.1.77"
bevy_ecs = "0.13.0"
blake3 = { version = "1.5.1", features = ["serde"] }
chrono = { version = "0.4.34", features = ["serde"] }
cron = "0.12.0"
dashmap = "5.5.3"
dotenv = "0.15.0"
ipnet = "2.9.0"
once_cell = "1.19.0"
petgraph = "0.6.4"
rand = "0.8.5"
reqwest = { version = "0.11.24", features = ["json", "blocking", "multipart", "stream"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
serde_yaml = "0.9.32"
tokio = { version = "1.36.0", features = ["full"] }
url = "2.5.0"
uuid = { version = "1.7.0", features = ["serde", "v4", "v5"] }
base64 = "0.22.1"
futures = "0.3.31"
async-stream = "0.3.6"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
ferroflux-integration = { path = "../ferroflux-integration" }
ferroflux-iam = { path = "../ferroflux-iam" }
ferroflux-security = { path = "../ferroflux-security" }
ferroflux-types = { path = "../ferroflux-types" }
ferroflux-db = { path = "../ferroflux-db" }
tracing = "0.1"
handlebars = "5.1.0"
jmespath = "0.4.0"
schemars = { version = "0.8", features = ["chrono"] }

[dev-dependencies]
wiremock = "0.6"
ferroflux-compute-wasm = { path = "../ferroflux-compute-wasm" }
ferroflux-connectors = { path = "../ferroflux-connectors" }
ferroflux-tools = { path = "../ferroflux-tools" }
tracing-subscriber = "0.3"
