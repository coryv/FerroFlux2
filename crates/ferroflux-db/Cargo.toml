[package]
name = "ferroflux-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bevy_ecs = "0.13.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
ferroflux-security = { path = "../ferroflux-security" }
ferroflux-types = { path = "../ferroflux-types" }
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.7", features = ["serde", "v4"] }
