[package]
name = "ferroflux-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bevy_ecs = "0.13.0"
ferroflux-types = { path = "../ferroflux-types" }
ferroflux-security = { path = "../ferroflux-security" }
ferroflux-db = { path = "../ferroflux-db" }
ferroflux-iam = { path = "../ferroflux-iam" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rhai = { version = "1.17", features = ["sync", "serde"] }
tracing = "0.1"
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream"] }
jmespath = "0.4.0"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
evalexpr = "11.3"
schemars = { version = "0.8", features = ["chrono"] }
lettre = { version = "0.11.19", features = ["builder"] }
base64 = "0.22"
ipnet = "2.9"
url = "2.5"
quick-xml = { version = "0.36", features = ["serialize"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
scraper = "0.19"
pdf-extract = "0.7"
printpdf = "0.7"


aws-sigv4 = { version = "1.0", features = ["http0-compat", "sign-http"] }


aws-credential-types = "1.0"
aws-smithy-runtime-api = { version = "1.0", features = ["http-02x"] }
aws-smithy-types = "1.0"
http02 = { package = "http", version = "0.2" }
sqlx = { version = "0.8.6", features = ["postgres", "mysql", "runtime-tokio-rustls", "chrono", "uuid", "json"] }
mongodb = "3.5.2"
once_cell = "1.21.4"
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread"] }
futures = "0.3.32"
redis_actual = { version = "1.1.0", package = "redis", features = ["tokio-comp", "tokio-rustls-comp"] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp"] }



[dev-dependencies]
tokio = { version = "1.36.0", features = ["full"] }
wiremock = "0.6"
