[package]
name = "ferroflux-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bevy_ecs = "0.13.0"
ferroflux-types = { path = "../ferroflux-types" }
ferroflux-db = { path = "../ferroflux-db" }
ferroflux-iam = { path = "../ferroflux-iam" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rhai = { version = "1.17", features = ["sync", "serde"] }
tracing = "0.1"
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream"] }
jmespath = "0.4.0"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
handlebars = "5.1.0"
evalexpr = "11.3"
schemars = { version = "0.8", features = ["chrono"] }
lettre = { version = "0.11.19", features = ["builder"] }
base64 = "0.22"
ipnet = "2.9"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.36.0", features = ["full"] }
wiremock = "0.6"
