[package]
name = "ferroflux-types"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-channel = "2.3"
bevy_ecs = "0.13.0"
reqwest = { version = "0.11", features = ["json", "blocking", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.7", features = ["serde", "v4"] }
