[package]
name = "ferroflux-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
ferroflux-security = { path = "../ferroflux-security" }
ferroflux-iam = { path = "../ferroflux-iam" }

[[bin]]
name = "ferroflux-validate"
path = "src/bin/ferroflux-validate.rs"

[dev-dependencies]
tempfile = "3"
