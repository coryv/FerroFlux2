[package]
name = "ferroflux-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ferroflux-security = { path = "../ferroflux-security" }
ferroflux-iam = { path = "../ferroflux-iam" }

[[bin]]
name = "ferroflux-validate"
path = "src/bin/ferroflux-validate.rs"

[[bin]]
name = "ferroflux-sign"
path = "src/bin/sign.rs"

[dev-dependencies]
tempfile = "3"
